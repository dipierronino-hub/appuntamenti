// Vibrazione leggera sui pulsanti principali (fase di cattura: arriva prima di ogni altra azione).
const TOCCO_APTICO = '.fab, .btn-primary, .tab, .rapide>a, .azioni-contatto>*, .seg>button, .week-day, .cal-cell, [data-act="stato"]';
document.addEventListener('click', e => {
  const el = e.target.closest(TOCCO_APTICO);
  if (el && !el.disabled && el.getAttribute('aria-disabled') !== 'true') vibra();
}, true);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACTIONS[el.dataset.act]) return;
  if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  ACTIONS[el.dataset.act](el.dataset, el);
});

// Tasto Indietro (Android): chiude la schermata in cima, poi torna all'agenda, poi esce.
function armaIndietro() { history.pushState({ guardia: 1 }, ''); }
window.addEventListener('popstate', () => {
  if (livelli.length) { closeModal(); armaIndietro(); }
  else if (S.user && S.vista !== 'agenda') { vaiA('agenda'); armaIndietro(); }
});

// ===================== VOCE =====================
// Prossimo appuntamento aperto del contatto (futuro più vicino, altrimenti il più recente).
function appuntamentoProssimo(cid) {
  const oggi = todayISO();
  const lista = Object.entries(S.appuntamenti)
    .filter(([, a]) => a.contattoId === cid && !CHIUSI.includes(a.stato))
    .sort(([, x], [, y]) => byDt(x, y));
  const futuro = lista.find(([, a]) => a.data >= oggi);
  return (futuro || lista[0] || [null])[0];
}

// Esegue il comando riconosciuto. Il modulo si apre precompilato: il salvataggio resta una conferma dell'utente.
function voiceExec(raw) {
  const c = classificaComando(raw);
  // Con la chiave Gemini le frasi libere ("Promemoria lunedì...") diventano un nuovo appuntamento compilato dall'IA.
  if ((c.tipo === 'nuovo' || c.tipo === 'sconosciuto') && lsGet('gemini_key')) {
    openAppForm({ testoSmart: raw });
    return;
  }
  switch (c.tipo) {
    case 'nuovo': {
      const contatto = trovaContatto(S.contatti, c.nome);
      const pre = { data: c.data || undefined, ora: c.ora || undefined, motivo: c.motivo };
      if (contatto) openAppForm({ ...pre, contattoId: contatto.id });
      else openAppForm({ ...pre, nome: capitalizza(c.nome) });
      break;
    }
    case 'sposta': {
      const contatto = trovaContatto(S.contatti, c.nome);
      if (!contatto) { toast(`Nessun contatto trovato per "${c.nome}"`); break; }
      const aid = appuntamentoProssimo(contatto.id);
      if (!aid) { toast(`Nessun appuntamento aperto per ${contatto.nome}`); break; }
      openRimanda(aid, { data: c.data || undefined, ora: c.ora || undefined, motivo: '' });
      break;
    }
    case 'chiama': {
      const contatto = trovaContatto(S.contatti, c.nome);
      if (!contatto) { toast(`Nessun contatto trovato per "${c.nome}"`); break; }
      if (!contatto.telefono) { toast(`${contatto.nome} non ha un numero di telefono`); break; }
      window.location.href = 'tel:' + contatto.telefono;
      break;
    }
    case 'cerca': {
      while (livelli.length) closeModal();
      S.qCerca = c.nome;
      vaiA('cerca');
      break;
    }
    case 'agenda': {
      while (livelli.length) closeModal();
      S.giorno = todayISO();
      vaiA('agenda');
      break;
    }
    default:
      toast("Comando non riconosciuto. Prova: 'nuovo appuntamento con Mario Rossi domani alle 10'");
  }
}

// Avvia il riconoscimento vocale; il pulsante pulsa mentre ascolta.
// Senza callback il testo diventa un comando; con callback lo riceve il chiamante (es. il modulo).
function voiceStart(btn = $('#mic'), suTesto = null) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Riconoscimento vocale non disponibile su questo browser'); return; }
  const rec = new SR();
  rec.lang = 'it-IT';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    toast('Ho capito: ' + t);
    if (suTesto) suTesto(t); else voiceExec(t);
  };
  rec.onerror = e => toast('Errore vocale: ' + e.error);
  rec.onend = () => btn?.classList.remove('ascolto');
  btn?.classList.add('ascolto');
  rec.start();
}

// ===================== AVVIO, NOTIFICHE, INSTALLAZIONE =====================
// Dopo il primo caricamento dei dati: promemoria e apertura da notifica (?app=ID).
function datiPronti() {
  controllaPromemoria();
  // Rinnova in silenzio l'iscrizione push (il telefono a volte la cambia).
  iscriviPush();
  contattoCondiviso();
  const id = new URLSearchParams(location.search).get('app');
  if (id && S.appuntamenti[id]) {
    history.replaceState(null, '', location.pathname);
    armaIndietro();
    openDettaglio(id);
  }
}

setInterval(() => {
  controllaPromemoria();
  // la linea "ora" dell'agenda avanza col tempo
  if (S.user && S.vista === 'agenda' && S.giorno === todayISO() && !livelli.length) render();
}, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { controllaPromemoria(); if (S.user && ['agenda', 'calendario'].includes(S.vista)) render(); } });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* l'app funziona anche senza */ });
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.apri && S.appuntamenti[e.data.apri]) openDettaglio(e.data.apri);
  });
}

// ===================== AUTENTICAZIONE =====================
const configMancante = FIREBASE_CONFIG.apiKey === 'INSERIRE';
let auth = null, db = null;

if (configMancante) {
  $('#configBanner').hidden = false;
  $('#login').hidden = false;
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.database();

  auth.onAuthStateChanged(u => {
    S.user = u;
    if (u) {
      $('#login').hidden = true;
      $('#app').hidden = false;
      armaIndietro();
      attachListeners();
      render();
    } else {
      detachListeners();
      while (livelli.length) closeModal();
      $('#main').innerHTML = '';
      S.contatti = {}; S.appuntamenti = {}; S.impostazioni = {};
      $('#app').hidden = true;
      $('#login').hidden = false;
    }
  });

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector('button');
    $('#loginErr').textContent = '';
    btn.disabled = true;
    btn.textContent = 'Accesso in corso…';
    try {
      await auth.signInWithEmailAndPassword(f.email.value.trim(), f.password.value);
    } catch (err) {
      $('#loginErr').textContent = 'Accesso non riuscito. Controlla email e password.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Accedi';
    }
  });
}
