        <span style="display:flex;gap:4px">${a.rinvii ? `<span class="tag tag-warn">${esc(a.rinvii)}× rinviato</span>` : ''}${inRitardo ? '<span class="tag tag-bad">in ritardo</span>' : ''}${tagStato(a)}</span>
      </div>
      <div class="card-title" style="text-decoration:${a.stato === 'annullato' ? 'line-through' : 'none'};overflow-wrap:anywhere">${esc(a.motivo || c.nome || 'Appuntamento')}</div>
      <div class="card-meta" style="flex-wrap:wrap"><span>${meta}</span></div>
      ${rigaRapide(a, c)}
    </div>
  </div>`;
}

// Fondo della scheda: importo con stato del pagamento, poi le azioni rapide.
function rigaRapide(a, c) {
  const pag = conPagamento(a)
    ? `<div style="display:flex;gap:8px;align-items:center">${haImporto(a) ? `<span class="importo" style="color:${coloreMov(a)}">${esc(importoFirmato(a))}</span>` : ''}${tagPagamento(a)}</div>`
    : '';
  return pag + (a.stato === 'annullato' ? '' : rapide(c, a));
}

// Pulsanti rapidi WhatsApp / Chiama / Naviga (48 px). data-act="rapida" evita che il tocco apra la scheda.
function rapide(c, a = null) {
  const nome = esc(c.nome || '');
  const b = [];
  if (c.telefono) {
    b.push(`<a class="r-wa" data-act="rapida" href="${esc(linkWhatsApp(c.telefono, a ? messaggioWhatsApp(a, c) : ''))}" target="_blank" rel="noopener" aria-label="WhatsApp a ${nome}">${icon('chat', 21)}</a>`);
    b.push(`<a class="r-tel" data-act="rapida" href="tel:${esc(c.telefono)}" aria-label="Chiama ${nome}">${icon('phone', 21)}</a>`);
  }
  if (a?.luogo) b.push(`<a class="r-map" data-act="rapida" href="${esc(linkNavigazione(a.luogo))}" target="_blank" rel="noopener" aria-label="Naviga verso ${esc(a.luogo)}">${icon('nav', 21)}</a>`);
  return b.length ? `<div class="rapide">${b.join('')}</div>` : '';
}

// ----- Agenda del giorno: elenco o linea del tempo, con striscia della settimana -----
function renderAgenda() {
  const oggi = todayISO();
  if (!S.giorno) S.giorno = oggi;
  const sel = S.giorno;
  const selD = isoToDate(sel);
  const lun = inizioSettimana(selD);
  const giorni = Array.from({ length: 7 }, (_, i) => isoOf(addDays(lun, i)));
  const conApp = new Set(Object.values(S.appuntamenti).filter(a => a.stato !== 'annullato').map(a => a.data));
  const dom = addDays(lun, 6);
  const weekLabel = lun.getMonth() === dom.getMonth()
    ? `${lun.getDate()} – ${dom.getDate()} ${dom.toLocaleDateString('it-IT', { month: 'long' })}`
    : `${lun.getDate()} ${lun.toLocaleDateString('it-IT', { month: 'short' })} – ${dom.getDate()} ${dom.toLocaleDateString('it-IT', { month: 'short' })}`;
  const kicker = (sel === oggi ? 'Oggi · ' : sel === isoOf(addDays(new Date(), 1)) ? 'Domani · ' : sel === isoOf(addDays(new Date(), -1)) ? 'Ieri · ' : '') + fmt(sel, { weekday: 'long' });
  const titolo = fmt(sel, { day: 'numeric', month: 'long' }) + (selD.getFullYear() !== new Date().getFullYear() ? ' ' + selD.getFullYear() : '');

  const items = appDelGiorno(sel);
  const anima = S.animaGiorno;
  S.animaGiorno = false;
  const attivi = items.filter(a => a.stato !== 'annullato');
  const summary = attivi.length
    ? `${plurale(attivi.length, 'appuntamento', 'appuntamenti')} · dalle ${attivi[0].ora} alle ${fineApp(attivi[attivi.length - 1])}`
      + (sovrappostiNelGiorno(attivi) ? ' · <span style="color:var(--color-warn)">sovrapposizioni</span>' : '')

    : 'Nessun appuntamento';

  const toggle = (modo, ic, label) =>
    `<button data-act="modoAgenda" data-m="${modo}" aria-label="${label}" aria-pressed="${S.modoAgenda === modo}">${icon(ic)}</button>`;

  let corpo = '';
  if (!items.length) {
    corpo = `<div class="glass vuoto">
      <span class="ico">${icon('cal', 26)}</span>
      <div class="card-title">Giornata libera</div>
      <div class="muted">Nessun appuntamento in programma.</div>
      <button class="btn btn-primary" data-act="nuovoApp" data-data="${sel}">${icon('plus', 16)} Aggiungi appuntamento</button>
    </div>`;
  } else if (S.modoAgenda === 'timeline') {
    corpo = timeline(items, sel === oggi);
  } else {
    // (la linea "Ora" compare prima del primo appuntamento non ancora iniziato)
    const adesso = oraAdesso();
    let messo = sel !== oggi;
    corpo = '<div style="display:flex;flex-direction:column;gap:16px">' + items.map(a => {
      let pre = '';
      if (!messo && a.ora > adesso) {
        messo = true;
        pre = `<div class="ora-adesso"><span>Ora · ${adesso}</span><span></span></div>`;
      }
      return pre + voceApp(a);
    }).join('') + (!messo && items.length ? `<div class="ora-adesso"><span>Ora · ${adesso}</span><span></span></div>` : '') + '</div>';
  }

  $('#main').innerHTML = `<div class="view">
    <div class="head">
      <div><div class="card-kicker">${esc(kicker)}</div><h1>${esc(titolo)}</h1></div>
      <div class="toggle">${toggle('lista', 'list', 'Lista')}${toggle('timeline', 'clock', 'Linea del tempo')}</div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <button class="btn btn-ghost btn-icon" data-act="settimana" data-k="-7" aria-label="Settimana precedente">${icon('left')}</button>
        <div style="display:flex;gap:10px;align-items:center">
          <span style="font-size:13px;font-weight:600;color:var(--color-muted)">${esc(weekLabel)}</span>
          ${sel !== oggi ? '<button class="btn btn-secondary chip-oggi" data-act="vaiOggi">Oggi</button>' : ''}
        </div>
        <button class="btn btn-ghost btn-icon" data-act="settimana" data-k="7" aria-label="Settimana successiva">${icon('right')}</button>
      </div>
      <div class="week">
        ${giorni.map(g => {
          const cls = ['week-day', g === sel && 'sel', g === oggi && 'oggi', conApp.has(g) && 'has'].filter(Boolean).join(' ');
          const d = isoToDate(g);
          return `<button class="${cls}" data-act="giorno" data-d="${g}" aria-label="${esc(fmtData(g))}" aria-pressed="${g === sel}">
            <span class="wd">${d.toLocaleDateString('it-IT', { weekday: 'short' }).slice(0, 3)}</span>
            <span class="wn">${d.getDate()}</span>
            <span class="dot"></span>
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="summary">${summary}</div>
    ${pilloleTotali(totaliAperti(attivi))}
    <div class="${anima ? 'entra-giorno' : ''}" style="display:flex;flex-direction:column;gap:16px">${corpo}</div>
  </div>`;
}

function sovrappostiNelGiorno(lista) {
  return lista.some((a, i) => lista.slice(i + 1).some(b => minuti(b.ora) < minuti(a.ora) + (Number(a.durata) || 30)));
}

// Linea del tempo: 64 px per ora, dalle 8 alle 20 (si allarga se serve).
function timeline(items, eOggi) {
  const PX = 64 / 60;
  const attivi = items.length ? items : [];
  let da = 8 * 60, a = 20 * 60;
  attivi.forEach(x => { da = Math.min(da, Math.floor(minuti(x.ora) / 60) * 60); a = Math.max(a, Math.ceil((minuti(x.ora) + (Number(x.durata) || 30)) / 60) * 60); });
  a = Math.min(a, 24 * 60);
  const altezza = (a - da) * PX + 12;
  const ore = [];
  for (let m = da; m <= a; m += 60) ore.push(m);
  const ora = new Date(), mAdesso = ora.getHours() * 60 + ora.getMinutes();
  // Colonne affiancate per gli appuntamenti sovrapposti.
  const colonne = [];
  const pos = items.map(x => {
    const ini = minuti(x.ora), fine = ini + (Number(x.durata) || 30);
    let col = colonne.findIndex(f => f <= ini);
    if (col < 0) { col = colonne.length; colonne.push(fine); } else colonne[col] = fine;
    return { x, ini, fine, col };
  });
  const nCol = Math.max(1, colonne.length);
  return `<div class="tl" style="height:${altezza}px">
    ${ore.map(m => `<div class="tl-ora" style="top:${(m - da) * PX}px"><span>${hhmm(m)}</span><span></span></div>`).join('')}
    ${eOggi && mAdesso >= da && mAdesso <= a ? `<div class="tl-now" style="top:${(mAdesso - da) * PX}px"></div>` : ''}
    ${pos.map(({ x, ini, fine, col }) => {
      const spento = x.stato === 'annullato' || passato(x);
      const w = `(100% - 58px) / ${nCol}`;
      const alto = Math.max((fine - ini) * PX, 44);
      const ritardo = x.data < todayISO() && !CHIUSI.includes(x.stato);
      return `<div class="tl-block" data-stato="${esc(x.stato)}"${ritardo ? ' data-ritardo' : ''} data-act="apri" data-id="${esc(x.id)}" role="button" tabindex="0" style="left:calc(52px + ${w} * ${col});width:calc(${w} - 6px);top:${(ini - da) * PX + 1}px;height:${alto - 2}px;opacity:${spento ? '.5' : '1'}">
        <div class="tl-t"><span>${esc(x.ora)}–${esc(fineApp(x))}</span><span>${conPagamento(x) ? `<b style="color:${coloreMov(x)}">${esc(haImporto(x) ? importoFirmato(x) : etichettaPag(x))}</b> · ` : ''}${esc(ETICHETTE_STATO[x.stato] || '')}</span></div>
        <div class="tl-ti" style="text-decoration:${x.stato === 'annullato' ? 'line-through' : 'none'}">${esc(x.motivo || x.contatto.nome || 'Appuntamento')}</div>
        ${alto >= 70 ? `<div class="tl-c">${esc(x.contatto.nome || '')}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

// ----- Calendario del mese -----
function renderCalendario() {
  const oggi = todayISO();
  if (!S.mese) S.mese = oggi.slice(0, 8) + '01';
  if (!S.calSel) S.calSel = oggi;
  const primo = isoToDate(S.mese);
  const ini = inizioSettimana(primo);
  const ultimo = new Date(primo.getFullYear(), primo.getMonth() + 1, 0);
  const settimane = Math.ceil(((primo.getDay() + 6) % 7 + ultimo.getDate()) / 7);
  const perGiorno = {};
  Object.values(S.appuntamenti).forEach(a => { if (a.stato !== 'annullato') perGiorno[a.data] = (perGiorno[a.data] || 0) + 1; });
  const dow = Array.from({ length: 7 }, (_, i) => addDays(ini, i).toLocaleDateString('it-IT', { weekday: 'short' }).slice(0, 3));
  const celle = Array.from({ length: settimane * 7 }, (_, i) => {
    const d = addDays(ini, i), g = isoOf(d);
    const fuori = d.getMonth() !== primo.getMonth();
    const isSel = g === S.calSel, isOggi = g === oggi;
    const n = perGiorno[g] || 0;
    const cls = ['cal-cell', fuori && 'fuori', isSel && 'sel', isOggi && 'oggi'].filter(Boolean).join(' ');
    return `<button class="${cls}" data-act="calGiorno" data-d="${g}" aria-label="${esc(fmtData(g))}${n ? ', ' + plurale(n, 'appuntamento', 'appuntamenti') : ''}" aria-pressed="${isSel}">
      <span class="n">${d.getDate()}</span>
      <span class="dots">${'<i></i>'.repeat(Math.min(n, 3))}${n > 3 ? `<span>+${n - 3}</span>` : ''}</span>
    </button>`;
  }).join('');
  const items = appDelGiorno(S.calSel);
  const anima = S.animaGiorno;
  S.animaGiorno = false;
  const titoloMese = primo.toLocaleDateString('it-IT', { month: 'long' }) + (primo.getFullYear() !== new Date().getFullYear() ? ' ' + primo.getFullYear() : '');

  $('#main').innerHTML = `<div class="view">
    <div class="head">
      <div><div class="card-kicker">Calendario${primo.getFullYear() === new Date().getFullYear() ? ' · ' + primo.getFullYear() : ''}</div><h1>${esc(titoloMese)}</h1></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary btn-icon" data-act="mese" data-k="-1" aria-label="Mese precedente">${icon('left')}</button>
        <button class="btn btn-secondary btn-icon" data-act="mese" data-k="1" aria-label="Mese successivo">${icon('right')}</button>
      </div>
    </div>
    <div class="glass cal${anima ? ' entra-giorno' : ''}">
      ${dow.map(w => `<div class="cal-dow">${esc(w)}</div>`).join('')}
      ${celle}
    </div>
    <div class="sezione">
      <h2><span>${esc(etichettaGiorno(S.calSel))}</span>${S.mese !== oggi.slice(0, 8) + '01' || S.calSel !== oggi ? '<button class="btn btn-secondary chip-oggi" data-act="calOggi">Oggi</button>' : ''}</h2>
      ${items.length
        ? `<div style="display:flex;flex-direction:column;gap:16px">${items.map(voceApp).join('')}</div>
           <button class="btn btn-ghost" data-act="apriGiorno" data-d="${S.calSel}" style="align-self:flex-start">Apri nell’agenda ${icon('right', 16)}</button>`
        : `<div class="muted">Nessun appuntamento. <button class="btn btn-ghost" data-act="nuovoApp" data-data="${S.calSel}" style="min-height:0;padding:0 4px">Aggiungi</button></div>`}
    </div>
  </div>`;
}

// ----- Ricerca su appuntamenti e contatti -----
function renderCerca() {
  if (!$('#main [data-vista="cerca"]')) {
    const chip = (f, t) => `<button data-act="filtro" data-f="${f}" aria-pressed="${S.filtro === f}">${t}</button>`;
    $('#main').innerHTML = `<div class="view" data-vista="cerca">
      <div class="head"><div><div class="card-kicker">Appuntamenti e contatti</div><h1>Cerca</h1></div></div>
      <div class="search">${icon('search')}
        <input id="qCerca" class="input" type="search" placeholder="Nome, motivo, luogo, azienda, note…" value="${esc(S.qCerca)}" autocomplete="off">
      </div>
      <div class="seg">${chip('da-fare', 'Da fare')}${chip('incassi', 'Pagamenti')}${chip('passati', 'Passati')}${chip('tutti', 'Tutti')}</div>
      <div id="risultati" style="display:flex;flex-direction:column;gap:16px"></div>
    </div>`;

// Aggiorna solo i risultati mentre si digita, così il campo non perde il focus.
function risultatiCerca() {
  const box = $('#risultati');
  if (!box) return;
  document.querySelectorAll('[data-act="filtro"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.filtro)));
  const q = norm(S.qCerca);
  const oggi = todayISO();
  let lista = appuntamentiCompleti();
  if (S.filtro === 'da-fare') lista = lista.filter(a => !CHIUSI.includes(a.stato)).sort(byDt);
  else if (S.filtro === 'passati') lista = lista.filter(a => a.data < oggi).sort((x, y) => byDt(y, x));
  else if (S.filtro === 'incassi') lista = lista.filter(a => residuo(a) > 0).sort(byDt);
  else lista.sort(byDt);
  if (q) lista = lista.filter(a => norm(`${a.contatto.nome || ''} ${a.motivo || ''} ${a.luogo || ''} ${a.azienda || ''} ${a.note || ''} ${a.contatto.telefono || ''}`).includes(q));
  const contatti = q ? contattiOrdinati().filter(c => norm(`${c.nome || ''} ${c.telefono || ''} ${c.email || ''} ${c.note || ''} ${mandantiDi(c).join(' ')}`).includes(q)) : [];
  let html = '';
  if (S.filtro === 'incassi' && lista.length) {
    const t = totaliAperti(lista);
    html += `<div class="glass griglia" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div><div class="cella-k">Da incassare</div><div class="cella-v" style="color:var(--in)">${esc(euro(t.entrata))}</div></div>
      <div><div class="cella-k">Da pagare</div><div class="cella-v" style="color:var(--out)">${esc(euro(t.uscita))}</div></div></div>`;
  }
  if (contatti.length) {
    html += `<div class="sezione"><h2>Contatti · ${contatti.length}</h2><div class="lista-righe">${contatti.slice(0, 5).map(rigaContatto).join('')}</div></div>`;
  }
  if (lista.length) {
    let g = null;
    html += lista.slice(0, 150).map(a => {
      const pre = a.data !== g ? `<div class="giorno-label">${esc(etichettaGiorno(a.data))}</div>` : '';
      g = a.data;
      return pre + voceApp(a);
    }).join('');
  }
  if (!html) {
    html = `<div class="glass vuoto"><span class="ico">${icon('search', 26)}</span><div class="card-title">Nessun risultato</div><div class="muted">${q ? 'Prova con un’altra parola.' : 'Non ci sono appuntamenti in questa vista.'}</div></div>`;
  }
  box.innerHTML = html;
}

// ----- Contatti -----
function rigaContatto(c) {
  const n = Object.values(S.appuntamenti).filter(a => a.contattoId === c.id).length;
  return `<div class="riga cliccabile" data-act="apriContatto" data-id="${esc(c.id)}" role="button" tabindex="0">
    <div class="avatar" data-t="${tintaAvatar(c.nome)}" aria-hidden="true">${esc(iniziali(c.nome))}</div>
    <div class="testo">
      <div class="card-title">${esc(c.nome)}</div>
      <div class="card-meta" style="flex-wrap:wrap">${tagTipo(c)}${[c.telefono, c.email].filter(Boolean).map(esc).join(' · ')}</div>
      ${mandantiDi(c).length ? `<div class="card-meta" style="overflow-wrap:anywhere">${esc(mandantiDi(c).join(', '))}</div>` : ''}
    </div>
    ${c.telefono ? rapide(c) : `<span class="muted" style="font-size:12px;flex:none">${n ? plurale(n, 'app.', 'app.') : ''}</span>`}
  </div>`;
}

function renderContatti() {
  if (!$('#main [data-vista="contatti"]')) {
    $('#main').innerHTML = `<div class="view" data-vista="contatti">
      <div class="head">
        <div><div class="card-kicker" id="nContatti"></div><h1>Contatti</h1></div>
        <button class="btn btn-secondary" data-act="nuovoContatto">${icon('plus', 16)} Contatto</button>
      </div>
      <div class="search">${icon('search')}<input id="q" class="input" type="search" placeholder="Nome, telefono, email, azienda" value="${esc(S.q)}" autocomplete="off"></div>
      <div class="filtri-tipo" id="filtriTipo" role="group" aria-label="Tipo di contatto"></div>
      <div id="lista"></div>
    </div>`;
  }
  listaContatti();
}

function listaContatti() {
  const box = $('#lista');
  if (!box) return;
  const tutti = contattiOrdinati();
  $('#nContatti').textContent = plurale(tutti.length, 'contatto', 'contatti');
  const conta = t => tutti.filter(c => tipoDi(c) === t).length;
  $('#filtriTipo').innerHTML = [['', 'Tutti', tutti.length], ...Object.entries(TIPI_CONTATTO).map(([k, [, pl]]) => [k, pl, conta(k)])]
    .map(([k, t, n]) => `<button type="button" data-act="tipoC" data-f="${k}" ${k ? `data-tipo="${k}"` : ''} aria-pressed="${S.tipoC === k}">${t}<small>${n}</small></button>`).join('');
  const q = norm(S.q);
  const lista = tutti.filter(c => (!S.tipoC || tipoDi(c) === S.tipoC) && (!q || norm(`${c.nome || ''} ${c.telefono || ''} ${c.email || ''} ${mandantiDi(c).join(' ')}`).includes(q)));
  if (!lista.length) {
    box.innerHTML = `<div class="glass vuoto"><span class="ico">${icon('users', 26)}</span><div class="card-title">Nessun contatto</div><div class="muted">${q ? 'Nessun contatto corrisponde alla ricerca.' : S.tipoC ? `Nessun contatto di tipo ${TIPI_CONTATTO[S.tipoC][0].toLowerCase()}.` : 'Aggiungi il primo contatto con il pulsante in alto.'}</div></div>`;
    return;
  }
  let lettera = null;
  box.innerHTML = lista.map(c => {
    const l = (c.nome || '?').charAt(0).toUpperCase();
    const pre = !q && l !== lettera ? `<div class="giorno-label">${esc(l)}</div>` : '';
    lettera = l;
    return pre + rigaContatto(c);
  }).join('');
}

document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; listaContatti(); }
  if (e.target.id === 'qCerca') { S.qCerca = e.target.value; risultatiCerca(); }
});

// ===================== RUBRICA DEL TELEFONO E SUGGERIMENTI =====================
// Tre strade, perché nessuna funziona su tutti i telefoni:
// 1) Chrome per Android apre la rubrica di sistema (Contact Picker);
// 2) un file contatto .vcf scelto dal telefono (Android lo prende anche dall'app Contatti, iPhone da File);
// 3) un contatto condiviso dalla rubrica verso l'app (Android, app installata) o copiato e incollato.
const rubricaDisponibile = () => 'contacts' in navigator && 'ContactsManager' in window;

// Decodifica "quoted-printable" (Android esporta così i nomi con lettere accentate).
function decodificaQP(t) {
  const byte = [];
  const s = t.replace(/=\r?\n/g, '');
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '=' && /^[0-9A-F]{2}$/i.test(s.slice(i + 1, i + 3))) { byte.push(parseInt(s.slice(i + 1, i + 3), 16)); i += 2; }
    else byte.push(...new TextEncoder().encode(s[i]));
  }
  try { return new TextDecoder('utf-8').decode(new Uint8Array(byte)); } catch (e) { return s; }
}

// Legge uno o più contatti da un testo vCard; restituisce [{ nome, telefono, email, azienda }].
function leggiVCard(testo) {
  const contatti = [];
  const righe = String(testo || '').replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '')
    .replace(/=\r?\n/g, '=\n').split(/\r?\n/);
  let c = null, fn = '', n = '';
  // Le righe quoted-printable possono continuare con "=" a fine riga: si uniscono.
  for (let i = 0; i < righe.length; i++) {
    let r = righe[i];
    while (/QUOTED-PRINTABLE/i.test(r.split(':')[0]) && r.endsWith('=') && i + 1 < righe.length) r = r.slice(0, -1) + righe[++i];
    const due = r.indexOf(':');
    if (due < 0) continue;
    const testa = r.slice(0, due).toUpperCase(), corpo = r.slice(due + 1);
    const chiave = testa.split(';')[0].replace(/^ITEM\d+\./, '');
    const valore = /QUOTED-PRINTABLE/.test(testa) ? decodificaQP(corpo) : corpo;
    const pulito = v => v.replace(/\\,/g, ',').replace(/\;/g, ';').replace(/\\n/gi, ' ').trim();
    if (chiave === 'BEGIN') { c = { nome: '', telefono: '', email: '', azienda: '', tel: [] }; fn = ''; n = ''; }
    else if (!c) continue;
    else if (chiave === 'END') {
      // Cognome e nome, come nell'app; se manca N si usa il nome completo.
      c.nome = n || fn;
      // Si preferisce il cellulare.
      c.telefono = (c.tel.find(t => t.cell) || c.tel[0] || {}).num || '';
      delete c.tel;
      if (c.nome || c.telefono || c.email) contatti.push(c);
      c = null;
    }
    else if (chiave === 'FN') fn = pulito(valore);
    else if (chiave === 'N') {
      const parti = valore.split(';').map(pulito);
      n = [parti[0], parti[1]].filter(Boolean).join(' ');
    }
    else if (chiave === 'TEL') c.tel.push({ num: pulito(valore).replace(/^tel:/i, ''), cell: /CELL|MOBILE/.test(testa) });
    else if (chiave === 'EMAIL' && !c.email) c.email = pulito(valore);
    else if (chiave === 'ORG' && !c.azienda) c.azienda = pulito(valore.split(';')[0]);
  }
  return contatti;
}

// Contatto da testo libero (es. "Condividi come testo" o copia e incolla): righe con nome, numero, email.
function leggiTestoContatto(testo) {
  const t = String(testo || '');
  if (/BEGIN:VCARD/i.test(t)) return leggiVCard(t)[0] || null;
  // Le rubriche Samsung copiano "[Nome] Mario Rossi", "[Cellulare] 333…": l'etichetta tra parentesi si toglie,
  // ma se è [Nome] quella riga è sicuramente il nome.
  const ETICHETTA = /^\s*[\[(]([^\])]{1,30})[\])]\s*/;
  const grezze = t.split(/\r?\n/).map(r => r.trim()).filter(Boolean);
  const rigaNome = grezze.find(r => /^(nome|name)$/i.test((ETICHETTA.exec(r) || [])[1]?.trim() || ''));
  const righe = grezze.map(r => r.replace(ETICHETTA, '').replace(/^(nome|name|cellulare|telefono|tel|mobile|casa|lavoro|email|e-mail)\s*:\s*/i, '').trim()).filter(Boolean);
  const email = (t.match(/[^\s@<>()]+@[^\s@<>()]+\.[a-z]{2,}/i) || [''])[0];
  const tel = (t.match(/(?:\+|00)?\d[\d\s.\-()/]{5,}\d/) || [''])[0].trim();
  // Prima riga senza numero né email; se non c'è, la prima riga ripulita da numero ed email.
  const nome = (rigaNome && rigaNome.replace(ETICHETTA, '').trim()) || righe.find(r => !r.includes('@') && !/\d{4,}/.test(r.replace(/\D/g, '')) && /[a-zà-ú]/i.test(r)) ||
    (righe[0] || '').replace(email, '').replace(tel, '').replace(/[\s:,;\-–]+$/, '').trim();
  if (!nome && !tel && !email) return null;
  return { nome: nome.replace(/^(nome|name)\s*:\s*/i, '').slice(0, 120), telefono: tel, email, azienda: '' };
}

// Cerca tra i contatti dell'app lo stesso numero o lo stesso nome.
function contattoGiaPresente(k) {

}

      <label class="btn btn-primary" style="cursor:pointer">${icon('book', 18)} Scegli file contatto (.vcf)
        <input type="file" accept=".vcf,.vcard,text/vcard,text/x-vcard,text/directory" hidden data-r="file">
      </label>
      <p class="muted" style="margin:0;font-size:13px">${android
        ? 'Si apre la scelta file: tocca il menu ☰ e scegli <b>Contatti</b>, poi il contatto. Oppure dalla Rubrica: apri il contatto › <b>Condividi</b> › <b>Appuntamenti</b>.'
        : 'iPhone: in Contatti apri il contatto › <b>Condividi contatto</b> › <b>Salva su File</b>. Poi qui tocca il pulsante sopra e scegli il file.'}</p>

        <textarea class="input" data-r="testo" rows="3" placeholder="Nome, numero, email"></textarea></label>
      <div class="actions">
        <button type="button" class="btn btn-secondary" data-act="chiudi">Annulla</button>
        <button type="button" class="btn btn-primary" data-r="usa">Usa testo</button>
      </div>
    </div>`, m => {
    const fatto = k => { closeModal(); usa(k); };
    m.querySelector('[data-r="picker"]')?.addEventListener('click', async () => {
      const k = await apriPicker();
      if (k) fatto(k); else toast(diagPicker || 'Nessun contatto ricevuto: prova con il file .vcf');
    });
    m.querySelector('[data-r="file"]').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      const lista = leggiVCard(await file.text());
      if (!lista.length) { toast('Nel file non trovo nessun contatto valido'); return; }
      if (lista.length > 1) toast('Nel file ci sono ' + lista.length + ' contatti: uso il primo');
      fatto(lista[0]);
    });
    m.querySelector('[data-r="usa"]').addEventListener('click', () => {
      const k = leggiTestoContatto(m.querySelector('[data-r="testo"]').value);
      if (k) fatto(k); else toast('Nel testo non trovo nome, numero o email');
    });
  });
}

// Contact Picker di Chrome per Android; restituisce il contatto o null.
// diagPicker descrive cosa è tornato davvero, per capire i telefoni dove non funziona.
let diagPicker = '';
async function apriPicker() {
  diagPicker = '';
  try {
    // Si chiedono solo i campi che questo telefono supporta, altrimenti Chrome rifiuta la richiesta.
    let campi = ['name', 'tel', 'email'];
    try {
      const supportati = await navigator.contacts.getProperties();
      if (Array.isArray(supportati) && supportati.length) campi = campi.filter(c => supportati.includes(c));
    } catch (e) { /* si usano i campi predefiniti */ }
    const risultato = await navigator.contacts.select(campi, { multiple: false });
    const scelto = Array.isArray(risultato) ? risultato[0] : null;
    if (!scelto) {
      diagPicker = `Dettaglio: la rubrica ha restituito un elenco vuoto (campi richiesti: ${campi.join(', ')}). Riprova senza usare la ricerca: scorri fino al contatto, toccalo e premi Fine.`;
      return null;
    }
    const k = {
      nome: (scelto.name || []).find(Boolean) || '',
      telefono: (scelto.tel || []).find(Boolean) || '',
      email: (scelto.email || []).find(Boolean) || ''
    };
    if (!(k.nome || k.telefono || k.email)) {
      diagPicker = `Dettaglio: contatto ricevuto ma senza dati (${Object.keys(scelto).join(', ') || 'nessun campo'}).`;
      return null;
    }
    return k;
  } catch (err) {
    diagPicker = `Dettaglio: errore della rubrica (${err?.name || ''} ${err?.message || ''}).`;
    return null;
  }
}

// Legge dagli appunti un contatto copiato dalla rubrica (es. "[Nome] … [Cellulare] …").
// Lo stesso testo non viene riusato due volte, così un vecchio contatto copiato non si ripresenta.
async function contattoDagliAppunti() {
  try {
    if (!navigator.clipboard?.readText) return null;
    const testo = (await navigator.clipboard.readText()).trim();
    if (!testo || testo.length > 600 || testo === lsGet('ultimo_incolla')) return null;
    const k = leggiTestoContatto(testo);
    // Serve almeno un numero o un'email: un testo qualsiasi negli appunti non è un contatto.
    if (!k || !(normTel(k.telefono) || isEmail(k.email))) return null;
    lsSet('ultimo_incolla', testo);
    return k;
  } catch (e) {
    return null; // permesso negato o appunti non leggibili: si passa alla rubrica
  }
}

// Collega al modulo: suggerimenti dai contatti salvati e pulsante Rubrica.
// suContatto(id) viene chiamato quando il nome corrisponde a un contatto già nell'app.
function collegaNome(f, suContatto) {
  // 'change' scatta quando si sceglie un suggerimento o si esce dal campo, non a ogni lettera.
  f.nome.addEventListener('change', () => {
    const q = norm(f.nome.value);
    const k = contattiOrdinati().find(c => norm(c.nome) === q);
    if (!k) return;
    if (suContatto) suContatto(k.id);
    if (k.telefono && !f.telefono.value) f.telefono.value = k.telefono;
    if (k.email && !f.email.value) f.email.value = k.email;
  });
  const riempi = k => {
    const giaPresente = contattoGiaPresente(k);
    if (giaPresente && suContatto) suContatto(giaPresente.id);
    if (k.nome) f.nome.value = k.nome;
    if (k.telefono) f.telefono.value = normTel(k.telefono) || k.telefono;
    if (k.email) f.email.value = k.email;
    [f.nome, f.telefono, f.email].forEach(el => el.dispatchEvent(new Event('input', { bubbles: true })));
    toast(giaPresente ? 'Contatto già presente: dati collegati' : 'Dati presi dalla rubrica');
  };
  const btn = f.querySelector('[data-rubrica]');
  if (btn) btn.addEventListener('click', async () => {
    // Scorciatoia: se hai appena copiato un contatto dalla rubrica, si usa subito quello.
    const copiato = await contattoDagliAppunti();
    if (copiato) { riempi(copiato); return; }
    // Il selettore di Chrome su alcuni telefoni non restituisce nulla: si guida a copiare il contatto.
    toast('Copia il contatto dalla rubrica del telefono, poi tocca di nuovo Rubrica');
  });
}

// Contatto condiviso verso l'app dalla rubrica (Android): il service worker lo conserva e apre ./?condiviso=1.
async function contattoCondiviso() {
  if (!new URLSearchParams(location.search).has('condiviso')) return;
  history.replaceState(null, '', location.pathname);
  let k = null;
  try {
    const cache = await caches.open('condivisi');
    const r = await cache.match('ultimo');
    if (r) { k = leggiTestoContatto(await r.text()); await cache.delete('ultimo'); }
  } catch (e) { /* niente da leggere */ }
  if (!k) { toast('Non ho ricevuto nessun contatto dalla condivisione'); return; }
  armaIndietro();
  const giaPresente = contattoGiaPresente(k);
  if (giaPresente) { toast('Contatto già presente: apro la sua scheda'); openContatto(giaPresente.id); return; }
  openContattoForm({ nome: k.nome, telefono: normTel(k.telefono) || k.telefono, email: k.email });
  toast('Dati presi dalla rubrica');
}

// ===================== SCHERMATE: APPUNTAMENTO =====================
function openAppForm(opt = {}) {
  const aid = opt.id || null;
  const a = aid ? S.appuntamenti[aid] : null;
  const cid = a ? a.contattoId : (opt.contattoId || '');
  const c = S.contatti[cid] || {};
  const v = {
    nome: opt.nome ?? c.nome ?? '',
    telefono: opt.telefono ?? c.telefono ?? '',
    email: c.email ?? opt.email ?? '',
    tipo: cid ? tipoDi(c) : tipoDi({ tipo: opt.tipo }),
    azienda: a?.azienda ?? opt.azienda ?? '',
    data: a?.data ?? opt.data ?? (S.vista === 'calendario' ? S.calSel : S.giorno) ?? todayISO(),
    ora: a?.ora ?? opt.ora ?? '09:00',
    durata: a?.durata ?? opt.durata ?? 30,
    luogo: a?.luogo ?? opt.luogo ?? '',
    motivo: a?.motivo ?? opt.motivo ?? '',
    note: a?.note ?? opt.note ?? '',
    importo: a?.importo ?? opt.importo ?? '',
    acconto: a?.acconto ?? opt.acconto ?? '',
    pagamento: PAGAMENTI[a?.pagamento ?? opt.pagamento] ? (a?.pagamento ?? opt.pagamento) : 'da-saldare',
    movimento: (a?.movimento ?? opt.movimento) === 'uscita' ? 'uscita' : 'entrata',
    stato: a?.stato ?? 'programmato',
    promemoria: a ? promemoriaDi(a) : promemoriaPredefinito()
  };
  if (!aid && v.data < todayISO()) v.data = todayISO();
  const opzioni = contattiOrdinati().map(k =>
    `<option value="${esc(k.id)}" ${k.id === cid ? 'selected' : ''}>${esc(k.nome)}${tipoDi(k) !== 'cliente' ? ' · ' + TIPI_CONTATTO[tipoDi(k)][0] : ''}</option>`).join('');
  const statoOpts = Object.entries(ETICHETTE_STATO).map(([k, t]) =>
    `<option value="${k}" ${k === v.stato ? 'selected' : ''}>${t}</option>`).join('');
  const virgola = n => (Number(n) > 0 ? String(n).replace('.', ',') : '');
  const conRate = rateDi(a).length > 0;
  const conIA = !!lsGet('gemini_key');
  const promOpts = SCELTE_PROMEMORIA.some(([m]) => m === v.promemoria) ? SCELTE_PROMEMORIA : [...SCELTE_PROMEMORIA, [v.promemoria, etichettaPromemoria(v.promemoria)]];

  openPage(`
    <div class="page-bar">
      <button class="btn btn-ghost btn-icon" data-act="chiudi" aria-label="Chiudi">${icon('close', 20)}</button>
      <div class="card-kicker" style="flex:1;text-align:center">${aid ? 'Modifica appuntamento' : 'Nuovo appuntamento'}</div>
      <button class="btn btn-ghost btn-icon" type="button" id="micForm" aria-label="Detta l’appuntamento">${icon('mic', 20)}</button>
    </div>
    <form id="fa" novalidate>
      <div class="page-body">
        ${aid ? '' : `<div class="glass smart">
          <div style="display:flex;align-items:center;gap:8px;color:var(--accent-text);font-weight:700">${icon('spark', 18)} Scrivi o detta, compilo io</div>
          <div class="smart-riga">
            <textarea id="smartTxt" class="input" rows="3" maxlength="1500" placeholder="Es. «Promemoria lunedì prossimo alle 11:30 saldo fattura 250 € per Marco Rossi a Rutigliano»">${esc(opt.testoSmart || '')}</textarea>
            <button type="button" class="btn btn-secondary btn-icon" id="micSmart" aria-label="Detta il messaggio">${icon('mic', 20)}</button>
            <button type="button" class="btn btn-primary btn-icon" id="btnSmart" aria-label="Compila il modulo">${icon('send', 19)}</button>
          </div>
          <p class="muted" style="margin:0;font-size:12px">${conIA ? 'Con Gemini: capisce titolo, data, ora, cliente, luogo e importo.' : 'Senza chiave Gemini capisco solo data, ora e nome. Aggiungi la chiave in Altro › Assistente IA.'}</p>
        </div>`}

        <label class="field"><span>Motivo</span><input class="input" name="motivo" maxlength="200" value="${esc(v.motivo)}" placeholder="Es. sopralluogo, scelta sanitari" style="font-weight:700;font-size:19px"></label>

        <label class="field"><span>Data</span><input class="input" name="data" type="date" required value="${esc(v.data)}"></label>
        <div class="row2">
          <label class="field"><span>Ora</span><input class="input" name="ora" type="time" required value="${esc(v.ora)}"></label>
          <label class="field"><span>Durata (min)</span><input class="input" name="durata" type="number" inputmode="numeric" min="5" max="480" step="5" required value="${esc(v.durata)}"></label>
        </div>
        <div id="conflitto"></div>

        <div class="sezione">
          <h2>Contatto</h2>
          <label class="field"><span>Rubrica</span>
            <select class="input" name="contattoId"><option value="">＋ Nuovo contatto</option>${opzioni}</select></label>
          ${campoNome(v.nome)}
          <div class="field"><span>Tipo</span>${sceltaTipo(v.tipo)}</div>
          <div class="row2">
            <label class="field"><span>Telefono</span><input class="input" name="telefono" type="tel" value="${esc(v.telefono)}"></label>
            <label class="field"><span>Email</span><input class="input" name="email" type="email" value="${esc(v.email)}"></label>
          </div>
          <p class="muted" style="margin:0">Modificare nome, telefono o email aggiorna anche la scheda del contatto.</p>
        </div>

        <div class="sezione">
          <h2>Dettagli</h2>
          <label class="field"><span>Azienda di riferimento</span><input class="input" name="azienda" maxlength="120" value="${esc(v.azienda)}"></label>
          <label class="field"><span>Luogo</span><input class="input" name="luogo" maxlength="200" value="${esc(v.luogo)}" placeholder="Indirizzo: si apre in Maps"></label>
          <div class="row2">
            <label class="field"><span>Promemoria</span><select class="input" name="promemoria">${promOpts.map(([m, t]) => `<option value="${m}" ${m === v.promemoria ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
            <label class="field"><span>Stato</span><select class="input" name="stato">${statoOpts}</select></label>
          </div>
          <label class="field"><span>Note</span><textarea class="input" name="note" maxlength="1000">${esc(v.note)}</textarea></label>
        </div>

        <div class="sezione">
          <h2>Pagamento</h2>
          <input type="hidden" name="movimento" value="${esc(v.movimento)}">
          <div class="seg seg-mov" id="segMov" role="group" aria-label="Tipo di movimento">
            <button type="button" data-m="entrata" aria-pressed="${v.movimento === 'entrata'}"><span>${icon('down', 15)} Entrata</span><small>da incassare</small></button>
            <button type="button" data-m="uscita" aria-pressed="${v.movimento === 'uscita'}"><span>${icon('up', 15)} Uscita</span><small>da pagare</small></button>
          </div>
          <div class="row2">
            <label class="field"><span>Importo (€)</span><input class="input" name="importo" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(virgola(v.importo))}" ${conRate ? 'readonly' : ''}></label>
            <label class="field" id="campoAcconto" ${conRate ? 'hidden' : ''}><span>Acconto versato (€)</span><input class="input" name="acconto" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(virgola(v.acconto))}"></label>
          </div>
          <input type="hidden" name="pagamento" value="${esc(v.pagamento)}">
          ${conRate ? `<p class="muted" style="margin:0">Pagamento in ${rateDi(a).length} rate: importo e rate si cambiano da "Modifica pagamento" nel dettaglio.</p>` : ''}
          <div class="seg seg-pay" id="segPag" data-mov="${esc(v.movimento)}" ${conRate ? 'hidden' : ''}>${Object.keys(PAGAMENTI).map(k => `<button type="button" data-p="${k}" aria-pressed="${v.pagamento === k}">${ETICHETTE_PAGAMENTO[v.movimento][k]}</button>`).join('')}</div>
        </div>
      </div>
      <div class="page-foot">
        <button type="button" class="btn btn-secondary" data-act="chiudi">Annulla</button>
        <button class="btn btn-primary" id="btnSalva">Salva</button>
      </div>
    </form>`, m => {
    const f = m.querySelector('#fa');
    // Avviso conflitti: si aggiorna a ogni modifica di data, ora e durata.
    const controlla = () => {
      const lista = sovrapposti(f.data.value, f.ora.value, f.durata.value, aid);
      f.dataset.forza = '';
      $('#btnSalva', m).textContent = 'Salva';
      $('#conflitto', m).innerHTML = lista.length ? `<div class="avviso">${icon('warn', 18)}<div><strong>Si sovrappone a ${plurale(lista.length, 'appuntamento', 'appuntamenti')}</strong><br>${lista.map(x => `${esc(x.ora)}–${esc(fineApp(x))} · ${esc(x.motivo || x.contatto.nome || '')}`).join('<br>')}</div></div>` : '';
      return lista;
    };
    ['data', 'ora', 'durata'].forEach(n => f[n].addEventListener('input', controlla));
    controlla();
    const segnaTipo = attivaTipo(f);
    collegaNome(f, id => { f.contattoId.value = id; f.contattoId.dispatchEvent(new Event('change')); });
    f.contattoId.addEventListener('change', () => {
      const k = S.contatti[f.contattoId.value];
      if (!k) return;
      f.nome.value = k.nome || '';
      f.telefono.value = k.telefono || '';
      f.email.value = k.email || '';
      segnaTipo(tipoDi(k));
    });
    // Stato del pagamento: il campo acconto compare solo con "Acconto".
    const segnaPagamento = p => {
      f.pagamento.value = p;
      m.querySelectorAll('#segPag>button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
      $('#campoAcconto', m).style.visibility = p === 'acconto' ? 'visible' : 'hidden';
    };
    m.querySelector('#segPag').addEventListener('click', e => { const b = e.target.closest('button'); if (b) segnaPagamento(b.dataset.p); });
    segnaPagamento(f.pagamento.value);
    // Entrata o uscita: cambia colori ed etichette dello stato del pagamento.
    const segnaMovimento = mv => {
      f.movimento.value = mv;
      m.querySelectorAll('#segMov>button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === mv)));
      $('#segPag', m).dataset.mov = mv;
      m.querySelectorAll('#segPag>button').forEach(b => { b.textContent = ETICHETTE_PAGAMENTO[mv][b.dataset.p]; });
    };
    m.querySelector('#segMov').addEventListener('click', e => { const b = e.target.closest('button'); if (b) segnaMovimento(b.dataset.m); });
    const riempi = d => {
      ['nome', 'telefono', 'email', 'azienda', 'data', 'ora', 'durata', 'luogo', 'motivo', 'note'].forEach(k => {
        if (d[k] !== undefined && d[k] !== '' && d[k] !== null) {
          f[k].value = d[k];
          f[k].classList.remove('compilato'); void f[k].offsetWidth; f[k].classList.add('compilato');
        }
      });
      if (d.importo) f.importo.value = virgola(d.importo);
      if (d.acconto) f.acconto.value = virgola(d.acconto);
      if (d.pagamento) segnaPagamento(d.pagamento);
      if (d.movimento) segnaMovimento(d.movimento);
      if (d.contattoId) f.contattoId.value = d.contattoId;
      if (d.contattoId) segnaTipo(tipoDi(S.contatti[d.contattoId]));
      else if (d.tipo) segnaTipo(d.tipo);
      controlla();
    };
    // Senza chiave Gemini: riconoscimento semplice di data, ora, nome e motivo.
    const compilaLocale = testo => {
      const c = classificaComando(/^(nuovo|fissa|crea|prendi|promemoria)\b/i.test(testo) ? testo : 'nuovo appuntamento con ' + testo);
      const contatto = c.nome ? trovaContatto(S.contatti, c.nome) : null;
      riempi({ data: c.data, ora: c.ora, motivo: c.motivo, nome: contatto ? contatto.nome : capitalizza(c.nome), contattoId: contatto?.id, telefono: contatto?.telefono, email: contatto?.email });
    };
    const btnSmart = m.querySelector('#btnSmart');
    const compila = async testo => {
      testo = String(testo || '').trim();
      if (!testo) { toast('Scrivi o detta un messaggio'); return; }
      if (!lsGet('gemini_key')) { compilaLocale(testo); toast('Modulo compilato: controlla i dati prima di salvare'); return; }
      const bottoni = [btnSmart, m.querySelector('#micForm')].filter(Boolean);
      bottoni.forEach(b => { b.disabled = true; b.classList.add('analisi'); });
      try {
        const d = pulisciDatiIA(await chiediGemini(promptSmart(testo)));
        const contatto = d.nome ? trovaContatto(S.contatti, d.nome) : null;
        riempi({ ...d, nome: contatto?.nome || d.nome, contattoId: contatto?.id, telefono: d.telefono || contatto?.telefono || '', email: d.email || contatto?.email || '' });
        vibra('ok');
        toast(contatto || !d.nome || d.telefono || d.email ? 'Modulo compilato: controlla i dati prima di salvare' : 'Compilato. Manca il telefono del nuovo cliente');
      } catch (err) {
        vibra('err');
        toast(messaggioIA(err));
      } finally {
        bottoni.forEach(b => { b.disabled = false; b.classList.remove('analisi'); });
      }
    };
    const smartTxt = m.querySelector('#smartTxt');
    if (btnSmart) btnSmart.addEventListener('click', () => compila(smartTxt.value));
    const detta = btn => voiceStart(btn, testo => {
      if (smartTxt) smartTxt.value = testo;
      compila(testo);
    });
    m.querySelector('#micSmart')?.addEventListener('click', e => detta(e.currentTarget));
    m.querySelector('#micForm').addEventListener('click', e => detta(e.currentTarget));
    if (opt.testoSmart) compila(opt.testoSmart);
    f.addEventListener('submit', async e => {
      e.preventDefault();
      // Con sovrapposizioni il primo tocco chiede conferma sul pulsante stesso.
      if (!f.dataset.forza && sovrapposti(f.data.value, f.ora.value, f.durata.value, aid).length) {
        f.dataset.forza = '1';
        $('#btnSalva', m).textContent = 'Salva comunque';
        $('#conflitto', m).scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      const esito = await salvaAppuntamento(Object.fromEntries(new FormData(f)), aid);
      if (esito === 'ok') { closeModal(); aggiornaLivello(); }
    });
  }, { anim: 'up' });
}

function openContattoForm(opt = {}) {
  const id = opt.id || null;
  const c = id ? (S.contatti[id] || {}) : { nome: opt.nome, telefono: opt.telefono, email: opt.email };
  openModal(`
    <h2>${id ? 'Modifica contatto' : 'Nuovo contatto'}</h2>
    <form id="fc" style="display:flex;flex-direction:column;gap:12px">
      ${campoNome(c.nome)}
      <div class="field"><span>Tipo</span>${sceltaTipo(id ? tipoDi(c) : (opt.tipo || 'cliente'))}</div>
      <div class="field" id="campoMandanti"><span>Aziende rappresentate</span>
        <div class="mandanti" id="listaMandanti">${(c.mandanti?.length ? c.mandanti : ['']).map(rigaMandante).join('')}</div>
        <button type="button" class="btn btn-ghost" id="addMandante" style="align-self:flex-start">${icon('plus', 16)} Aggiungi azienda</button>
      </div>
      <div class="row2">
        <label class="field"><span>Telefono</span><input class="input" name="telefono" type="tel" value="${esc(c.telefono)}"></label>
        <label class="field"><span>Email</span><input class="input" name="email" type="email" value="${esc(c.email)}"></label>
      </div>
      <label class="field"><span>Note</span><textarea class="input" name="note" maxlength="1000">${esc(c.note)}</textarea></label>
      <div class="actions">
        <button type="button" class="btn btn-secondary" data-act="chiudi">Annulla</button>
        <button class="btn btn-primary">Salva</button>
      </div>
    </form>`, m => {
    if (!id) collegaNome(m.querySelector('#fc'), cidEsistente => {
      toast('Questo contatto esiste già: apro la sua scheda');
      closeModal();
      openContatto(cidEsistente);
    });
    const fc = m.querySelector('#fc');
    const lista = m.querySelector('#listaMandanti');
    attivaTipo(fc, t => { m.querySelector('#campoMandanti').hidden = t !== 'rappresentante'; })(fc.tipo.value);
    m.querySelector('#addMandante').addEventListener('click', () => {
      lista.insertAdjacentHTML('beforeend', rigaMandante());
      lista.lastElementChild.querySelector('input').focus();
    });
    lista.addEventListener('click', e => {
      if (!e.target.closest('[data-rimuovi]')) return;
      const riga = e.target.closest('.mandante');
      if (lista.children.length > 1) riga.remove(); else riga.querySelector('input').value = '';
    });
    fc.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const esito = await salvaContatto({ ...Object.fromEntries(fd), mandanti: fd.getAll('mandante') }, id);
      if (esito !== 'errore') { closeModal(); aggiornaLivello(); }
    });
  });
}

function openPagamento(aid) {
  const a = S.appuntamenti[aid];
  if (!a) { toast('Appuntamento non trovato'); return; }
  const virgola = n => (Number(n) > 0 ? String(n).replace('.', ',') : '');
  const mov = movimentoDi(a), pag = statoPag(a);
  let rate = rateDi(a);
  const conRate = rate.length > 0;
  const opzModalita = sel => `<option value="">—</option>${Object.entries(MODALITA).map(([k, t]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${t}</option>`).join('')}`;
  openModal(`
    <div><div class="card-kicker">${esc(a.motivo || S.contatti[a.contattoId]?.nome || '')}</div><h2>${haImporto(a) ? 'Modifica pagamento' : 'Aggiungi importo'}</h2></div>
    <form id="fp" style="display:flex;flex-direction:column;gap:12px">
      <input type="hidden" name="movimento" value="${mov}">
      <div class="seg seg-mov" id="segMovP" role="group" aria-label="Tipo di movimento">
        <button type="button" data-m="entrata" aria-pressed="${mov === 'entrata'}"><span>${icon('down', 15)} Entrata</span><small>da incassare</small></button>
        <button type="button" data-m="uscita" aria-pressed="${mov === 'uscita'}"><span>${icon('up', 15)} Uscita</span><small>da pagare</small></button>
      </div>
      <div class="row2">
        <label class="field"><span>Importo (€)</span><input class="input" name="importo" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(virgola(a.importo))}"></label>
        <label class="field"><span>Modalità</span><select class="input" name="modalita">${opzModalita(a.modalita)}</select></label>
      </div>
      <div class="row2">
        <label class="field"><span>N. fattura</span><input class="input" name="fattura" maxlength="30" autocomplete="off" value="${esc(a.fattura)}"></label>
        <label class="field"><span>Data fattura</span><input class="input" name="dataFattura" type="date" value="${esc(a.dataFattura)}"></label>
      </div>
      <div class="scan-assegni glass">
        <div class="card-title" style="font-size:14px">Assegni consegnati</div>
        <div class="muted" style="font-size:12.5px">Fotografa o carica la foto o il PDF: l'IA legge importo, data, banca e numero. Più assegni diventano rate.</div>
        <div class="row2">
          <button type="button" class="btn btn-secondary" id="btnScanFoto">${icon('camera', 16)} Fotografa</button>
          <button type="button" class="btn btn-secondary" id="btnScanFile">${icon('file', 16)} Foto o PDF</button>
        </div>
        <input type="file" id="scanFoto" accept="image/*" capture="environment" hidden>
        <input type="file" id="scanFile" accept="image/*,application/pdf" hidden>
        <div id="esitoScan" class="card-meta"></div>
      </div>
      <div class="seg" id="segRate" role="group" aria-label="Rate">
        <button type="button" data-r="no" aria-pressed="${!conRate}">Unica soluzione</button>
        <button type="button" data-r="si" aria-pressed="${conRate}">A rate</button>
      </div>
      <div id="bloccoUnica" style="display:flex;flex-direction:column;gap:12px">
        <input type="hidden" name="pagamento" value="${pag}">
        <div class="seg seg-pay" id="segPagP" data-mov="${mov}"></div>
        <label class="field" id="campoAccontoP"><span>Acconto versato (€)</span><input class="input" name="acconto" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(virgola(a.acconto))}"></label>
      </div>
      <div id="bloccoRate" style="display:flex;flex-direction:column;gap:12px">
        <div class="row2">
          <label class="field"><span>Numero di rate</span><input class="input" name="nRate" type="number" inputmode="numeric" min="2" max="36" value="${conRate ? rate.length : 3}"></label>
          <label class="field"><span>Ogni</span><select class="input" name="ogni">${[[1, '1 mese'], [2, '2 mesi'], [3, '3 mesi'], [6, '6 mesi']].map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>
        </div>
        <label class="field"><span>Prima scadenza</span><input class="input" name="prima" type="date" value="${esc(conRate ? rate[0].data : a.data)}"></label>
        <div id="listaRate" class="lista-rate"></div>
        <div id="sommaRate" class="muted" style="font-size:13px"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-secondary" data-act="chiudi">Annulla</button>
        <button class="btn btn-primary">Salva</button>
      </div>
    </form>`, m => {
    const f = m.querySelector('#fp');
    const lista = m.querySelector('#listaRate');
    let aRate = conRate;
    const disegnaStati = () => {
      const box = m.querySelector('#segPagP');
      box.dataset.mov = f.movimento.value;
      box.innerHTML = Object.keys(PAGAMENTI).map(k => `<button type="button" data-p="${k}" aria-pressed="${f.pagamento.value === k}">${ETICHETTE_PAGAMENTO[f.movimento.value][k]}</button>`).join('');
      m.querySelector('#campoAccontoP').hidden = f.pagamento.value !== 'acconto';
    };
    // Legge le rate dai campi, così le modifiche a mano restano.
    const leggiRate = () => [...lista.querySelectorAll('.rata')].map(el => ({
      data: el.querySelector('[data-k="data"]').value,
      importo: parseImporto(el.querySelector('[data-k="importo"]').value) || 0,
      modalita: el.querySelector('[data-k="modalita"]').value,
      pagata: el.querySelector('[data-k="pagata"]').getAttribute('aria-pressed') === 'true',
      assegno: JSON.parse(el.dataset.assegno || 'null')
    }));
    const disegnaRate = () => {
      lista.innerHTML = rate.map((x, i) => `<div class="rata glass" data-assegno="${esc(JSON.stringify(x.assegno || null))}">
        <div class="rata-testa"><strong>Rata ${i + 1}</strong>
          <button type="button" class="btn btn-secondary rata-pagata" data-k="pagata" aria-pressed="${!!x.pagata}">${icon('check', 15)} ${x.pagata ? (f.movimento.value === 'uscita' ? 'Pagata' : 'Incassata') : 'Da saldare'}</button></div>
        <div class="row2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px">
          <input class="input" data-k="data" type="date" aria-label="Scadenza rata ${i + 1}" value="${esc(x.data)}">
          <input class="input" data-k="importo" inputmode="decimal" aria-label="Importo rata ${i + 1}" placeholder="0,00" value="${esc(virgola(x.importo))}">
        </div>
        <select class="input" data-k="modalita" aria-label="Modalità rata ${i + 1}">${opzModalita(x.modalita ?? f.modalita.value)}</select>
        ${testoAssegno(x.assegno) ? `<div class="card-meta">${esc(testoAssegno(x.assegno))}</div>` : ''}
      </div>`).join('');
      somma();
    };
    const somma = () => {
      const tot = parseImporto(f.importo.value) || 0;
      const s2 = Math.round(leggiRate().reduce((t, x) => t + x.importo, 0) * 100) / 100;
      const ok = Math.abs(s2 - tot) < 0.01;
      m.querySelector('#sommaRate').innerHTML = `Totale rate ${esc(euro(s2))} su ${esc(euro(tot))}${ok ? '' : ` · <span style="color:var(--pay-due)">la differenza è ${esc(euro(tot - s2))}</span>`}`;
    };
    // Ricalcola rate uguali; le rate già segnate pagate e la modalità restano al loro posto.
    const ricalcola = () => {
      const prec = aRate && lista.children.length ? leggiRate() : rate;
      const n = Math.min(36, Math.max(2, Math.trunc(Number(f.nRate.value)) || 2));
      rate = dividiRate(parseImporto(f.importo.value) || 0, n, validDate(f.prima.value) ? f.prima.value : a.data, Number(f.ogni.value) || 1)
        .map((x, i) => ({ ...x, modalita: prec[i]?.modalita ?? f.modalita.value, pagata: !!prec[i]?.pagata, assegno: prec[i]?.assegno || null }));
      disegnaRate();
    };
    const mostra = () => {
      m.querySelectorAll('#segRate>button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.r === 'si') === aRate)));
      m.querySelector('#bloccoUnica').hidden = aRate;
      m.querySelector('#bloccoRate').hidden = !aRate;
      if (aRate && !lista.children.length) { if (rate.length) disegnaRate(); else ricalcola(); }
    };
    m.querySelector('#segMovP').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      f.movimento.value = b.dataset.m;
      m.querySelectorAll('#segMovP>button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      disegnaStati();
      if (aRate) { rate = leggiRate(); disegnaRate(); }
    });
    m.querySelector('#segPagP').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) { f.pagamento.value = b.dataset.p; disegnaStati(); }
    });
    m.querySelector('#segRate').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) { aRate = b.dataset.r === 'si'; mostra(); }
    });
    ['nRate', 'ogni', 'prima'].forEach(k => f[k].addEventListener('change', ricalcola));
    f.importo.addEventListener('change', () => { if (aRate) ricalcola(); });
    // La modalità generale riempie le rate che non ne hanno una.
    f.modalita.addEventListener('change', () => lista.querySelectorAll('[data-k="modalita"]').forEach(x => { if (!x.value) x.value = f.modalita.value; }));
    lista.addEventListener('input', somma);
    lista.addEventListener('click', e => {
      const b = e.target.closest('[data-k="pagata"]');
      if (!b) return;
      rate = leggiRate();
      const i = [...lista.children].indexOf(b.closest('.rata'));
      rate[i].pagata = !rate[i].pagata;
      disegnaRate();
    });
    // Assegni letti con l'IA: uno solo resta sul pagamento unico, più assegni diventano le rate.
    let assegnoUnico = pulisciAssegno(a.assegno);
    const esito = m.querySelector('#esitoScan');
    const mostraUnico = () => { if (!aRate && assegnoUnico) esito.textContent = testoAssegno(assegnoUnico); };
    const scansiona = async file => {
      if (!file) return;
      if (!lsGet('gemini_key')) { toast('Inserisci la chiave Gemini nelle Impostazioni'); return; }
      const bottoni = [m.querySelector('#btnScanFoto'), m.querySelector('#btnScanFile')];
      bottoni.forEach(b => { b.disabled = true; b.classList.add('analisi'); });
      esito.textContent = 'Leggo l’assegno…';
      try {
        const letti = await scansionaAssegni(file);
        if (!letti.length) { esito.textContent = 'Nessun assegno riconosciuto: riprova con una foto più nitida.'; vibra('err'); return; }
        f.modalita.value = 'assegno';
        const totale = Math.round(letti.reduce((t, x) => t + x.importo, 0) * 100) / 100;
        if (!parseImporto(f.importo.value)) f.importo.value = String(totale).replace('.', ',');
        if (letti.length === 1 && !aRate) {
          assegnoUnico = pulisciAssegno({ ...letti[0].assegno, data: letti[0].data });
          esito.textContent = [testoAssegno(assegnoUnico), letti[0].data ? fmtCorta(letti[0].data) : '', euro(letti[0].importo)].filter(Boolean).join(' · ');
        } else {
          const prima = aRate && lista.children.length ? leggiRate() : [];
          rate = letti.map((x, i) => ({ data: x.data || a.data, importo: x.importo, modalita: 'assegno', pagata: !!prima[i]?.pagata, assegno: x.assegno }));
          aRate = true;
          lista.innerHTML = '';
          mostra();
          disegnaRate();
          f.nRate.value = rate.length;
          esito.textContent = `${plurale(letti.length, 'assegno letto', 'assegni letti')}: controlla date e importi delle rate.`;
        }
        vibra('ok');
      } catch (err) {
        vibra('err');
        esito.textContent = /PDF|leggibile/.test(err.message) ? err.message : messaggioIA(err);
      } finally {
        bottoni.forEach(b => { b.disabled = false; b.classList.remove('analisi'); });
      }
    };
    m.querySelector('#btnScanFoto').addEventListener('click', () => m.querySelector('#scanFoto').click());
    m.querySelector('#btnScanFile').addEventListener('click', () => m.querySelector('#scanFile').click());
    ['#scanFoto', '#scanFile'].forEach(id => m.querySelector(id).addEventListener('change', e => { scansiona(e.target.files[0]); e.target.value = ''; }));
    disegnaStati();
    mostra();
    mostraUnico();
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const esito = await salvaPagamento(aid, { ...Object.fromEntries(new FormData(f)), assegno: assegnoUnico }, aRate ? leggiRate() : null);
      if (esito !== 'errore') { closeModal(); aggiornaLivello(); }
    });
  });
}

      </div>

function etichettaVoce(v) {
  const quando = v.quando ? new Date(v.quando).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : '';
  let t;
  switch (v.tipo) {
    case 'creato': t = 'Creato'; break;
    case 'spostato': t = `Spostato da ${fmtCorta(v.da.data)} ${v.da.ora} a ${fmtCorta(v.a.data)} ${v.a.ora}`; break;
    case 'rimandato': t = `Rimandato da ${fmtCorta(v.da.data)} ${v.da.ora} a ${fmtCorta(v.a.data)} ${v.a.ora}${v.motivo ? ' — ' + v.motivo : ''}`; break;
    case 'stato': t = `Stato: ${ETICHETTE_STATO[v.da] || v.da} → ${ETICHETTE_STATO[v.a] || v.a}`; break;
    case 'email': t = `Email inviata: ${v.oggetto}`; break;
    case 'conferma': t = `Conferma ricevuta da ${v.da}`; break;
    case 'pagamento': t = `Pagamento: ${PAGAMENTI[v.da] || v.da} → ${PAGAMENTI[v.a] || v.a}`; break;
    default: t = v.tipo;
  }
  return quando ? `${quando} — ${t}` : t;
}

// Situazione del cliente o fornitore nel gestionale Atlantis.
// I dati (contatti/<id>/atlantis) li scrive ogni mattina l'aggiornamento automatico: l'app li mostra soltanto.
function sezioneAtlantis(c) {
  const at = c.atlantis;
  if (!at || typeof at !== 'object') return '';
  const quando = at.aggiornato ? new Date(at.aggiornato).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  // Rappresentante: un riepilogo per ogni azienda rappresentata.
  const mandanti = Array.isArray(at.mandanti) ? at.mandanti : [];
  if (mandanti.length) {
    return `<div class="sezione"><h2><span>Situazione Atlantis</span><span style="text-transform:none;letter-spacing:0;font-weight:600">${esc(quando)}</span></h2>
      ${mandanti.map(x => `<div style="display:flex;flex-direction:column;gap:10px">
        <div class="card-kicker" style="font-size:11px">${esc(x.azienda || x.ragione || '')}</div>${soggettoAtlantis(x)}</div>`).join('')}
    </div>`;
  }
  if (!at.codice) {
    return `<div class="sezione"><h2>Situazione Atlantis</h2>
      <p class="muted" style="margin:0">${esc(at.nota || 'Nessun soggetto trovato in Atlantis')}${quando ? ' · controllato il ' + esc(quando) : ''}</p></div>`;
  }
  return `<div class="sezione"><h2><span>Situazione Atlantis</span><span style="text-transform:none;letter-spacing:0;font-weight:600">${esc(quando)}</span></h2>
    ${soggettoAtlantis(at)}
  </div>`;
}

// Riquadro di un soggetto Atlantis: ragione sociale, totali e prossime scadenze.
function soggettoAtlantis(at) {
  if (!at.codice) return `<p class="muted" style="margin:0">${esc(at.nota || 'Non trovato in Atlantis')}</p>`;
  const lato = (k, titolo, colore) => {
    const x = at[k];
    if (!x) return '';
    return `<div><div class="cella-k">${titolo}</div>
      <div class="cella-v" style="color:${x.aperto ? colore : 'var(--color-muted)'}">${esc(euro(x.aperto))}</div>
      ${x.scaduto ? `<div class="tag tag-bad" style="margin-top:6px">scaduto ${esc(euro(x.scaduto))}</div>` : `<div class="muted" style="font-size:12px;margin-top:4px">${x.n ? plurale(x.n, 'scadenza aperta', 'scadenze aperte') : 'nessuna scadenza aperta'}</div>`}
    </div>`;
  };
  const celle = [lato('cliente', 'Ci deve', 'var(--in)'), lato('fornitore', 'Dobbiamo', 'var(--out)')].filter(Boolean);
  const prossime = Array.isArray(at.prossime) ? at.prossime.slice(0, 4) : [];
  return `<div class="glass" style="padding:12px 14px;display:flex;flex-direction:column;gap:2px">
      <div class="card-title" style="overflow-wrap:anywhere">${esc(at.ragione || '')}</div>
      <div class="card-meta">Codice ${esc(at.codice)}${at.nota ? ' · ' + esc(at.nota) : ''}</div>
    </div>
    ${celle.length ? `<div class="griglia" style="grid-template-columns:repeat(${celle.length},minmax(0,1fr))">${celle.join('')}</div>` : ''}
    ${prossime.length ? `<div class="lista-righe">${prossime.map(x => `<div class="riga">
        <div class="testo"><div style="font-weight:600">${esc(validDate(x.data) ? fmtCorta(x.data) : x.data || '')}${x.data && x.data < todayISO() ? ' <span class="tag tag-bad">scaduta</span>' : ''}</div>
          <div class="card-meta">${esc([x.ruolo === 'fornitore' ? 'Da pagare' : 'Da incassare', testoFattura(x.fattura, x.dataFattura) || x.rif, x.tipo].filter(Boolean).join(' · '))}</div></div>
        <span class="importo" style="color:${x.ruolo === 'fornitore' ? 'var(--out)' : 'var(--in)'}">${esc(euro(x.importo))}</span>
      </div>`).join('')}</div>` : ''}`;
}

// ===================== GMAIL =====================
let tokenClient = null;

// Chiamata da onload dello script Google Identity Services.
function initGoogle() {
  if (!GOOGLE_CLIENT_ID || !window.google?.accounts?.oauth2) { S.gmailDisponibile = false; return; }
  S.gmailDisponibile = true;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GMAIL_SCOPES,
    callback: r => {
      if (r.error) { toast('Accesso Gmail non riuscito'); return; }
      S.gmailToken = r.access_token;
      S.gmailExp = Date.now() + (Number(r.expires_in) - 60) * 1000;
      toast('Gmail collegato');
      render();
      aggiornaLivello();
    }
  });
}

function gmailConnect() {
  if (!tokenClient) { toast('Gmail non configurato: manca GOOGLE_CLIENT_ID'); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}

function gmailOk() {
  return !!S.gmailToken && Date.now() < S.gmailExp;
}

async function gmailFetch(path, opts = {}) {
  if (!gmailOk()) throw new Error('ricollega Gmail');
  const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + S.gmailToken, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error('Gmail ' + r.status);
  return r.json();
}

function gmailPulsante() {
  return GOOGLE_CLIENT_ID
    ? '<button class="btn btn-secondary" data-act="gmail" style="align-self:flex-start">Collega Gmail</button>'
    : '<p class="muted" style="margin:0">Gmail non configurato.</p>';
}

function headersDi(m) {
  return Object.fromEntries((m.payload?.headers || []).map(x => [x.name.toLowerCase(), x.value]));
}

function dataEmail(h) {
  const t = Date.parse(h.date || '');
  return new Date(Number.isNaN(t) ? Date.now() : t).toISOString();
}

const DETTAGLI_EMAIL = 'format=metadata&metadataHeaders=Subject&metadataHeaders=Date&metadataHeaders=From';

// Composizione: invio via Gmail se collegato, altrimenti client di posta (mailto:).
function openEmail(appId = null, contattoId = null) {
  const a = appId ? S.appuntamenti[appId] : null;
  const cid = contattoId || a?.contattoId || '';
  const c = S.contatti[cid] || {};
  if (!c.email) { toast('Il contatto non ha un’email'); return; }
  const fmtD = a ? fmtCorta(a.data) : '';
  const oggetto = a ? `Appuntamento del ${fmtD} ore ${a.ora}` : '';
  const corpo = a
    ? `Buongiorno ${c.nome || ''},\n\nconfermo l'appuntamento del ${fmtD} alle ${a.ora}${a.luogo ? ' presso ' + a.luogo : ''}.\n\nCordiali saluti`
    : `Buongiorno ${c.nome || ''},\n\n\nCordiali saluti`;
  const nota = gmailOk()
    ? ''
    : `<p class="muted" style="margin:0">${GOOGLE_CLIENT_ID ? 'Gmail non collegato: si apre il client di posta.' : 'Gmail non configurato: si apre il client di posta.'}</p>`;

  openModal(`
    <div><div class="card-kicker">${esc(c.nome || '')}</div><h2>Nuova email</h2></div>
    ${nota}
    <form id="fe" style="display:flex;flex-direction:column;gap:12px">
      <label class="field"><span>A</span><input class="input" name="to" type="email" required value="${esc(c.email || '')}"></label>
      <div class="row2" style="align-items:end">
        <label class="field"><span>Tipo di messaggio</span><select class="input" name="tipoIA"><option value="conferma">Conferma appuntamento</option><option value="riepilogo">Riepilogo</option><option value="followup">Follow-up</option></select></label>
        <button type="button" class="btn btn-secondary" id="btnIA" style="min-height:42px">${icon('spark', 16)} Genera con IA</button>
      </div>
      <label class="field"><span>Oggetto</span><input class="input" name="oggetto" required maxlength="200" value="${esc(oggetto)}"></label>
      <label class="field"><span>Messaggio</span><textarea class="input" name="corpo" rows="7">${esc(corpo)}</textarea></label>
      <div class="actions">
        <button type="button" class="btn btn-secondary" data-act="chiudi">Annulla</button>
        <button type="button" class="btn btn-secondary" id="btnMailto">Client di posta</button>
        ${gmailOk()
          ? '<button class="btn btn-primary">Invia con Gmail</button>'
          : (GOOGLE_CLIENT_ID ? '<button type="button" class="btn btn-primary" data-act="gmail">Collega Gmail</button>' : '')}
      </div>
    </form>`, m => {
    const f = m.querySelector('#fe');
    m.querySelector('#btnIA').addEventListener('click', async () => {
      const tipo = f.tipoIA.value;
      const dettagli = a
        ? `Appuntamento il ${fmtData(a.data)} alle ${a.ora}${a.luogo ? ' presso ' + a.luogo : ''}${a.motivo ? ' per ' + a.motivo : ''}${a.azienda ? ' (azienda: ' + a.azienda + ')' : ''}.`
        : "Non c'è un appuntamento specifico: scrivi un messaggio di contatto generico.";
      const scopo = { conferma: 'conferma l’appuntamento', riepilogo: 'riepiloga i dettagli dell’appuntamento', followup: 'ringrazia per l’incontro e proponi un eventuale seguito' }[tipo] || 'scrivi un messaggio cortese';
      const prompt = `Scrivi in italiano un'email professionale e cortese per uno showroom di arredo o uno studio professionale. Destinatario: ${c.nome || 'il cliente'}. Obiettivo: ${scopo}. ${dettagli} Tono sobrio e sintetico. Non inventare date, orari o impegni non indicati. Rispondi SOLO con un oggetto JSON con le chiavi "oggetto" (una riga) e "corpo" (testo completo con saluto iniziale e chiusura "Cordiali saluti", senza firma con nome).`;
      const btnIA = m.querySelector('#btnIA');
      const etichetta = btnIA.innerHTML;
      btnIA.disabled = true;
      btnIA.textContent = 'Generazione…';
      try {
        const d = await chiediGemini(prompt);
        if (d.oggetto) f.oggetto.value = String(d.oggetto).trim();
        if (d.corpo) f.corpo.value = String(d.corpo);
        toast('Bozza generata: controllala prima di inviare');
      } catch (err) {
        toast(messaggioIA(err));
      } finally {
        btnIA.disabled = false;
        btnIA.innerHTML = etichetta;
      }
    });
    f.addEventListener('submit', e => { e.preventDefault(); inviaEmail(f, appId, cid); });
    m.querySelector('#btnMailto').addEventListener('click', () => {
      const to = f.to.value.trim(), subj = f.oggetto.value.trim(), body = f.corpo.value;
      if (!isEmail(to)) { toast('Indirizzo email non valido'); return; }
      window.location.href = 'mailto:' + encodeURIComponent(to) +
        '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
    });

}

async function inviaEmail(f, appId, cid) {
  const to = f.to.value.trim();
  const oggetto = f.oggetto.value.trim();
  const corpo = f.corpo.value;
  if (!isEmail(to)) { toast('Indirizzo email non valido'); return; }
  if (!oggetto) { toast('Inserisci l’oggetto'); return; }
  if (!gmailOk()) { toast('Collega Gmail prima di inviare'); return; }
  try {
    await gmailFetch('messages/send', { method: 'POST', body: JSON.stringify({ raw: buildRaw({ to, oggetto, corpo }) }) });
  } catch (err) {
    toast('Invio non riuscito: ' + err.message);
    return;
  }
  if (appId && S.appuntamenti[appId]) {
    const storico = storicoOf(S.appuntamenti[appId]);
    storico.push({ tipo: 'email', oggetto, quando: new Date().toISOString() });
    await esegui(userRef('appuntamenti/' + appId).update({ storico, aggiornato: Date.now() }));
  }
  closeModal();
  aggiornaLivello();
  toast('Email inviata');
}

function schedaEmail(m, extra = '') {
  const h = headersDi(m);
  return `<div class="blueprint email-card">${CORNERS}
    <div class="card-title">${esc(h.subject || '(senza oggetto)')}</div>
    <div class="card-meta" style="flex-wrap:wrap">${esc(h.from || '')} · ${esc(h.date || '')}</div>
    ${m.snippet ? `<div class="muted">${esc(m.snippet)}</div>` : ''}${extra}</div>`;
}

async function caricaPosta(cid) {
  const box = $('#posta', livelli[livelli.length - 1]?.el || document);
  const c = S.contatti[cid] || {};
  if (!c.email) { toast('Il contatto non ha un’email'); return; }
  if (!box) return;
  if (!gmailOk()) { box.innerHTML = gmailPulsante(); return; }
  box.innerHTML = '<p class="muted" style="margin:0">Caricamento…</p>';
  try {
    const q = encodeURIComponent(`from:${c.email} OR to:${c.email}`);
    const lista = await gmailFetch('messages?maxResults=10&q=' + q);
    const ids = (lista.messages || []).map(m => m.id);
    if (!ids.length) { box.innerHTML = '<p class="muted" style="margin:0">Nessuna email trovata.</p>'; return; }
    const dettagli = await Promise.all(ids.map(id => gmailFetch(`messages/${id}?${DETTAGLI_EMAIL}`)));
    box.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${dettagli.map(m => schedaEmail(m)).join('')}</div>`;
  } catch (err) {
    box.innerHTML = `<p class="err">Impossibile caricare le email: ${esc(err.message)}</p>`;
  }
}

// Indirizzi autorizzati a confermare; predefinito: showroom Mirisa.
function indirizziConferma() {
  const v = S.impostazioni?.indirizziConferma;
  const lista = Array.isArray(v) ? v : (v ? Object.values(v) : []);
  return lista.length ? lista : ['mirisa.ceramiche@gmail.com'];
}

// Cerca nella posta degli indirizzi autorizzati, dopo la creazione, le email riferite al contatto o all'azienda.
// Non cambia lo stato: mostra le conferme e l'utente sceglie.
async function caricaConferme(aid) {
  const box = $('#conferme', livelli[livelli.length - 1]?.el || document);
  const a = S.appuntamenti[aid];
  if (!box || !a) return;
  if (a.confermaEmail) {
    box.innerHTML = `<p class="muted" style="margin:0">Confermato da ${esc(a.confermaEmail.da || '')}${a.confermaEmail.quando ? ' il ' + esc(new Date(a.confermaEmail.quando).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' })) : ''}.</p>`;
    return;
  }
  if (!gmailOk()) { box.innerHTML = gmailPulsante(); return; }
  const c = S.contatti[a.contattoId] || {};
  const chiavi = [c.nome, c.email, a.azienda].filter(Boolean).map(norm).filter(Boolean);
  const dopo = Math.floor((a.creato || 0) / 1000);
  box.innerHTML = '<p class="muted" style="margin:0">Ricerca conferme…</p>';
  try {
    const trovati = [];
    for (const mitt of indirizziConferma()) {
      const lista = await gmailFetch('messages?maxResults=20&q=' + encodeURIComponent(`from:${mitt} after:${dopo}`));
      for (const m of (lista.messages || [])) {
        trovati.push(await gmailFetch(`messages/${m.id}?${DETTAGLI_EMAIL}`));
      }
    }
    const compatibili = trovati.filter(d => {
      const h = headersDi(d);
      const testo = norm(`${h.subject || ''} ${d.snippet || ''} ${h.from || ''}`);
      return chiavi.some(k => testo.includes(k));
    });
    box.innerHTML = compatibili.length
      ? `<div style="display:flex;flex-direction:column;gap:14px">${compatibili.map(d => {
          const h = headersDi(d);
          return schedaEmail(d, CHIUSI.includes(a.stato) ? '' : `<button class="btn btn-primary" data-act="segnaConfermato" data-id="${esc(aid)}"
              data-msg="${esc(d.id)}" data-da="${esc(h.from || '')}" data-quando="${esc(dataEmail(h))}" style="align-self:flex-start;margin-top:6px">Segna confermato</button>`);
        }).join('')}</div>`
      : '<p class="muted" style="margin:0">Nessuna conferma riconosciuta dagli indirizzi autorizzati.</p>';
  } catch (err) {
    box.innerHTML = `<p class="err">Impossibile cercare le conferme: ${esc(err.message)}</p>`;
  }
}

// Stato 'confermato' solo su scelta esplicita dell'utente; salva la conferma.
async function segnaConfermato(aid, conf) {
  const a = S.appuntamenti[aid];
  if (!a) return 'errore';
  if (CHIUSI.includes(a.stato)) { toast('Appuntamento già chiuso'); return 'errore'; }
  const nowIso = new Date().toISOString();
  const storico = storicoOf(a);
  if (a.stato !== 'confermato') storico.push({ tipo: 'stato', da: a.stato, a: 'confermato', quando: nowIso });
  storico.push({ tipo: 'conferma', da: conf.da, quando: conf.quando });
  return esegui(userRef('appuntamenti/' + aid).update({
    stato: 'confermato',
    confermaEmail: { messaggioId: conf.messaggioId, da: conf.da, quando: conf.quando },
    storico, aggiornato: Date.now()
  }), 'Appuntamento confermato');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  // Invio o spazio sugli elementi cliccabili non nativi (schede, righe).
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) {
    e.preventDefault();
    e.target.click();
  }
});

// ===================== AZIONI =====================
// Cambio di sezione con dissolvenza: l'animazione parte solo qui, non a ogni aggiornamento dei dati.
const SCHEDE = ['agenda', 'calendario', 'cerca', 'contatti', 'impostazioni'];
function vaiA(vista) {
  // La nuova sezione entra dal lato della scheda toccata.
  const verso = SCHEDE.indexOf(vista) - SCHEDE.indexOf(S.vista);
  S.vista = vista;
  const main = $('#main');
  main.innerHTML = '';
  main.classList.remove('entra', 'da-destra', 'da-sinistra');
  if (verso) main.classList.add(verso > 0 ? 'da-destra' : 'da-sinistra');
  render();
  void main.offsetWidth;
  main.classList.add('entra');
  window.scrollTo(0, 0);
}

  nav: d => vaiA(d.v),
  logout: () => auth.signOut(),
  // Nella sezione Contatti il + crea un contatto, senza appuntamento.

  },

  rapida: () => {},

  vibrazione: d => { if (d.v === 'off') lsSet('vibrazione', 'off'); else { lsDel('vibrazione'); vibra('ok'); } render(); },

  // agenda
  modoAgenda: d => { S.modoAgenda = d.m; lsSet('modo_agenda', d.m); render(); },
  giorno: d => { if (S.giorno !== d.d) S.animaGiorno = true; S.giorno = d.d; render(); },
  settimana: d => { S.animaGiorno = true; S.giorno = isoOf(addDays(isoToDate(S.giorno || todayISO()), Number(d.k))); render(); },
  vaiOggi: () => { S.animaGiorno = true; S.giorno = todayISO(); render(); },
  // calendario
  mese: d => {
    const p = isoToDate(S.mese);
    S.mese = isoOf(new Date(p.getFullYear(), p.getMonth() + Number(d.k), 1));
    S.calSel = S.mese.slice(0, 7) === todayISO().slice(0, 7) ? todayISO() : S.mese;
    S.animaGiorno = true;
    render();
  },

    render();
