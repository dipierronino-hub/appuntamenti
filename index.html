<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f3">
<title>Appuntamenti</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap">
<style>
/* ===== Token "Industry": fondo chiaro tecnico, un solo accento acciaio ===== */
:root{
  --color-bg:#f2f2f3;--color-surface:#e9e9ea;--color-text:#1d1f20;--color-accent:#5980a6;
  --color-divider:color-mix(in srgb,#1d1f20 16%,transparent);
  --color-neutral-100:#f5f5f8;--color-neutral-200:#e7e7ea;--color-neutral-300:#d4d4d7;--color-neutral-400:#b7b7ba;--color-neutral-500:#98989b;--color-neutral-600:#7a7a7d;--color-neutral-700:#5d5d60;--color-neutral-800:#424244;--color-neutral-900:#2b2b2d;
  --color-accent-100:#eef6ff;--color-accent-200:#d6ebff;--color-accent-300:#b5d9fd;--color-accent-400:#94bce3;--color-accent-500:#749dc4;--color-accent-600:#597ea3;--color-accent-700:#416180;--color-accent-800:#2c455d;--color-accent-900:#1d2d3d;
  --color-warn:#9a5b00;--color-warn-bg:color-mix(in srgb,#c98a1a 14%,transparent);
  --color-bad:#a8322a;
  --font-heading:"Barlow Condensed",system-ui,sans-serif;--font-body:"Barlow",system-ui,sans-serif;
  --shadow-lg:0 12px 32px color-mix(in srgb,#2b2b2d 22%,transparent);
  --col:560px;--tabs-h:64px
}
/* Tema scuro: le rampe si invertono, l'accento resta acciaio. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-bg:#16191c;--color-surface:#1e2226;--color-text:#e4e6e8;--color-accent:#7fa3c6;
  --color-divider:color-mix(in srgb,#e4e6e8 18%,transparent);
  --color-neutral-100:#1e2023;--color-neutral-200:#0f1113;--color-neutral-300:#3a3b3e;--color-neutral-400:#55565a;--color-neutral-500:#77787c;--color-neutral-600:#97989c;--color-neutral-700:#b4b5b9;--color-neutral-800:#d0d1d4;--color-neutral-900:#ececef;
  --color-accent-100:#1d2d3d;--color-accent-200:#2c455d;--color-accent-300:#416180;--color-accent-400:#597ea3;--color-accent-500:#749dc4;--color-accent-600:#94bce3;--color-accent-700:#b5d9fd;--color-accent-800:#d6ebff;--color-accent-900:#eef6ff;
  --color-warn:#e7b25a;--color-bad:#ef8a80;
  --shadow-lg:0 12px 32px rgba(0,0,0,.55)
}}
:root[data-theme="dark"]{
  --color-bg:#16191c;--color-surface:#1e2226;--color-text:#e4e6e8;--color-accent:#7fa3c6;
  --color-divider:color-mix(in srgb,#e4e6e8 18%,transparent);
  --color-neutral-100:#1e2023;--color-neutral-200:#0f1113;--color-neutral-300:#3a3b3e;--color-neutral-400:#55565a;--color-neutral-500:#77787c;--color-neutral-600:#97989c;--color-neutral-700:#b4b5b9;--color-neutral-800:#d0d1d4;--color-neutral-900:#ececef;
  --color-accent-100:#1d2d3d;--color-accent-200:#2c455d;--color-accent-300:#416180;--color-accent-400:#597ea3;--color-accent-500:#749dc4;--color-accent-600:#94bce3;--color-accent-700:#b5d9fd;--color-accent-800:#d6ebff;--color-accent-900:#eef6ff;
  --color-warn:#e7b25a;--color-bad:#ef8a80;
  --shadow-lg:0 12px 32px rgba(0,0,0,.55)
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-neutral-200);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-.015em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--color-accent-700);text-underline-offset:3px}
a:hover{color:var(--color-accent-800)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
.noscroll::-webkit-scrollbar{display:none}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--color-bad) 50%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Oggetti "blueprint": bordo sottile, angoli squadrati, crocini di registro ===== */
.blueprint{position:relative;border:1px solid var(--color-divider);border-radius:0}
.blueprint>.corner{position:absolute;width:11px;height:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent);pointer-events:none}
.blueprint>.corner::before,.blueprint>.corner::after{content:"";position:absolute;background:currentColor}
.blueprint>.corner::before{left:5px;top:0;width:1px;height:100%}
.blueprint>.corner::after{top:5px;left:0;width:100%;height:1px}
.blueprint>.corner.tl{top:-6px;left:-6px}.blueprint>.corner.tr{top:-6px;right:-6px}
.blueprint>.corner.bl{bottom:-6px;left:-6px}.blueprint>.corner.br{bottom:-6px;right:-6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-family:var(--font-heading);font-weight:600;font-size:14px;line-height:1.2;color:var(--color-text);background:transparent;border:1px solid var(--color-divider);border-radius:0;padding:7px 12px;min-height:36px}
.btn svg{display:block;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg)}
.btn-primary:hover{background:var(--color-accent-600);color:var(--color-bg)}
.btn-primary:active{background:var(--color-accent-700)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent);color:var(--color-text)}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
.btn-ghost{color:var(--color-accent-700);border-color:transparent;padding-inline:4px}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent);color:var(--color-accent-700)}
.btn-ghost:active{background:color-mix(in srgb,var(--color-accent) 18%,transparent)}
.btn-danger{color:var(--color-bad)}
.btn-danger:hover{background:color-mix(in srgb,var(--color-bad) 8%,transparent);color:var(--color-bad)}
.btn-icon{width:36px;height:36px;padding:0}
.btn-block{width:100%}

.card-kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)}
.card-title{font-family:var(--font-heading);font-weight:600;font-size:17px;line-height:1.2}
.card-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-neutral-700)}
.muted{color:var(--color-neutral-700);font-size:13px}
.err{color:var(--color-bad);font-size:13px;min-height:1.2em;margin:0}

.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:0;white-space:nowrap;flex:none}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent-700);padding:2px 9px}
.tag-warn{background:var(--color-warn-bg);color:var(--color-warn)}
.tag-bad{border:1px solid var(--color-bad);color:var(--color-bad);padding:2px 9px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;color:color-mix(in srgb,var(--color-text) 70%,transparent)}
.input{width:100%;min-height:42px;padding:8px 10px;font-size:16px;color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0;-webkit-appearance:none;appearance:none}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.input:focus-visible,.input:focus{border-color:var(--color-accent);outline:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea.input{min-height:90px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:10px}
.seg{display:flex;border:1px solid var(--color-divider)}
.seg>button{flex:1;min-height:36px;border:0;background:transparent;cursor:pointer;font-size:13px;padding:6px 8px}
.seg>button+button{border-left:1px solid var(--color-divider)}
.seg>button[aria-pressed="true"]{background:var(--color-accent);color:var(--color-bg)}
.seg>button:not([aria-pressed="true"]):hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}

/* ===== Struttura dell'app ===== */
#app{max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--color-bg)}
@media (min-width:600px){#app{border-inline:1px solid var(--color-divider)}}
.view{padding:calc(16px + env(safe-area-inset-top)) 20px calc(var(--tabs-h) + 110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.head h1{margin:2px 0 0;font-size:38px;text-transform:capitalize}
.head .card-kicker{font-size:11px}

.tabs{position:fixed;bottom:0;left:0;right:0;margin-inline:auto;max-width:var(--col);z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:calc(var(--tabs-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--color-bg);border-top:1px solid var(--color-divider)}
.tab{position:relative;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-600)}
.tab+.tab{border-left:1px solid var(--color-divider)}
.tab:hover{color:var(--color-text)}
.tab[aria-current="page"]{color:var(--color-accent-700)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--color-accent)}

.fabs{position:fixed;z-index:9;bottom:calc(var(--tabs-h) + 18px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - var(--col)) / 2 + 20px));display:flex;gap:12px;align-items:center}
.fab{display:grid;place-items:center;cursor:pointer;border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text)}
.fab.mic{width:48px;height:48px}
.fab.mic:hover{background:var(--color-neutral-100)}
.fab.add{width:58px;height:58px;background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg);box-shadow:var(--shadow-lg)}
.fab.add:hover{background:var(--color-accent-600)}
.fab.add:active{background:var(--color-accent-700)}
.ascolto{background:var(--color-bad)!important;border-color:var(--color-bad)!important;color:#fff!important;animation:pulse 1.2s infinite}

/* Schermate sovrapposte (dettaglio, modulo) e fogli dal basso */
.layer{position:fixed;inset:0;z-index:20}
.page{position:absolute;top:0;bottom:0;left:0;right:0;margin-inline:auto;max-width:var(--col);background:var(--color-bg);overflow-y:auto;overscroll-behavior:contain;animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
.page.up{animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
.page-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--color-bg);border-bottom:1px solid var(--color-divider)}
.page-bar .card-kicker{font-size:11px}
.page-body{padding:18px 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.page-foot{position:sticky;bottom:0;z-index:3;display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--color-bg);border-top:1px solid var(--color-divider)}
.page-foot .btn{flex:1;min-height:46px;font-size:16px}
.backdrop{position:absolute;inset:0;background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);animation:fadeIn .2s ease}
.sheet{position:absolute;bottom:0;left:0;right:0;margin-inline:auto;max-width:var(--col);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--color-bg);border-top:1px solid var(--color-divider);padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
.sheet h2{font-size:24px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.sezione{display:flex;flex-direction:column;gap:10px}
.sezione>h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-body);font-weight:500;color:var(--color-neutral-700);display:flex;justify-content:space-between;align-items:center;gap:8px}
.griglia{display:grid;border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)}
.griglia>*{border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:10px 12px;min-width:0}
.cella-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)}
.cella-v{font-family:var(--font-heading);font-weight:600;font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.riga{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-divider);min-width:0}
.riga:first-child{border-top:1px solid var(--color-divider)}
.riga .testo{flex:1;min-width:0}
.riga .testo>div:first-child{overflow-wrap:anywhere}
.riga.cliccabile{cursor:pointer}
.riga.cliccabile:hover{background:color-mix(in srgb,var(--color-accent) 6%,transparent)}
.avatar{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid var(--color-accent-400);color:var(--color-accent-700);font-family:var(--font-heading);font-weight:600;font-size:16px}
.azioni-contatto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--color-divider)}
.azioni-contatto>*{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:62px;font-size:12px;color:var(--color-accent-700);text-decoration:none;background:transparent;border:0;cursor:pointer}
.azioni-contatto>*+*{border-left:1px solid var(--color-divider)}
.azioni-contatto>*:hover{background:color-mix(in srgb,var(--color-accent) 8%,transparent)}
.azioni-contatto>[aria-disabled="true"]{opacity:.4;pointer-events:none}
.avviso{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--color-warn-bg);color:var(--color-warn);font-size:13px;border-left:2px solid var(--color-warn)}
.avviso svg{flex:none;margin-top:1px}
.vuoto{padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.storico{list-style:none;margin:0;padding:0;font-size:13px}
.storico li{padding:8px 0 8px 14px;border-left:1px solid var(--color-divider);position:relative}
.storico li::before{content:"";position:absolute;left:-3px;top:15px;width:5px;height:5px;background:var(--color-accent)}
.email-card{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.email-card .card-title{font-size:15px}

.giorno-label{font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-700);padding-top:6px}
.app-item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;cursor:pointer}
.app-item .ora1{font-family:var(--font-heading);font-weight:600;font-size:20px;line-height:1}
.app-item .ora2{font-size:11px;color:var(--color-neutral-600);margin-top:4px}
.app-item .box{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.app-item:hover .box{background:color-mix(in srgb,var(--color-accent) 6%,transparent)}
.ora-adesso{display:flex;align-items:center;gap:8px;color:var(--color-accent-700);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ora-adesso span:first-child{font-family:var(--font-heading);font-weight:600;font-size:13px}
.ora-adesso span:last-child{flex:1;height:1px;background:var(--color-accent)}

.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100vw - 32px);bottom:calc(var(--tabs-h) + 92px + env(safe-area-inset-bottom));z-index:40;background:var(--color-text);color:var(--color-bg);padding:11px 16px;font-size:14px;box-shadow:var(--shadow-lg);animation:toastIn .25s ease}
.toast[data-tipo="err"]{background:var(--color-bad);color:#fff}
.layer~.toast{bottom:calc(84px + env(safe-area-inset-bottom))}

#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 20px;background:var(--color-bg)}
.login-card{width:100%;max-width:380px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login-card h1{font-size:44px}
.banner{padding:10px 12px;background:var(--color-warn-bg);color:var(--color-warn);font-size:13px}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm" class="login-card blueprint">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div>
      <div class="card-kicker" style="font-size:11px">Agenda personale</div>
      <h1>Appuntamenti</h1>
    </div>
    <div id="configBanner" class="banner" hidden>Configurazione Firebase mancante: vedi le istruzioni nella specifica (sezione 9).</div>
    <label class="field"><span>Email</span><input class="input" name="email" type="email" required autocomplete="username"></label>
    <label class="field"><span>Password</span><input class="input" name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" style="min-height:46px;font-size:16px;margin-top:4px">Accedi</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" hidden>
  <main id="main"></main>
  <nav class="tabs" aria-label="Sezioni">
    <button class="tab" data-act="nav" data-v="agenda"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Agenda</span></button>
    <button class="tab" data-act="nav" data-v="calendario"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="18"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Mese</span></button>
    <button class="tab" data-act="nav" data-v="cerca"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>Cerca</span></button>
    <button class="tab" data-act="nav" data-v="contatti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.1a4 4 0 0 1 0 7.8M22 21a7 7 0 0 0-4-6.3"/></svg><span>Contatti</span></button>
    <button class="tab" data-act="nav" data-v="impostazioni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Altro</span></button>
  </nav>

function esc(s) {

// Normalizza un numero: '' se vuoto, null se non valido, altrimenti cifre con prefisso +39 se presente.
function normTel(s) {
  const t = String(s ?? '').trim();
  if (t === '') return '';
  if (/[^\d\s+\-.()]/.test(t)) return null;
  const plus = t.startsWith('+');
  let d = t.replace(/\D/g, '');
  let prefisso = false;
  if (d.startsWith('0039')) { d = d.slice(4); prefisso = true; }
  else if (plus && d.startsWith('39')) { d = d.slice(2); prefisso = true; }
  if (d.length < 6 || d.length > 15) return null;
  if (prefisso) return '+39' + d;
  return plus ? '+' + d : d;
}

function isEmail(s) {

function validDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s ?? ''));
  if (!m) return false;
  const y = +m[1], mo = +m[2] - 1, d = +m[3];
  const dt = new Date(y, mo, d);
  return dt.getFullYear() === y && dt.getMonth() === mo && dt.getDate() === d;
}

function validTime(s) {

}

function isoOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function addDays(d, k) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + k);
}

function todayISO() {
  return isoOf(new Date());
}

function fmtData(iso) {

function fmtCorta(iso) {

function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function parseData(s, oggi = new Date()) {
  const n = norm(s);
  const base = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate());
  let d = null;
  if (/\boggi\b/.test(n)) d = base;
  else if (/\bdopodomani\b/.test(n)) d = addDays(base, 2);
  else if (/\bdomani\b/.test(n)) d = addDays(base, 1);
  else {
    const wd = Object.keys(GIORNI).find(k => new RegExp('\\b' + k + '\\b').test(n));
    if (wd !== undefined) d = addDays(base, ((GIORNI[wd] - base.getDay() + 7) % 7) || 7);
  }
  if (!d) {
    const mm = new RegExp('\\b(\\d{1,2})\\s+(' + Object.keys(MESI).join('|') + ')\\b').exec(n);
    if (mm) {
      const gg = +mm[1], me = MESI[mm[2]];
      let c = new Date(base.getFullYear(), me, gg);
      if (c.getMonth() !== me) return null;
      if (c < base) c = new Date(base.getFullYear() + 1, me, gg);
      d = c;
    } else {
      const il = /\bil\s+(\d{1,2})\b/.exec(n);
      if (il) {
        const gg = +il[1], mo = base.getMonth();
        let c = new Date(base.getFullYear(), mo, gg);
        if (c.getMonth() !== mo) return null;
        if (c < base) {
          c = new Date(base.getFullYear(), mo + 1, gg);
          if (c.getDate() !== gg) return null;
        }
        d = c;
      }
    }
  }
  return d ? isoOf(d) : null;
}

// Ora HH:MM dal testo grezzo (norm() non va usato: trasformerebbe i due punti).
function parseOra(s) {
  const m = /\b(?:alle?|ore)\s+(\d{1,2})(?:[:.](\d{2})|\s+e\s+(mezza|\d{1,2}))?(?=\s|$)/.exec(String(s ?? '').toLowerCase());
  if (!m) return null;
  const h = +m[1];
  const min = m[2] !== undefined ? +m[2] : (m[3] === 'mezza' ? 30 : (m[3] !== undefined ? +m[3] : 0));
  if (h > 23 || min > 59) return null;
  return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
}

function parseMotivo(s) {
  const m = /\bper\s+(.+)$/i.exec(String(s ?? ''));
  return m ? m[1].trim() : '';
}

const MARCATORI_NOME = '(?:il|alle?|domani|oggi|dopodomani|per|lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica)';

function estraiNome(s) {
  // Il marcatore può trovarsi anche a inizio frase: in quel caso il nome è vuoto.
  return String(s ?? '').trim().split(new RegExp('(?:^|\\s+)' + MARCATORI_NOME + '(?=\\s|$)', 'i'))[0].trim();
}

// Contatto il cui nome contiene tutte le parole pronunciate; null se assente o ambiguo.
function trovaContatto(contatti, nome) {
  const q = norm(nome);
  if (!q) return null;
  const parole = q.split(' ');
  let migliori = [], punti = 0;
  for (const [id, c] of Object.entries(contatti || {})) {
    const cn = norm(c.nome || '');
    if (cn === q) return { id, ...c };
    const parti = cn.split(' ');
    const hit = parole.filter(p => parti.some(x => x.startsWith(p))).length;
    if (hit === parole.length) {
      if (hit > punti) { migliori = [{ id, ...c }]; punti = hit; }
      else if (hit === punti) migliori.push({ id, ...c });
    }
  }
  return migliori.length === 1 ? migliori[0] : null;
}
// ----- Comandi vocali -----
// Riconosce il comando dal testo pronunciato. Restituisce { tipo, ... } con tipo:
// 'nuovo' | 'sposta' | 'chiama' | 'cerca' | 'agenda' | 'sconosciuto'.
// Il testo viene esaminato grezzo (minuscolo) per conservare nomi e orari.
function classificaComando(raw) {
  const testo = String(raw ?? '').trim();
  let m;
  if ((m = /^(?:nuovo|fissa|crea|prendi)\s+(?:un\s+)?appuntamento\s+(?:con\s+)?(.+)$/i.exec(testo))) {
    const rest = m[1];
    return {
      tipo: 'nuovo', nome: estraiNome(rest), data: parseData(rest),
      ora: parseOra(rest), motivo: parseMotivo(rest)
    };
  }
  if ((m = /^(?:sposta|rimanda)\s+(.+?)\s+(a|al|alla|alle|il)\s+(.+)$/i.exec(testo))) {
    const rest = `${m[2]} ${m[3]}`;
    return { tipo: 'sposta', nome: m[1].trim(), data: parseData(rest), ora: parseOra(rest) };
  }
  if ((m = /^(?:chiama|telefona)\s+(?:a\s+)?(.+)$/i.exec(testo))) {
    return { tipo: 'chiama', nome: m[1].trim() };
  }
  if ((m = /^cerca\s+(.+)$/i.exec(testo))) {
    return { tipo: 'cerca', nome: m[1].trim() };
  }
  if (/^(?:mostra\s+)?agenda$/i.test(testo)) {
    return { tipo: 'agenda' };
  }
  return { tipo: 'sconosciuto' };
}

function b64Std(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function b64Url(str) {
  return b64Std(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// Oggetto codificato solo se contiene caratteri non ASCII.
function encHeader(s) {
  return /^[\x00-\x7F]*$/.test(s) ? s : '=?UTF-8?B?' + b64Std(s) + '?=';
}

// Messaggio RFC 2822 in base64url, pronto per messages.send di Gmail.
function buildRaw({ to, oggetto, corpo }) {
  const msg = `To: ${pulisciHeader(to)}\r\n` +
    `Subject: ${encHeader(pulisciHeader(oggetto))}\r\n` +
    'Content-Type: text/plain; charset=UTF-8\r\n' +
    'MIME-Version: 1.0\r\n\r\n' +
    String(corpo ?? '');
  return b64Url(msg);
}

// Pila di livelli: pagine a tutto schermo (dettaglio, moduli) e fogli dal basso (rimanda, email).
// Il tasto Indietro di Android chiude il livello in cima grazie a una voce di cronologia "guardia".
const livelli = [];

function apriLivello(html, { tipo = 'page', anim = '', onMount, refresh } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'layer';
  wrap.innerHTML = tipo === 'sheet'
    ? `<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`
    : `<div class="page ${anim}" role="dialog" aria-modal="true">${html}</div>`;
  if (tipo === 'sheet') wrap.querySelector('.backdrop').addEventListener('click', closeModal);
  document.body.appendChild(wrap);
  const box = wrap.lastElementChild;
  livelli.push({ el: wrap, refresh });
  if (onMount) onMount(box);
  const primo = box.querySelector('[autofocus]');
  if (primo) primo.focus();
  return box;
}

function openPage(html, onMount, opt = {}) { return apriLivello(html, { ...opt, onMount }); }
function openModal(html, onMount) { return apriLivello(html, { tipo: 'sheet', onMount }); }

function closeModal() {
  const l = livelli.pop();
  if (l) l.el.remove();
}

  if (!nome) return { ok: false, msg: 'Inserisci il nome del contatto' };

  if (tel === null) return { ok: false, msg: 'Numero di telefono non valido' };
  if (email && !isEmail(email)) return { ok: false, msg: 'Email non valida' };
  if (!tel && !email) return { ok: false, msg: 'Inserisci almeno un telefono o un’email' };
  const dati = { nome, telefono: tel, email };
  if ('note' in v) dati.note = String(v.note ?? '').trim();
  return { ok: true, dati };
}

async function salvaContatto(v, cid) {

// Appuntamenti (non annullati) che si sovrappongono all'intervallo indicato, escluso exceptId.
function sovrapposti(data, ora, durata, exceptId) {
  if (!validDate(data) || !validTime(ora)) return [];
  const ini = minuti(ora), fine = ini + (Number(durata) || 30);
  return appuntamentiCompleti().filter(a => a.id !== exceptId && a.data === data && a.stato !== 'annullato' &&
    minuti(a.ora) < fine && ini < minuti(a.ora) + (Number(a.durata) || 30)).sort(byDt);
}

// Salva contatto e appuntamento in un solo update multi-percorso.
// I conflitti sono già stati mostrati nel modulo: qui non si chiede più conferma.
// Restituisce 'ok' o 'errore'.
async function salvaAppuntamento(v, aid) {
  // La nota del modulo appuntamento non deve sovrascrivere la nota del contatto.
  const { note: _notaAppuntamento, ...datiContatto } = v;
  const rc = validaContatto(datiContatto);
  if (!rc.ok) { toast(rc.msg); return 'errore'; }
  const ra = validaAppuntamento(v);
  if (!ra.ok) { toast(ra.msg); return 'errore'; }
  const app = aid ? S.appuntamenti[aid] : null;
  if (aid && !app) { toast('Appuntamento non trovato'); return 'errore'; }

  const { data, ora } = ra.dati;
  const uid = S.user.uid;
  const cid = v.contattoId || userRef('contatti').push().key;
  const appId = aid || userRef('appuntamenti').push().key;
  const contattoPrec = S.contatti[cid] || {};
  const nowMs = Date.now(), nowIso = new Date().toISOString();

  const storico = app ? storicoOf(app) : [{ tipo: 'creato', quando: nowIso }];
  if (app && (app.data !== data || app.ora !== ora)) {
    storico.push({ tipo: 'spostato', da: { data: app.data, ora: app.ora }, a: { data, ora }, quando: nowIso });
  }

  const updates = {};
  updates[`users/${uid}/contatti/${cid}`] = {
    ...contattoPrec, ...rc.dati, creato: contattoPrec.creato ?? nowMs, aggiornato: nowMs
  };
  updates[`users/${uid}/appuntamenti/${appId}`] = {
    contattoId: cid, ...ra.dati, rinvii: app?.rinvii || 0, storico,
    creato: app?.creato ?? nowMs, aggiornato: nowMs,
    ...(app?.confermaEmail ? { confermaEmail: app.confermaEmail } : {})
  };
  return esegui(db.ref().update(updates), 'Appuntamento salvato').then(res => res === 'errore' ? 'errore' : 'ok');
}

// Rinvio: data/ora nuove, contatore, storico. Stato 'confermato' torna 'programmato'; completato e annullato restano.
async function rimandaApp(aid, v) {
  const a = S.appuntamenti[aid];
  if (!a) { toast('Appuntamento non trovato'); return 'errore'; }
  if (!validDate(v.data)) { toast('Data non valida'); return 'errore'; }
  if (!validTime(v.ora)) { toast('Ora non valida'); return 'errore'; }
  if (v.data === a.data && v.ora === a.ora) { toast('Scegli una data o un’ora diverse'); return 'errore'; }
  const storico = storicoOf(a);
  storico.push({
    tipo: 'rimandato', da: { data: a.data, ora: a.ora }, a: { data: v.data, ora: v.ora },
    motivo: String(v.motivo ?? '').trim(), quando: new Date().toISOString()
  });
  const stato = a.stato === 'confermato' ? 'programmato' : a.stato;
  return esegui(userRef('appuntamenti/' + aid).update({
    data: v.data, ora: v.ora, stato, rinvii: (a.rinvii || 0) + 1, storico, aggiornato: Date.now()
  }), 'Appuntamento rimandato').then(res => res === 'errore' ? 'errore' : 'ok');
}

async function cambiaStato(aid, nuovo) {
  const a = S.appuntamenti[aid];

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage non disponibile */ } }

function applicaTema(t) {
  const root = document.documentElement;
  if (t === 'chiaro') root.dataset.theme = 'light';
  else if (t === 'scuro') root.dataset.theme = 'dark';
  else delete root.dataset.theme;
  const scuro = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]').content = scuro ? '#16191c' : '#f2f2f3';
}

const MODELLO_IA_PREDEFINITO = 'gemini-2.5-flash';

// Chiamata all'API Gemini. Con comeJson restituisce un oggetto, altrimenti il testo.
async function chiediGemini(prompt, comeJson = true) {
  const chiave = lsGet('gemini_key');
  if (!chiave) throw new Error('chiave mancante');
  const modello = lsGet('gemini_model') || MODELLO_IA_PREDEFINITO;
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modello) + ':generateContent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': chiave },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: comeJson ? { temperature: 0.2, responseMimeType: 'application/json' } : { temperature: 0.4 }
    })
  });
  if (!r.ok) throw new Error('Gemini ' + r.status);
  const j = await r.json();
  const testo = (j?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  if (!testo) throw new Error('risposta vuota');
  if (!comeJson) return testo;
  const m = /\{[\s\S]*\}/.exec(testo);
  if (!m) throw new Error('formato non valido');
  try { return JSON.parse(m[0]); } catch (e) { throw new Error('formato JSON non valido'); }
}

// Numero per wa.me: solo cifre con prefisso internazionale (italiano se manca).
function numeroWhatsApp(tel) {
  const t = normTel(tel);
  if (!t) return '';
  if (t.startsWith('+')) return t.slice(1);
  return '39' + t.replace(/^0039/, '');
}
const linkWhatsApp = (tel, testo = '') => `https://wa.me/${numeroWhatsApp(tel)}${testo ? '?text=' + encodeURIComponent(testo) : ''}`;
const linkMappa = luogo => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(luogo);

// Data e ora locali nel formato compatto usato da Google Calendar e iCalendar.
function stampDt(data, minutiTot) {
  const d = addDays(isoToDate(data), Math.floor(minutiTot / 1440));
  const m = minutiTot % 1440;
  return isoOf(d).replace(/-/g, '') + 'T' + hhmm(m).replace(':', '') + '00';
}

function titoloApp(a, c) {
  return [a.motivo, c.nome].filter(Boolean).join(' · ') || 'Appuntamento';
}

function linkGoogleCalendar(a, c) {
  const ini = minuti(a.ora);
  const p = new URLSearchParams({
    action: 'TEMPLATE',
    text: titoloApp(a, c),
    dates: `${stampDt(a.data, ini)}/${stampDt(a.data, ini + (Number(a.durata) || 30))}`,
    details: [a.azienda && 'Azienda: ' + a.azienda, c.telefono && 'Tel: ' + c.telefono, c.email && 'Email: ' + c.email, a.note].filter(Boolean).join('\n'),
    location: a.luogo || '',
    ctz: 'Europe/Rome'
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

// File .ics con tutti gli appuntamenti non annullati: si importa in Google Calendar o in qualsiasi calendario.
function esportaIcs() {
  const escIcs = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const ora = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const righe = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Appuntamenti//IT', 'CALSCALE:GREGORIAN'];
  appuntamentiCompleti().filter(a => a.stato !== 'annullato').forEach(a => {
    const ini = minuti(a.ora);
    righe.push('BEGIN:VEVENT', `UID:${a.id}@appuntamenti`, `DTSTAMP:${ora}`,
      `DTSTART;TZID=Europe/Rome:${stampDt(a.data, ini)}`, `DTEND;TZID=Europe/Rome:${stampDt(a.data, ini + (Number(a.durata) || 30))}`,
      `SUMMARY:${escIcs(titoloApp(a, a.contatto))}`);
    if (a.luogo) righe.push(`LOCATION:${escIcs(a.luogo)}`);
    const det = [a.azienda, a.contatto.telefono, a.note].filter(Boolean).join('\n');
    if (det) righe.push(`DESCRIPTION:${escIcs(det)}`);
    righe.push('END:VEVENT');
  });
  righe.push('END:VCALENDAR');
  const url = URL.createObjectURL(new Blob([righe.join('\r\n')], { type: 'text/calendar' }));
  const link = Object.assign(document.createElement('a'), { href: url, download: `appuntamenti-${todayISO()}.ics` });
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('File del calendario scaricato');
}

// Notifiche locali: arrivano mentre l'app è aperta o resta attiva in background.
// Ogni appuntamento ha 'promemoria' (minuti di anticipo, 0 = nessuno).
const SCELTE_PROMEMORIA = [[0, 'Nessuno'], [10, '10 minuti prima'], [30, '30 minuti prima'], [60, '1 ora prima'], [120, '2 ore prima'], [1440, 'Il giorno prima']];
const etichettaPromemoria = m => (SCELTE_PROMEMORIA.find(([v]) => v === m) || [m, `${m} minuti prima`])[1];

function promemoriaPredefinito() {
  const v = Number(lsGet('prom_default') ?? 30);
  return Number.isInteger(v) && v >= 0 ? v : 30;
}
const promemoriaDi = a => (Number.isInteger(a.promemoria) ? a.promemoria : promemoriaPredefinito());
const istante = (data, ora) => isoToDate(data).getTime() + minuti(ora) * 60000;

function prossimiPromemoria(giorni = 7) {
  const ora = Date.now(), limite = ora + giorni * 86400000;
  return appuntamentiCompleti()
    .filter(a => !CHIUSI.includes(a.stato) && promemoriaDi(a) > 0)
    .map(a => ({ ...a, quando: istante(a.data, a.ora) - promemoriaDi(a) * 60000 }))
    .filter(a => istante(a.data, a.ora) > ora && a.quando < limite)
    .sort((x, y) => x.quando - y.quando);
}

const notificheSupportate = () => 'Notification' in window;

async function mostraNotifica(a) {
  const c = a.contatto || {};
  const titolo = `${a.ora} · ${titoloApp(a, c)}`;
  const corpo = [etichettaGiorno(a.data), a.luogo].filter(Boolean).join(' · ');
  if (notificheSupportate() && Notification.permission === 'granted') {
    try {
      const reg = await navigator.serviceWorker?.getRegistration();
      if (reg) { await reg.showNotification(titolo, { body: corpo, tag: a.id, icon: 'icon.svg', data: { id: a.id } }); return; }
      new Notification(titolo, { body: corpo, tag: a.id });
      return;
    } catch (e) { /* si ripiega sul messaggio in pagina */ }
  }
  if (document.visibilityState === 'visible') toast('Promemoria: ' + titolo);
}

function controllaPromemoria() {
  if (!S.user) return;
  const ora = Date.now();
  appuntamentiCompleti().forEach(a => {
    if (CHIUSI.includes(a.stato)) return;
    const prom = promemoriaDi(a);
    if (!prom) return;
    const inizio = istante(a.data, a.ora);
    const chiave = 'notif:' + a.id, firma = `${a.data} ${a.ora} ${prom}`;
    if (ora >= inizio - prom * 60000 && ora < inizio && lsGet(chiave) !== firma) {
      lsSet(chiave, firma);
      mostraNotifica(a);
    }
  });
}

async function attivaNotifiche() {
  if (!notificheSupportate()) { toast('Notifiche non disponibili su questo browser'); return; }
  const esito = await Notification.requestPermission();
  toast(esito === 'granted' ? 'Notifiche attivate' : 'Notifiche bloccate: abilitale dalle impostazioni del browser');
  aggiornaLivello();
  render();
}

function sovrappostiNelGiorno(lista) {
  return lista.some((a, i) => lista.slice(i + 1).some(b => minuti(b.ora) < minuti(a.ora) + (Number(a.durata) || 30)));
}

// Linea del tempo: 64 px per ora, dalle 8 alle 20 (si allarga se serve).
function timeline(items, eOggi) {
  const PX = 64 / 60;
  const attivi = items.length ? items : [];
  let da = 8 * 60, a = 20 * 60;
  attivi.forEach(x => { da = Math.min(da, Math.floor(minuti(x.ora) / 60) * 60); a = Math.max(a, Math.ceil((minuti(x.ora) + (Number(x.durata) || 30)) / 60) * 60); });
  a = Math.min(a, 24 * 60);
  const altezza = (a - da) * PX + 12;
  const ore = [];
  for (let m = da; m <= a; m += 60) ore.push(m);
  const ora = new Date(), mAdesso = ora.getHours() * 60 + ora.getMinutes();
  // Colonne affiancate per gli appuntamenti sovrapposti.
  const colonne = [];
  const pos = items.map(x => {
    const ini = minuti(x.ora), fine = ini + (Number(x.durata) || 30);
    let col = colonne.findIndex(f => f <= ini);
    if (col < 0) { col = colonne.length; colonne.push(fine); } else colonne[col] = fine;
    return { x, ini, fine, col };
  });
  const nCol = Math.max(1, colonne.length);
  return `<div style="position:relative;height:${altezza}px">
    ${ore.map(m => `<div style="position:absolute;left:0;right:0;top:${(m - da) * PX}px;display:flex;align-items:flex-start;gap:8px">
      <span style="width:40px;font-size:11px;color:var(--color-neutral-600);margin-top:-8px;background:var(--color-bg)">${hhmm(m)}</span>
      <span style="flex:1;height:1px;background:var(--color-divider)"></span></div>`).join('')}
    ${eOggi && mAdesso >= da && mAdesso <= a ? `<div style="position:absolute;left:36px;right:0;top:${(mAdesso - da) * PX}px;height:1px;background:var(--color-accent);z-index:2"><span style="position:absolute;left:-3px;top:-3px;width:7px;height:7px;background:var(--color-accent)"></span></div>` : ''}
    ${pos.map(({ x, ini, fine, col }) => {
      const spento = x.stato === 'annullato' || passato(x);
      const w = `(100% - 58px) / ${nCol}`;
      const alto = Math.max((fine - ini) * PX, 44);
      return `<div class="blueprint" data-act="apri" data-id="${esc(x.id)}" role="button" tabindex="0" style="position:absolute;left:calc(52px + ${w} * ${col});width:calc(${w} - 6px);top:${(ini - da) * PX}px;height:${alto}px;background:var(--color-bg);border-color:var(--color-accent-400);padding:6px 10px;cursor:pointer;opacity:${spento ? '.55' : '1'};display:flex;flex-direction:column;gap:2px;overflow:hidden">
        <i class="corner tl"></i><i class="corner br"></i>
        <div style="display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--color-accent-700)"><span>${esc(x.ora)}–${esc(fineApp(x))}</span><span>${esc(ETICHETTE_STATO[x.stato] || '')}</span></div>
        <div style="font-family:var(--font-heading);font-weight:600;font-size:15px;line-height:1.15;text-decoration:${x.stato === 'annullato' ? 'line-through' : 'none'};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(x.motivo || x.contatto.nome || 'Appuntamento')}</div>
        ${alto >= 70 ? `<div style="font-size:11px;color:var(--color-neutral-700);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(x.contatto.nome || '')}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

// ----- Calendario del mese -----
function renderCalendario() {
  const oggi = todayISO();
  if (!S.mese) S.mese = oggi.slice(0, 8) + '01';
  if (!S.calSel) S.calSel = oggi;
  const primo = isoToDate(S.mese);
  const ini = inizioSettimana(primo);
  const ultimo = new Date(primo.getFullYear(), primo.getMonth() + 1, 0);
  const settimane = Math.ceil(((primo.getDay() + 6) % 7 + ultimo.getDate()) / 7);
  const perGiorno = {};
  Object.values(S.appuntamenti).forEach(a => { if (a.stato !== 'annullato') perGiorno[a.data] = (perGiorno[a.data] || 0) + 1; });
  const dow = Array.from({ length: 7 }, (_, i) => addDays(ini, i).toLocaleDateString('it-IT', { weekday: 'short' }).slice(0, 3));
  const celle = Array.from({ length: settimane * 7 }, (_, i) => {
    const d = addDays(ini, i), g = isoOf(d);
    const fuori = d.getMonth() !== primo.getMonth();
    const isSel = g === S.calSel, isOggi = g === oggi;
    const n = perGiorno[g] || 0;
    return `<button data-act="calGiorno" data-d="${g}" aria-label="${esc(fmtData(g))}${n ? ', ' + plurale(n, 'appuntamento', 'appuntamenti') : ''}" aria-pressed="${isSel}" style="height:52px;border:0;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;background:${isSel ? 'var(--color-accent)' : 'transparent'};color:${isSel ? 'var(--color-bg)' : isOggi ? 'var(--color-accent-700)' : 'var(--color-text)'};opacity:${fuori ? '.35' : '1'}">
      <span style="font-family:var(--font-heading);font-weight:600;font-size:16px;line-height:1;text-decoration:${isOggi ? 'underline' : 'none'};text-underline-offset:3px">${d.getDate()}</span>
      <span style="display:flex;gap:2px;align-items:center">${Array.from({ length: Math.min(n, 3) }, () => `<i style="width:5px;height:5px;background:${isSel ? 'var(--color-bg)' : 'var(--color-accent)'}"></i>`).join('')}${n > 3 ? `<span style="font-size:9px;line-height:1">+${n - 3}</span>` : ''}</span>

  $('#main').innerHTML = `<div class="view">
    <div class="head">
      <div><div class="card-kicker">Calendario${primo.getFullYear() === new Date().getFullYear() ? ' · ' + primo.getFullYear() : ''}</div><h1>${esc(titoloMese)}</h1></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary btn-icon" data-act="mese" data-k="-1" aria-label="Mese precedente">${icon('left')}</button>
        <button class="btn btn-secondary btn-icon" data-act="mese" data-k="1" aria-label="Mese successivo">${icon('right')}</button>
      </div>
    </div>
    <div class="blueprint" style="border:0">${CORNERS}
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)">
        ${dow.map(w => `<div style="height:28px;display:grid;place-items:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)">${esc(w)}</div>`).join('')}

        ? `<div style="display:flex;flex-direction:column;gap:16px">${items.map(voceApp).join('')}</div>

// Aggiorna solo i risultati mentre si digita, così il campo non perde il focus.
function risultatiCerca() {
  const box = $('#risultati');
  if (!box) return;
  document.querySelectorAll('[data-act="filtro"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.filtro)));
  const q = norm(S.qCerca);
  const oggi = todayISO();
  let lista = appuntamentiCompleti();
  if (S.filtro === 'da-fare') lista = lista.filter(a => !CHIUSI.includes(a.stato)).sort(byDt);
  else if (S.filtro === 'passati') lista = lista.filter(a => a.data < oggi).sort((x, y) => byDt(y, x));
  else lista.sort(byDt);
  if (q) lista = lista.filter(a => norm(`${a.contatto.nome || ''} ${a.motivo || ''} ${a.luogo || ''} ${a.azienda || ''} ${a.note || ''} ${a.contatto.telefono || ''}`).includes(q));
  const contatti = q ? contattiOrdinati().filter(c => norm(`${c.nome || ''} ${c.telefono || ''} ${c.email || ''} ${c.note || ''}`).includes(q)) : [];
  let html = '';
  if (contatti.length) {
    html += `<div class="sezione"><h2>Contatti · ${contatti.length}</h2><div>${contatti.slice(0, 5).map(rigaContatto).join('')}</div></div>`;
  }
  if (lista.length) {
    let g = null;
    html += lista.slice(0, 150).map(a => {
      const pre = a.data !== g ? `<div class="giorno-label">${esc(etichettaGiorno(a.data))}</div>` : '';
      g = a.data;
      return pre + voceApp(a);
    }).join('');
  }
  if (!html) {
    html = `<div class="blueprint vuoto">${CORNERS}<div class="card-title">Nessun risultato</div><div class="muted">${q ? 'Prova con un’altra parola.' : 'Non ci sono appuntamenti in questa vista.'}</div></div>`;
  }
  box.innerHTML = html;
}

      ['nome', 'telefono', 'email', 'azienda', 'data', 'ora', 'durata', 'luogo', 'motivo', 'note'].forEach(k => {
        if (d[k] !== undefined && d[k] !== '' && d[k] !== null) f[k].value = d[k];

      controlla();

      if (!lsGet('gemini_key')) { toast('Inserisci prima la chiave Gemini nelle Impostazioni'); return; }
      const etichetta = btnSmart.innerHTML;
      btnSmart.disabled = true;
      btnSmart.textContent = 'Analisi…';
      try {
        const d = pulisciDatiIA(await chiediGemini(promptSmart(testo)));
        const contatto = d.nome ? trovaContatto(S.contatti, d.nome) : null;
        riempi({ ...d, contattoId: contatto?.id, telefono: d.telefono || contatto?.telefono || '', email: d.email || contatto?.email || '' });
        m.querySelector('details').open = false;
        toast('Modulo compilato: controlla i dati prima di salvare');
      } catch (err) {
        toast(messaggioIA(err));
      } finally {
        btnSmart.disabled = false;
        btnSmart.innerHTML = etichetta;
      }
    });
    m.querySelector('#micForm').addEventListener('click', e => voiceStart(e.currentTarget, testo => {
      const c = classificaComando(/^(nuovo|fissa|crea|prendi)\b/i.test(testo) ? testo : 'nuovo appuntamento con ' + testo);
      const contatto = c.nome ? trovaContatto(S.contatti, c.nome) : null;
      riempi({ data: c.data, ora: c.ora, motivo: c.motivo, nome: contatto ? contatto.nome : capitalizza(c.nome), contattoId: contatto?.id, telefono: contatto?.telefono, email: contatto?.email });
    }));
    f.addEventListener('submit', async e => {
      e.preventDefault();
      // Con sovrapposizioni il primo tocco chiede conferma sul pulsante stesso.
      if (!f.dataset.forza && sovrapposti(f.data.value, f.ora.value, f.durata.value, aid).length) {
        f.dataset.forza = '1';
        $('#btnSalva', m).textContent = 'Salva comunque';

        return;
      }
      const esito = await salvaAppuntamento(Object.fromEntries(new FormData(f)), aid);
      if (esito === 'ok') { closeModal(); aggiornaLivello(); }
    });
  }, { anim: 'up' });
}

function etichettaVoce(v) {
  const quando = v.quando ? new Date(v.quando).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : '';
  let t;
  switch (v.tipo) {
    case 'creato': t = 'Creato'; break;
    case 'spostato': t = `Spostato da ${fmtCorta(v.da.data)} ${v.da.ora} a ${fmtCorta(v.a.data)} ${v.a.ora}`; break;
    case 'rimandato': t = `Rimandato da ${fmtCorta(v.da.data)} ${v.da.ora} a ${fmtCorta(v.a.data)} ${v.a.ora}${v.motivo ? ' — ' + v.motivo : ''}`; break;
    case 'stato': t = `Stato: ${ETICHETTE_STATO[v.da] || v.da} → ${ETICHETTE_STATO[v.a] || v.a}`; break;
    case 'email': t = `Email inviata: ${v.oggetto}`; break;
    case 'conferma': t = `Conferma ricevuta da ${v.da}`; break;
    default: t = v.tipo;
  }
  return quando ? `${quando} — ${t}` : t;
}

function openContatto(cid) {
  if (!S.contatti[cid]) { toast('Contatto non trovato'); return; }
  const disegna = box => {
    const c = S.contatti[cid];
    if (!c) { closeModal(); return; }
    const apps = appuntamentiCompleti().filter(a => a.contattoId === cid);

// ===================== GMAIL =====================
let tokenClient = null;

// Chiamata da onload dello script Google Identity Services.
function initGoogle() {
  if (!GOOGLE_CLIENT_ID || !window.google?.accounts?.oauth2) { S.gmailDisponibile = false; return; }
  S.gmailDisponibile = true;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GMAIL_SCOPES,
    callback: r => {
      if (r.error) { toast('Accesso Gmail non riuscito'); return; }
      S.gmailToken = r.access_token;
      S.gmailExp = Date.now() + (Number(r.expires_in) - 60) * 1000;
      toast('Gmail collegato');
      render();
      aggiornaLivello();
    }
  });
}

function gmailConnect() {
  if (!tokenClient) { toast('Gmail non configurato: manca GOOGLE_CLIENT_ID'); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}

function gmailOk() {
  return !!S.gmailToken && Date.now() < S.gmailExp;
}

async function gmailFetch(path, opts = {}) {
  if (!gmailOk()) throw new Error('ricollega Gmail');
  const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + S.gmailToken, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error('Gmail ' + r.status);
  return r.json();
}

function gmailPulsante() {
  return GOOGLE_CLIENT_ID
    ? '<button class="btn btn-secondary" data-act="gmail" style="align-self:flex-start">Collega Gmail</button>'
    : '<p class="muted" style="margin:0">Gmail non configurato.</p>';
}

function headersDi(m) {
  return Object.fromEntries((m.payload?.headers || []).map(x => [x.name.toLowerCase(), x.value]));
}

function dataEmail(h) {
  const t = Date.parse(h.date || '');
  return new Date(Number.isNaN(t) ? Date.now() : t).toISOString();
}

const DETTAGLI_EMAIL = 'format=metadata&metadataHeaders=Subject&metadataHeaders=Date&metadataHeaders=From';

// Composizione: invio via Gmail se collegato, altrimenti client di posta (mailto:).
function openEmail(appId = null, contattoId = null) {
  const a = appId ? S.appuntamenti[appId] : null;
  const cid = contattoId || a?.contattoId || '';
  const c = S.contatti[cid] || {};
  if (!c.email) { toast('Il contatto non ha un’email'); return; }
  const fmtD = a ? fmtCorta(a.data) : '';
  const oggetto = a ? `Appuntamento del ${fmtD} ore ${a.ora}` : '';
  const corpo = a
    ? `Buongiorno ${c.nome || ''},\n\nconfermo l'appuntamento del ${fmtD} alle ${a.ora}${a.luogo ? ' presso ' + a.luogo : ''}.\n\nCordiali saluti`
    : `Buongiorno ${c.nome || ''},\n\n\nCordiali saluti`;
  const nota = gmailOk()
    ? ''
    : `<p class="muted" style="margin:0">${GOOGLE_CLIENT_ID ? 'Gmail non collegato: si apre il client di posta.' : 'Gmail non configurato: si apre il client di posta.'}</p>`;

  openModal(`
    <div><div class="card-kicker">${esc(c.nome || '')}</div><h2>Nuova email</h2></div>
    ${nota}
    <form id="fe" style="display:flex;flex-direction:column;gap:12px">
      <label class="field"><span>A</span><input class="input" name="to" type="email" required value="${esc(c.email || '')}"></label>
      <div class="row2" style="align-items:end">
        <label class="field"><span>Tipo di messaggio</span><select class="input" name="tipoIA"><option value="conferma">Conferma appuntamento</option><option value="riepilogo">Riepilogo</option><option value="followup">Follow-up</option></select></label>
        <button type="button" class="btn btn-secondary" id="btnIA" style="min-height:42px">${icon('spark', 16)} Genera con IA</button>
      </div>
      <label class="field"><span>Oggetto</span><input class="input" name="oggetto" required maxlength="200" value="${esc(oggetto)}"></label>
      <label class="field"><span>Messaggio</span><textarea class="input" name="corpo" rows="7">${esc(corpo)}</textarea></label>
      <div class="actions">
        <button type="button" class="btn btn-secondary" data-act="chiudi">Annulla</button>
        <button type="button" class="btn btn-secondary" id="btnMailto">Client di posta</button>
        ${gmailOk()
          ? '<button class="btn btn-primary">Invia con Gmail</button>'
          : (GOOGLE_CLIENT_ID ? '<button type="button" class="btn btn-primary" data-act="gmail">Collega Gmail</button>' : '')}
      </div>
    </form>`, m => {
    const f = m.querySelector('#fe');
    m.querySelector('#btnIA').addEventListener('click', async () => {
      const tipo = f.tipoIA.value;
      const dettagli = a
        ? `Appuntamento il ${fmtData(a.data)} alle ${a.ora}${a.luogo ? ' presso ' + a.luogo : ''}${a.motivo ? ' per ' + a.motivo : ''}${a.azienda ? ' (azienda: ' + a.azienda + ')' : ''}.`
        : "Non c'è un appuntamento specifico: scrivi un messaggio di contatto generico.";
      const scopo = { conferma: 'conferma l’appuntamento', riepilogo: 'riepiloga i dettagli dell’appuntamento', followup: 'ringrazia per l’incontro e proponi un eventuale seguito' }[tipo] || 'scrivi un messaggio cortese';
      const prompt = `Scrivi in italiano un'email professionale e cortese per uno showroom di arredo o uno studio professionale. Destinatario: ${c.nome || 'il cliente'}. Obiettivo: ${scopo}. ${dettagli} Tono sobrio e sintetico. Non inventare date, orari o impegni non indicati. Rispondi SOLO con un oggetto JSON con le chiavi "oggetto" (una riga) e "corpo" (testo completo con saluto iniziale e chiusura "Cordiali saluti", senza firma con nome).`;
      const btnIA = m.querySelector('#btnIA');
      const etichetta = btnIA.innerHTML;
      btnIA.disabled = true;
      btnIA.textContent = 'Generazione…';
      try {
        const d = await chiediGemini(prompt);
        if (d.oggetto) f.oggetto.value = String(d.oggetto).trim();
        if (d.corpo) f.corpo.value = String(d.corpo);
        toast('Bozza generata: controllala prima di inviare');
      } catch (err) {
        toast(messaggioIA(err));
      } finally {
        btnIA.disabled = false;
        btnIA.innerHTML = etichetta;
      }
    });
    f.addEventListener('submit', e => { e.preventDefault(); inviaEmail(f, appId, cid); });
    m.querySelector('#btnMailto').addEventListener('click', () => {
      const to = f.to.value.trim(), subj = f.oggetto.value.trim(), body = f.corpo.value;
      if (!isEmail(to)) { toast('Indirizzo email non valido'); return; }
      window.location.href = 'mailto:' + encodeURIComponent(to) +
        '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
    });
  });
}

async function inviaEmail(f, appId, cid) {
  const to = f.to.value.trim();
  const oggetto = f.oggetto.value.trim();
  const corpo = f.corpo.value;
  if (!isEmail(to)) { toast('Indirizzo email non valido'); return; }
  if (!oggetto) { toast('Inserisci l’oggetto'); return; }
  if (!gmailOk()) { toast('Collega Gmail prima di inviare'); return; }
  try {
    await gmailFetch('messages/send', { method: 'POST', body: JSON.stringify({ raw: buildRaw({ to, oggetto, corpo }) }) });
  } catch (err) {
    toast('Invio non riuscito: ' + err.message);
    return;
  }
  if (appId && S.appuntamenti[appId]) {
    const storico = storicoOf(S.appuntamenti[appId]);
    storico.push({ tipo: 'email', oggetto, quando: new Date().toISOString() });
    await esegui(userRef('appuntamenti/' + appId).update({ storico, aggiornato: Date.now() }));
  }
  closeModal();
  aggiornaLivello();
  toast('Email inviata');
}

function schedaEmail(m, extra = '') {
  const h = headersDi(m);
  return `<div class="blueprint email-card">${CORNERS}
    <div class="card-title">${esc(h.subject || '(senza oggetto)')}</div>
    <div class="card-meta" style="flex-wrap:wrap">${esc(h.from || '')} · ${esc(h.date || '')}</div>
    ${m.snippet ? `<div class="muted">${esc(m.snippet)}</div>` : ''}${extra}</div>`;
}

async function caricaPosta(cid) {
  const box = $('#posta', livelli[livelli.length - 1]?.el || document);
  const c = S.contatti[cid] || {};
  if (!c.email) { toast('Il contatto non ha un’email'); return; }
  if (!box) return;
  if (!gmailOk()) { box.innerHTML = gmailPulsante(); return; }
  box.innerHTML = '<p class="muted" style="margin:0">Caricamento…</p>';
  try {
    const q = encodeURIComponent(`from:${c.email} OR to:${c.email}`);
    const lista = await gmailFetch('messages?maxResults=10&q=' + q);
    const ids = (lista.messages || []).map(m => m.id);
    if (!ids.length) { box.innerHTML = '<p class="muted" style="margin:0">Nessuna email trovata.</p>'; return; }
    const dettagli = await Promise.all(ids.map(id => gmailFetch(`messages/${id}?${DETTAGLI_EMAIL}`)));
    box.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${dettagli.map(m => schedaEmail(m)).join('')}</div>`;
  } catch (err) {
    box.innerHTML = `<p class="err">Impossibile caricare le email: ${esc(err.message)}</p>`;
  }
}

// Indirizzi autorizzati a confermare; predefinito: showroom Mirisa.
function indirizziConferma() {
  const v = S.impostazioni?.indirizziConferma;
  const lista = Array.isArray(v) ? v : (v ? Object.values(v) : []);
  return lista.length ? lista : ['mirisa.ceramiche@gmail.com'];
}

// Cerca nella posta degli indirizzi autorizzati, dopo la creazione, le email riferite al contatto o all'azienda.
// Non cambia lo stato: mostra le conferme e l'utente sceglie.
async function caricaConferme(aid) {
  const box = $('#conferme', livelli[livelli.length - 1]?.el || document);
  const a = S.appuntamenti[aid];
  if (!box || !a) return;
  if (a.confermaEmail) {
    box.innerHTML = `<p class="muted" style="margin:0">Confermato da ${esc(a.confermaEmail.da || '')}${a.confermaEmail.quando ? ' il ' + esc(new Date(a.confermaEmail.quando).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' })) : ''}.</p>`;
    return;
  }
  if (!gmailOk()) { box.innerHTML = gmailPulsante(); return; }
  const c = S.contatti[a.contattoId] || {};
  const chiavi = [c.nome, c.email, a.azienda].filter(Boolean).map(norm).filter(Boolean);
  const dopo = Math.floor((a.creato || 0) / 1000);
  box.innerHTML = '<p class="muted" style="margin:0">Ricerca conferme…</p>';
  try {
    const trovati = [];
    for (const mitt of indirizziConferma()) {
      const lista = await gmailFetch('messages?maxResults=20&q=' + encodeURIComponent(`from:${mitt} after:${dopo}`));
      for (const m of (lista.messages || [])) {
        trovati.push(await gmailFetch(`messages/${m.id}?${DETTAGLI_EMAIL}`));
      }
    }
    const compatibili = trovati.filter(d => {
      const h = headersDi(d);
      const testo = norm(`${h.subject || ''} ${d.snippet || ''} ${h.from || ''}`);
      return chiavi.some(k => testo.includes(k));
    });
    box.innerHTML = compatibili.length
      ? `<div style="display:flex;flex-direction:column;gap:14px">${compatibili.map(d => {
          const h = headersDi(d);
          return schedaEmail(d, CHIUSI.includes(a.stato) ? '' : `<button class="btn btn-primary" data-act="segnaConfermato" data-id="${esc(aid)}"
              data-msg="${esc(d.id)}" data-da="${esc(h.from || '')}" data-quando="${esc(dataEmail(h))}" style="align-self:flex-start;margin-top:6px">Segna confermato</button>`);
        }).join('')}</div>`
      : '<p class="muted" style="margin:0">Nessuna conferma riconosciuta dagli indirizzi autorizzati.</p>';
  } catch (err) {
    box.innerHTML = `<p class="err">Impossibile cercare le conferme: ${esc(err.message)}</p>`;
  }
}

// Stato 'confermato' solo su scelta esplicita dell'utente; salva la conferma.
async function segnaConfermato(aid, conf) {
  const a = S.appuntamenti[aid];
  if (!a) return 'errore';
  if (CHIUSI.includes(a.stato)) { toast('Appuntamento già chiuso'); return 'errore'; }
  const nowIso = new Date().toISOString();
  const storico = storicoOf(a);
  if (a.stato !== 'confermato') storico.push({ tipo: 'stato', da: a.stato, a: 'confermato', quando: nowIso });
  storico.push({ tipo: 'conferma', da: conf.da, quando: conf.quando });
  return esegui(userRef('appuntamenti/' + aid).update({
    stato: 'confermato',
    confermaEmail: { messaggioId: conf.messaggioId, da: conf.da, quando: conf.quando },
    storico, aggiornato: Date.now()
  }), 'Appuntamento confermato');
}

document.addEventListener('click', e => {

// ===================== VOCE =====================
// Prossimo appuntamento aperto del contatto (futuro più vicino, altrimenti il più recente).
function appuntamentoProssimo(cid) {
  const oggi = todayISO();
  const lista = Object.entries(S.appuntamenti)
    .filter(([, a]) => a.contattoId === cid && !CHIUSI.includes(a.stato))
    .sort(([, x], [, y]) => byDt(x, y));
  const futuro = lista.find(([, a]) => a.data >= oggi);
  return (futuro || lista[0] || [null])[0];
}

// Esegue il comando riconosciuto. Il modulo si apre precompilato: il salvataggio resta una conferma dell'utente.
function voiceExec(raw) {
  const c = classificaComando(raw);
  switch (c.tipo) {
    case 'nuovo': {
      const contatto = trovaContatto(S.contatti, c.nome);
      const pre = { data: c.data || undefined, ora: c.ora || undefined, motivo: c.motivo };
      if (contatto) openAppForm({ ...pre, contattoId: contatto.id });
      else openAppForm({ ...pre, nome: capitalizza(c.nome) });
      break;
    }
    case 'sposta': {
      const contatto = trovaContatto(S.contatti, c.nome);
      if (!contatto) { toast(`Nessun contatto trovato per "${c.nome}"`); break; }
      const aid = appuntamentoProssimo(contatto.id);
      if (!aid) { toast(`Nessun appuntamento aperto per ${contatto.nome}`); break; }
      openRimanda(aid, { data: c.data || undefined, ora: c.ora || undefined, motivo: '' });
      break;
    }
    case 'chiama': {
      const contatto = trovaContatto(S.contatti, c.nome);
      if (!contatto) { toast(`Nessun contatto trovato per "${c.nome}"`); break; }
      if (!contatto.telefono) { toast(`${contatto.nome} non ha un numero di telefono`); break; }
      window.location.href = 'tel:' + contatto.telefono;
      break;
    }
    case 'cerca': {
      while (livelli.length) closeModal();
      S.qCerca = c.nome;
      vaiA('cerca');
      break;
    }
    case 'agenda': {
      while (livelli.length) closeModal();
      S.giorno = todayISO();
      vaiA('agenda');
      break;
    }
    default:
      toast("Comando non riconosciuto. Prova: 'nuovo appuntamento con Mario Rossi domani alle 10'");
  }
}

// Avvia il riconoscimento vocale; il pulsante pulsa mentre ascolta.
// Senza callback il testo diventa un comando; con callback lo riceve il chiamante (es. il modulo).
function voiceStart(btn = $('#mic'), suTesto = null) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Riconoscimento vocale non disponibile su questo browser'); return; }
  const rec = new SR();
  rec.lang = 'it-IT';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    toast('Ho capito: ' + t);
    if (suTesto) suTesto(t); else voiceExec(t);
  };
  rec.onerror = e => toast('Errore vocale: ' + e.error);
  rec.onend = () => btn?.classList.remove('ascolto');
  btn?.classList.add('ascolto');
  rec.start();
}

// ===================== AVVIO, NOTIFICHE, INSTALLAZIONE =====================
// Dopo il primo caricamento dei dati: promemoria e apertura da notifica (?app=ID).
function datiPronti() {
  controllaPromemoria();
  const id = new URLSearchParams(location.search).get('app');
  if (id && S.appuntamenti[id]) {
    history.replaceState(null, '', location.pathname);
    armaIndietro();
    openDettaglio(id);
  }
}

setInterval(() => {
  controllaPromemoria();
  // la linea "ora" dell'agenda avanza col tempo
  if (S.user && S.vista === 'agenda' && S.giorno === todayISO() && !livelli.length) render();
}, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { controllaPromemoria(); if (S.user && ['agenda', 'calendario'].includes(S.vista)) render(); } });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* l'app funziona anche senza */ });
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.apri && S.appuntamenti[e.data.apri]) openDettaglio(e.data.apri);
  });
}

// ===================== AUTENTICAZIONE =====================
const configMancante = FIREBASE_CONFIG.apiKey === 'INSERIRE';
let auth = null, db = null;

if (configMancante) {
  $('#configBanner').hidden = false;
  $('#login').hidden = false;
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.database();

  auth.onAuthStateChanged(u => {
    S.user = u;
    if (u) {
      $('#login').hidden = true;
      $('#app').hidden = false;
      armaIndietro();
      attachListeners();
      render();
    } else {
      detachListeners();
      while (livelli.length) closeModal();
      $('#main').innerHTML = '';
      S.contatti = {}; S.appuntamenti = {}; S.impostazioni = {};
      $('#app').hidden = true;
      $('#login').hidden = false;
    }
  });

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector('button');
    $('#loginErr').textContent = '';
    btn.disabled = true;
    btn.textContent = 'Accesso in corso…';
    try {
      await auth.signInWithEmailAndPassword(f.email.value.trim(), f.password.value);
    } catch (err) {
      $('#loginErr').textContent = 'Accesso non riuscito. Controlla email e password.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Accedi';
    }
  });
}
</script>
