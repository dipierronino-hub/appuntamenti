<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<title>Appuntamenti</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ===== Tema "Neon": scuro profondo, accenti blu elettrico → ciano, superfici in vetro ===== */
:root{
  --color-bg:#06070d;--color-bg-2:#0b0d19;
  --color-text:#eef0ff;--color-muted:#a0a6c6;--color-faint:#6d7398;
  --color-divider:rgba(255,255,255,.08);
  --bg-glow:radial-gradient(70% 45% at 0% 0%,rgba(37,99,235,.26),transparent 70%),radial-gradient(60% 40% at 100% 8%,rgba(34,211,238,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(14,165,233,.12),transparent 70%);
  --glass:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.022));
  --glass-solid:rgba(14,16,30,.78);
  --glass-border:rgba(255,255,255,.09);
  --glass-hi:rgba(255,255,255,.16);
  --input-bg:rgba(255,255,255,.05);
  --accent:#3b82f6;--accent-2:#22d3ee;--accent-text:#93c5fd;
  --grad:linear-gradient(135deg,#3b82f6 0%,#0ea5e9 50%,#22d3ee 100%);
  --grad-soft:linear-gradient(135deg,rgba(59,130,246,.24),rgba(34,211,238,.14));
  --grad-text:linear-gradient(90deg,#93c5fd,#67e8f9);
  --on-grad:#ffffff;
  --glow:0 8px 28px rgba(37,99,235,.45),0 2px 12px rgba(34,211,238,.22);
  --glow-sm:0 4px 16px rgba(37,99,235,.35);
  --shadow-card:0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --st-prog:#7db4ff;--st-prog-bg:rgba(59,130,246,.18);
  --st-conf:#5ee6f7;--st-conf-bg:rgba(34,211,238,.14);
  --st-comp:#4ade9b;--st-comp-bg:rgba(16,185,129,.16);
  --st-ann:#9aa3b8;--st-ann-bg:rgba(148,163,184,.13);
  --st-late:#ff8a80;--st-late-bg:rgba(255,107,107,.16);
  --st-warn:#fcd34d;--st-warn-bg:rgba(251,191,36,.14);
  --wa:#25d366;
  --pay-due:#ff7a7a;--pay-due-bg:rgba(255,92,92,.16);
  --pay-dep:#ffa94d;--pay-dep-bg:rgba(255,146,43,.16);
  --pay-ok:#4ade9b;--pay-ok-bg:rgba(16,185,129,.16);
  --in:#4ade9b;--in-bg:rgba(16,185,129,.16);
  --out:#ff8a73;--out-bg:rgba(255,122,99,.16);
  --t-cli:#60a5fa;--t-for:#fb923c;--t-tec:#facc15;--t-rap:#f472b6;--t-on:#0b1020;
  --tap:48px;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.5,1);
  --col:560px;--tabs-h:66px;
  /* alias usati negli stili in linea */
  --color-accent:var(--accent);--color-accent-700:var(--accent-text);
  --color-neutral-600:var(--color-faint);--color-neutral-700:var(--color-muted);
  --color-warn:var(--st-warn);--color-bad:var(--st-late);
  color-scheme:dark
}
:root[data-theme="light"]{
  --color-bg:#f3f4fb;--color-bg-2:#ffffff;
  --color-text:#15162c;--color-muted:#585d7e;--color-faint:#8b90ad;
  --color-divider:rgba(21,22,44,.08);
  --bg-glow:radial-gradient(70% 45% at 0% 0%,rgba(59,130,246,.14),transparent 70%),radial-gradient(60% 40% at 100% 8%,rgba(34,211,238,.12),transparent 70%);
  --glass:linear-gradient(150deg,rgba(255,255,255,.96),rgba(255,255,255,.78));
  --glass-solid:rgba(255,255,255,.82);
  --glass-border:rgba(21,22,44,.07);
  --glass-hi:rgba(21,22,44,.14);
  --input-bg:rgba(21,22,44,.045);
  --accent:#2563eb;--accent-2:#0891b2;--accent-text:#1d4ed8;
  --grad-soft:linear-gradient(135deg,rgba(37,99,235,.12),rgba(8,145,178,.08));
  --grad-text:linear-gradient(90deg,#2563eb,#0891b2);
  --glow:0 8px 24px rgba(37,99,235,.32),0 2px 10px rgba(8,145,178,.18);
  --glow-sm:0 4px 14px rgba(37,99,235,.28);
  --shadow-card:0 6px 22px rgba(30,27,75,.08);
  --shadow-lg:0 24px 60px rgba(30,27,75,.2);
  --st-prog:#1d4ed8;--st-prog-bg:rgba(37,99,235,.1);
  --st-conf:#0e7490;--st-conf-bg:rgba(8,145,178,.11);
  --st-comp:#047857;--st-comp-bg:rgba(16,185,129,.13);
  --st-ann:#64748b;--st-ann-bg:rgba(100,116,139,.12);
  --st-late:#dc2626;--st-late-bg:rgba(239,68,68,.1);
  --st-warn:#b45309;--st-warn-bg:rgba(245,158,11,.14);
  --wa:#15a34a;
  --pay-due:#dc2626;--pay-due-bg:rgba(239,68,68,.1);
  --pay-dep:#c2410c;--pay-dep-bg:rgba(249,115,22,.13);
  --pay-ok:#047857;--pay-ok-bg:rgba(16,185,129,.13);
  --in:#047857;--in-bg:rgba(16,185,129,.13);
  --out:#c2410c;--out-bg:rgba(234,88,12,.12);
  --t-cli:#1d4ed8;--t-for:#c2410c;--t-tec:#a16207;--t-rap:#be185d;--t-on:#fff;
  color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--color-bg)}
body{margin:0;min-height:100vh;background:var(--bg-glow),var(--color-bg);background-attachment:fixed;color:var(--color-text);font-family:var(--font);font-size:15px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--font);font-weight:800;line-height:1.1;letter-spacing:-.03em;margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent-text);text-underline-offset:3px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:var(--r-sm)}
::selection{background:rgba(59,130,246,.35)}
.noscroll::-webkit-scrollbar{display:none}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.55)}50%{box-shadow:0 0 0 12px rgba(255,107,107,0)}}
@keyframes nowPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}50%{box-shadow:0 0 0 6px rgba(34,211,238,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Superfici in vetro ===== */
.blueprint,.glass{position:relative;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.corner{display:none}
.grad-text{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== Pulsanti ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none;font-weight:600;font-size:14px;line-height:1.2;color:var(--color-text);background:var(--input-bg);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:8px 14px;min-height:var(--tap);touch-action:manipulation;transition:transform .2s var(--ease),background .3s ease,box-shadow .3s ease,border-color .3s ease,color .3s ease}
.btn svg{display:block;flex:none}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--grad);border-color:transparent;color:var(--on-grad);box-shadow:var(--glow-sm)}
.btn-primary:hover{box-shadow:var(--glow);color:var(--on-grad)}
.btn-secondary:hover{background:var(--glass-hi);border-color:var(--glass-hi)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent-text);padding-inline:8px}
.btn-ghost:hover{background:var(--grad-soft)}
.btn-danger{color:var(--st-late)}
.btn-danger:hover{background:var(--st-late-bg);border-color:transparent;color:var(--st-late)}
.btn-icon{width:var(--tap);height:var(--tap);padding:0;border-radius:50%}
.btn-block{width:100%}
.chip-oggi{position:relative;padding:4px 12px!important;min-height:0!important;font-size:12px!important;border-radius:999px!important}

/* ===== Tipografia di supporto ===== */
.card-kicker{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}
.head .card-kicker,.kicker-grad{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.card-title{font-weight:700;font-size:16px;line-height:1.25;letter-spacing:-.015em}
.card-meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--color-muted)}
.muted{color:var(--color-muted);font-size:13px}
.err{color:var(--st-late);font-size:13px;min-height:1.2em;margin:0}

/* ===== Badge di stato ===== */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none;border:1px solid transparent}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.tag-prog{background:var(--st-prog-bg);color:var(--st-prog);border-color:color-mix(in srgb,var(--st-prog) 25%,transparent)}
.tag-conf{background:var(--st-conf-bg);color:var(--st-conf);border-color:color-mix(in srgb,var(--st-conf) 25%,transparent)}
.tag-comp{background:var(--st-comp-bg);color:var(--st-comp);border-color:color-mix(in srgb,var(--st-comp) 25%,transparent)}
.tag-ann{background:var(--st-ann-bg);color:var(--st-ann)}
.tag-ann::before{box-shadow:none}
.tag-warn{background:var(--st-warn-bg);color:var(--st-warn)}
.tag-bad{background:var(--st-late-bg);color:var(--st-late);border-color:color-mix(in srgb,var(--st-late) 30%,transparent)}
.tag-bad::before{animation:nowPulse 1.6s infinite}
.tag-accent{background:var(--st-comp-bg);color:var(--st-comp)}
.tag-neutral{background:var(--st-ann-bg);color:var(--st-ann)}

/* ===== Campi ===== */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--color-muted)}
.input{width:100%;min-height:var(--tap);padding:10px 14px;font-size:16px;color:var(--color-text);caret-color:var(--accent-2);background:var(--input-bg);border:1px solid var(--glass-border);border-radius:var(--r-md);-webkit-appearance:none;appearance:none;transition:border-color .3s ease,box-shadow .3s ease,background .3s ease}
.input::placeholder{color:var(--color-faint)}
.input:hover{border-color:var(--glass-hi)}
.input:focus,.input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.2);outline:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select.input option{background:var(--color-bg-2);color:var(--color-text)}
textarea.input{min-height:96px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:10px}
.seg{display:flex;gap:4px;padding:4px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:999px}
.seg>button{flex:1;min-height:44px;touch-action:manipulation;border:0;border-radius:999px;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--color-muted);padding:6px 10px;transition:all .3s var(--ease)}
.seg>button[aria-pressed="true"]{background:var(--grad);color:var(--on-grad);box-shadow:var(--glow-sm)}
.seg>button:not([aria-pressed="true"]):hover{color:var(--color-text);background:var(--glass-hi)}
.seg>button:active{transform:scale(.96)}

/* ===== Struttura ===== */
#app{max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh}
#main.entra>.view{animation:viewIn .38s var(--ease)}
.entra-giorno{animation:viewIn .32s var(--ease)}
.view{padding:calc(18px + env(safe-area-inset-top)) 18px calc(var(--tabs-h) + 130px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.head h1{margin:4px 0 0;font-size:36px;text-transform:capitalize}

/* Barra di navigazione fluttuante con indicatore che scorre */
.tabs{position:fixed;z-index:10;left:12px;right:12px;margin-inline:auto;max-width:calc(var(--col) - 24px);bottom:calc(10px + env(safe-area-inset-bottom));height:var(--tabs-h);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;background:var(--glass-solid);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-border);border-radius:24px;box-shadow:var(--shadow-lg)}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:18px;background:var(--grad-soft);border:1px solid rgba(59,130,246,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 22px rgba(59,130,246,.28);transform:translateX(calc(var(--i, 0) * 100%));transition:transform .45s var(--spring);pointer-events:none}
.tab-ind::after{content:"";position:absolute;left:30%;right:30%;bottom:3px;height:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 10px var(--accent-2)}
.tab{position:relative;z-index:1;border:0;touch-action:manipulation;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.01em;color:var(--color-faint);border-radius:18px;transition:color .3s ease,transform .2s var(--ease)}
.tab svg{transition:transform .35s var(--spring),filter .3s ease}
.tab:active{transform:scale(.92)}
.tab:hover{color:var(--color-text)}
.tab[aria-current="page"]{color:var(--color-text)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.1);color:var(--accent-text);filter:drop-shadow(0 0 6px rgba(96,165,250,.8))}

.fabs{position:fixed;z-index:9;bottom:calc(var(--tabs-h) + 26px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - var(--col)) / 2 + 20px));display:flex;gap:12px;align-items:center}
.fab{display:grid;place-items:center;cursor:pointer;border-radius:50%;transition:transform .25s var(--spring),box-shadow .3s ease,background .3s ease}
.fab:active{transform:scale(.9)}
.fab.mic{width:56px;height:56px;color:var(--color-text);background:var(--glass-solid);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-border);box-shadow:var(--shadow-card)}
.fab.add{width:64px;height:64px;border:0;background:var(--grad);color:#fff;box-shadow:var(--glow)}
.fab.add:hover{transform:translateY(-2px) rotate(90deg);box-shadow:0 12px 36px rgba(37,99,235,.6),0 2px 14px rgba(34,211,238,.35)}
.ascolto{background:linear-gradient(135deg,#ff6b6b,#f43f5e)!important;border-color:transparent!important;color:#fff!important;animation:pulse 1.2s infinite}

/* Schermate sovrapposte e fogli dal basso */
.layer{position:fixed;inset:0;z-index:20}
.page{position:absolute;inset:0;margin-inline:auto;max-width:var(--col);background:var(--bg-glow),var(--color-bg);overflow-y:auto;overscroll-behavior:contain;animation:slideIn .34s var(--ease)}
.page.up{animation:sheetUp .36s var(--ease)}
.layer.chiude .page{animation:slideOut .26s ease-in forwards}
.layer.chiude .page.up{animation:sheetDown .26s ease-in forwards}
.layer.chiude .sheet{animation:sheetDown .24s ease-in forwards}
.layer.chiude .backdrop{animation:fadeOut .24s ease-in forwards}
.page-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--glass-solid);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--glass-border)}
.page-bar .card-kicker{color:var(--color-muted)}
.page-body{padding:20px 18px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.page-body>*{animation:popIn .45s var(--ease) both}
.page-body>*:nth-child(2){animation-delay:.03s}.page-body>*:nth-child(3){animation-delay:.06s}.page-body>*:nth-child(4){animation-delay:.09s}.page-body>*:nth-child(n+5){animation-delay:.12s}
.page-foot{position:sticky;bottom:0;z-index:3;display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--glass-solid);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border)}
.page-foot .btn{flex:1;min-height:50px;font-size:16px;border-radius:var(--r-md)}
.backdrop{position:absolute;inset:0;background:rgba(3,4,10,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadeIn .25s ease}
.sheet{position:absolute;bottom:0;left:0;right:0;margin-inline:auto;max-width:var(--col);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--color-bg-2);background-image:var(--bg-glow);border:1px solid var(--glass-border);border-bottom:0;border-radius:28px 28px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:sheetUp .32s var(--ease);box-shadow:var(--shadow-lg)}
.sheet::before{content:"";align-self:center;width:42px;height:5px;border-radius:5px;background:var(--glass-hi);margin-bottom:4px}
.sheet h2{font-size:24px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* Sezioni, righe, griglie */
.sezione{display:flex;flex-direction:column;gap:10px}
.sezione>h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--color-faint);display:flex;justify-content:space-between;align-items:center;gap:8px}
#lista{display:flex;flex-direction:column;gap:8px}
#lista>.riga,.riga.glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
#lista>.giorno-label{padding:10px 4px 0}
.lista-righe{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
.griglia{display:grid;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
.griglia>*{padding:12px 14px;min-width:0;border-left:1px solid var(--color-divider)}
.griglia>*:first-child{border-left:0}
.griglia.verticale>*{border-left:0;border-top:1px solid var(--color-divider)}
.griglia.verticale>*:first-child{border-top:0}
.cella-k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--color-faint)}
.cella-v{font-weight:800;font-size:20px;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
/* Data, ora e fine nel dettaglio: gli orari non vanno mai a capo */
.griglia-orari{grid-template-columns:minmax(0,1fr) auto auto}
.griglia-orari>*:not(:first-child) .cella-v{white-space:nowrap;overflow-wrap:normal;font-variant-numeric:tabular-nums}
/* Campi data e ora: valore intero e leggibile anche con caratteri grandi */
.input[type="date"],.input[type="time"]{min-width:0;font-variant-numeric:tabular-nums;padding-right:10px}
.riga{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--color-divider);min-width:0;transition:background .25s ease}
.riga:first-child{border-top:0}
.riga .testo{flex:1;min-width:0}
.riga .testo>div:first-child{overflow-wrap:anywhere}
.riga.cliccabile{cursor:pointer}
.riga.cliccabile:hover{background:var(--glass-hi)}
.riga.cliccabile:active{background:var(--grad-soft)}
.riga>svg:last-child{color:var(--color-faint);flex:none}
.ico{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--grad-soft);color:var(--accent-text);border:1px solid rgba(59,130,246,.22)}
.avatar{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:var(--glow-sm)}
.avatar[data-t="1"]{background:linear-gradient(135deg,#06b6d4,#2563eb)}
.avatar[data-t="2"]{background:linear-gradient(135deg,#10b981,#22d3ee)}
.avatar[data-t="3"]{background:linear-gradient(135deg,#f59e0b,#f43f5e)}
.avatar[data-t="4"]{background:linear-gradient(135deg,#0ea5e9,#22d3ee)}
.azioni-contatto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.azioni-contatto>*{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;font-size:12.5px;font-weight:600;color:var(--color-text);text-decoration:none;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-md);cursor:pointer;transition:transform .2s var(--ease),background .3s ease,box-shadow .3s ease}
.azioni-contatto>*:active{transform:scale(.95)}
.azioni-contatto>* svg{width:22px;height:22px}
.azioni-contatto .az-tel svg{color:var(--st-comp);filter:drop-shadow(0 0 6px rgba(52,211,153,.5))}
.azioni-contatto .az-wa svg{color:var(--wa);filter:drop-shadow(0 0 6px rgba(37,211,102,.5))}
.azioni-contatto .az-mail svg{color:var(--accent-text);filter:drop-shadow(0 0 6px rgba(96,165,250,.5))}
.azioni-contatto>*:hover{background:var(--glass-hi);color:var(--color-text)}
.azioni-contatto>[aria-disabled="true"]{opacity:.35;pointer-events:none}
.azioni-contatto>[aria-disabled="true"] svg{filter:none}
.avviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--st-warn-bg);color:var(--st-warn);font-size:13px;border:1px solid color-mix(in srgb,var(--st-warn) 30%,transparent);border-radius:var(--r-md)}
.avviso svg{flex:none;margin-top:1px}
.vuoto{padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.vuoto>.ico{width:56px;height:56px;border-radius:18px}
.storico{list-style:none;margin:0;padding:4px 0 4px 4px;font-size:13px;color:var(--color-muted)}
.storico li{padding:8px 0 8px 18px;border-left:2px solid var(--color-divider);position:relative}
.storico li::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 8px rgba(59,130,246,.6)}
.email-card{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.email-card .card-title{font-size:15px}

/* ===== Agenda ===== */
.toggle{display:flex;gap:3px;padding:3px;background:var(--input-bg);border:1px solid var(--glass-border);border-radius:14px;flex:none}
.toggle>button{width:44px;height:42px;display:grid;place-items:center;border:0;border-radius:11px;cursor:pointer;background:transparent;color:var(--color-muted);transition:all .3s var(--ease)}
.toggle>button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:var(--glow-sm)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week-day{height:70px;border:1px solid var(--glass-border);border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--glass);color:var(--color-text);transition:transform .25s var(--spring),background .3s ease,box-shadow .3s ease,color .3s ease}
.week-day:active{transform:scale(.92)}
.week-day .wd{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-faint)}
.week-day .wn{font-weight:800;font-size:20px;line-height:1;letter-spacing:-.02em}
.week-day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.week-day.has .dot{background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
.week-day.oggi{border-color:rgba(59,130,246,.55)}
.week-day.oggi .wn{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.week-day.sel{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow);transform:translateY(-2px)}
.week-day.sel .wd{color:rgba(255,255,255,.8)}
.week-day.sel .wn{color:#fff;-webkit-text-fill-color:#fff;background:none}
.week-day.sel.has .dot{background:#fff;box-shadow:0 0 8px #fff}
.summary{font-size:13px;color:var(--color-muted)}

.giorno-label{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);padding-top:6px}
.app-item{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;cursor:pointer;transition:transform .2s var(--ease)}
.app-item:active{transform:scale(.98)}
.app-item .ora1{font-weight:800;font-size:19px;line-height:1;letter-spacing:-.02em;color:var(--color-text);font-variant-numeric:tabular-nums}
.app-item .ora2{font-size:13.5px;line-height:1;color:var(--color-muted);margin-top:7px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
/* Appuntamenti passati: si attenua solo la scheda, gli orari restano leggibili */
.app-item.spento .box{opacity:.6}
.app-item.spento .ora1{color:var(--color-muted)}
.app-item .box{padding:13px 15px 13px 18px;display:flex;flex-direction:column;gap:5px;overflow:hidden;transition:background .3s ease,box-shadow .3s ease,border-color .3s ease}
.app-item .box::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--st-c,var(--accent));box-shadow:0 0 12px var(--st-c,var(--accent))}
.app-item:hover .box{border-color:var(--glass-hi);box-shadow:var(--shadow-card),0 0 0 1px rgba(59,130,246,.15)}
[data-stato="programmato"]{--st-c:var(--st-prog)}
[data-stato="confermato"]{--st-c:var(--st-conf)}
[data-stato="completato"]{--st-c:var(--st-comp)}
[data-stato="annullato"]{--st-c:var(--st-ann)}
[data-stato][data-ritardo]{--st-c:var(--st-late)}
.ora-adesso{display:flex;align-items:center;gap:10px;color:var(--accent-2);font-size:12px}
.ora-adesso span:first-child{font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3)}
.ora-adesso span:last-child{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent-2),transparent);box-shadow:0 0 10px rgba(34,211,238,.5)}

/* Linea del tempo */
.tl{position:relative}
.tl-ora{position:absolute;left:0;right:0;display:flex;align-items:flex-start;gap:8px}
.tl-ora span:first-child{width:42px;font-size:11px;font-weight:600;color:var(--color-faint);margin-top:-8px}
.tl-ora span:last-child{flex:1;height:1px;background:var(--color-divider)}
.tl-now{position:absolute;left:40px;right:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent-2),rgba(34,211,238,.15));z-index:2;box-shadow:0 0 10px rgba(34,211,238,.6)}
.tl-now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent-2);animation:nowPulse 1.8s infinite}
.tl-block{position:absolute;padding:7px 10px 7px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--st-c,var(--accent)) 20%,transparent),color-mix(in srgb,var(--st-c,var(--accent)) 6%,transparent));border:1px solid color-mix(in srgb,var(--st-c,var(--accent)) 35%,transparent);transition:transform .2s var(--ease),box-shadow .3s ease}
.tl-block::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st-c,var(--accent));box-shadow:0 0 10px var(--st-c,var(--accent))}
.tl-block:hover{box-shadow:0 0 18px color-mix(in srgb,var(--st-c,var(--accent)) 35%,transparent)}
.tl-block:active{transform:scale(.98)}
.tl-block .tl-t{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:600;color:var(--st-c,var(--accent-text))}
.tl-block .tl-ti{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl-block .tl-c{font-size:11px;color:var(--color-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* Calendario */
.cal{padding:10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{height:26px;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-faint)}
.cal-cell{height:50px;border:1px solid transparent;border-radius:14px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:transparent;color:var(--color-text);transition:transform .25s var(--spring),background .3s ease,box-shadow .3s ease}
.cal-cell:hover{background:var(--glass-hi)}
.cal-cell:active{transform:scale(.9)}
.cal-cell .n{font-weight:700;font-size:15px;line-height:1}
.cal-cell .dots{display:flex;gap:3px;align-items:center;min-height:6px}
.cal-cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 6px var(--accent-2)}
.cal-cell .dots span{font-size:9px;font-weight:700;line-height:1;color:var(--color-muted)}
.cal-cell.fuori{opacity:.3}
.cal-cell.oggi{border-color:rgba(59,130,246,.55)}
.cal-cell.oggi .n{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.cal-cell.sel{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.cal-cell.sel .n{color:#fff;-webkit-text-fill-color:#fff;background:none}
.cal-cell.sel .dots i{background:#fff;box-shadow:0 0 6px #fff}
.cal-cell.sel .dots span{color:#fff}

/* Ricerca */
.search{position:relative}
.search>svg{position:absolute;left:15px;top:14px;color:var(--color-faint);pointer-events:none}
.search>.input{padding-left:44px;border-radius:999px;min-height:50px}

.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100vw - 32px);bottom:calc(var(--tabs-h) + 104px + env(safe-area-inset-bottom));z-index:40;background:var(--glass-solid);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-border);color:var(--color-text);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .35s var(--spring)}
.toast[data-tipo="ok"]::before{content:"✓";display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:50%;background:linear-gradient(135deg,#10b981,#34d399);color:#fff;font-size:12px}
.toast[data-tipo="err"]{background:linear-gradient(135deg,rgba(244,63,94,.92),rgba(255,107,107,.92));color:#fff;border-color:transparent}
.layer~.toast{bottom:calc(92px + env(safe-area-inset-bottom))}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}

#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 20px}
.login-card{width:100%;max-width:380px;padding:30px 24px;display:flex;flex-direction:column;gap:14px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:popIn .5s var(--ease)}
.login-card h1{font-size:40px}
.login-logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:var(--glow);margin-bottom:6px}
.banner{padding:12px 14px;background:var(--st-warn-bg);color:var(--st-warn);font-size:13px;border-radius:var(--r-md)}

/* ===== Pagamenti ===== */
.tag-pay-due{background:var(--pay-due-bg);color:var(--pay-due);border-color:color-mix(in srgb,var(--pay-due) 30%,transparent)}
.tag-pay-dep{background:var(--pay-dep-bg);color:var(--pay-dep);border-color:color-mix(in srgb,var(--pay-dep) 30%,transparent)}
.tag-pay-ok{background:var(--pay-ok-bg);color:var(--pay-ok);border-color:color-mix(in srgb,var(--pay-ok) 30%,transparent)}
.tag-in{background:var(--in-bg);color:var(--in);border-color:color-mix(in srgb,var(--in) 30%,transparent)}
.tag-out{background:var(--out-bg);color:var(--out);border-color:color-mix(in srgb,var(--out) 30%,transparent)}
.tag-saldato{background:var(--st-ann-bg);color:var(--color-muted)}
.tag-saldato::before{content:"✓";width:auto;height:auto;background:none;box-shadow:none;font-size:11px}
.totali{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.totale{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:var(--r-md);font-size:12px;font-weight:700;letter-spacing:.02em;border:1px solid transparent}
.totale>span{display:flex;align-items:center;gap:6px}
.totale b{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.totale.in{background:var(--in-bg);color:var(--in);border-color:color-mix(in srgb,var(--in) 30%,transparent)}
.totale.out{background:var(--out-bg);color:var(--out);border-color:color-mix(in srgb,var(--out) 30%,transparent)}
.seg-mov>button{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.seg-mov>button>span{display:flex;align-items:center;gap:5px}
.seg-mov>button small{font-size:11px;font-weight:500;opacity:.85}
.seg-mov>button[data-m="entrata"][aria-pressed="true"]{background:linear-gradient(135deg,#059669,#34d399);box-shadow:0 4px 16px rgba(16,185,129,.35)}
.tag-tipo{color:var(--tt);background:color-mix(in srgb,var(--tt) 15%,transparent);border-color:color-mix(in srgb,var(--tt) 30%,transparent)}
[data-tipo="cliente"]{--tt:var(--t-cli)}[data-tipo="fornitore"]{--tt:var(--t-for)}[data-tipo="tecnico"]{--tt:var(--t-tec)}[data-tipo="rappresentante"]{--tt:var(--t-rap)}
.seg-tipo{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r-md)}
.seg-tipo>button{border-radius:calc(var(--r-md) - 4px)}
.seg-tipo>button[aria-pressed="true"]{background:var(--tt);color:var(--t-on);box-shadow:0 4px 14px color-mix(in srgb,var(--tt) 40%,transparent)}
.filtri-tipo{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.filtri-tipo::-webkit-scrollbar{display:none}
.filtri-tipo>button{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--glass-border);background:var(--input-bg);color:var(--color-muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation}
.filtri-tipo>button[aria-pressed="true"]{color:var(--color-text);border-color:var(--tt,var(--accent));background:color-mix(in srgb,var(--tt,var(--accent)) 20%,transparent)}
.filtri-tipo>button small{opacity:.7;margin-left:4px}
.lista-rate{display:flex;flex-direction:column;gap:10px}
.scan-assegni{padding:12px;display:flex;flex-direction:column;gap:8px;border-radius:var(--r-md)}
.btn-assegni{align-self:flex-start;min-height:36px;padding:4px 0;font-size:13px;margin-top:2px}
.rata{padding:12px;display:flex;flex-direction:column;gap:10px;border-radius:var(--r-md)}
.rata-testa{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rata-pagata{min-height:40px;padding:6px 12px;font-size:13px}
.rata-pagata[aria-pressed="true"]{background:var(--pay-ok-bg);color:var(--pay-ok);border-color:color-mix(in srgb,var(--pay-ok) 35%,transparent)}
.rata-pagata[aria-pressed="false"] svg{opacity:.35}
.mandanti{display:flex;flex-direction:column;gap:8px}
.mandante{display:flex;gap:8px;align-items:center}
.mandante>.input{flex:1;min-width:0}
.mandante>button{flex:none;width:var(--tap);height:var(--tap)}
.chips-mandanti{display:flex;flex-wrap:wrap;gap:6px}
.chips-mandanti>span{--tt:var(--t-rap);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;color:var(--color-text);background:color-mix(in srgb,var(--tt) 14%,transparent);border:1px solid color-mix(in srgb,var(--tt) 30%,transparent);overflow-wrap:anywhere}
.seg-mov>button[data-m="uscita"][aria-pressed="true"]{background:linear-gradient(135deg,#ea580c,#fb7185);box-shadow:0 4px 16px rgba(249,115,22,.35)}
.importo{font-weight:800;font-size:14px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg-pay>button[data-p="da-saldare"][aria-pressed="true"]{background:linear-gradient(135deg,#059669,#34d399);box-shadow:0 4px 16px rgba(16,185,129,.35)}
.seg-pay[data-mov="uscita"]>button[data-p="da-saldare"][aria-pressed="true"]{background:linear-gradient(135deg,#ea580c,#fb7185);box-shadow:0 4px 16px rgba(249,115,22,.35)}
.seg-pay>button[data-p="acconto"][aria-pressed="true"]{background:linear-gradient(135deg,#f97316,#fbbf24);box-shadow:0 4px 16px rgba(249,115,22,.35)}
.seg-pay>button[data-p="pagato"][aria-pressed="true"]{background:var(--grad);box-shadow:var(--glow-sm)}
.incassi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}

/* ===== Azioni rapide nelle schede (pollice: 48 px) ===== */
.rapide{display:flex;gap:8px;margin-top:4px}
.rapide>a{width:var(--tap);height:var(--tap);flex:none;display:grid;place-items:center;border-radius:14px;background:var(--input-bg);border:1px solid var(--glass-border);color:var(--color-text);text-decoration:none;touch-action:manipulation;transition:transform .2s var(--spring),background .3s ease}
.rapide>a:active{transform:scale(.88)}
.rapide>a svg{width:21px;height:21px}
.rapide .r-wa svg{color:var(--wa);filter:drop-shadow(0 0 6px rgba(37,211,102,.45))}
.rapide .r-tel svg{color:var(--st-comp);filter:drop-shadow(0 0 6px rgba(52,211,153,.45))}
.rapide .r-map svg{color:var(--pay-dep);filter:drop-shadow(0 0 6px rgba(255,146,43,.45))}
.riga .rapide{margin:0}
.azioni-contatto .az-map svg{color:var(--pay-dep);filter:drop-shadow(0 0 6px rgba(255,146,43,.5))}
.azioni-contatto.quattro{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ===== Input intelligente ===== */
.smart{padding:14px;display:flex;flex-direction:column;gap:10px;border-color:rgba(34,211,238,.28)!important;background:linear-gradient(150deg,rgba(59,130,246,.14),rgba(34,211,238,.06))!important}
.smart-riga{display:flex;gap:8px;align-items:flex-end}
.smart-riga textarea{flex:1;min-height:84px}
.smart-riga .btn{flex:none}
.smart .btn-primary.btn-icon,.smart .btn-secondary.btn-icon{border-radius:14px}
.analisi{position:relative;overflow:hidden}
.analisi::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:shimmer 1.1s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.compilato{animation:flash .9s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}100%{box-shadow:0 0 0 10px rgba(34,211,238,0)}}

/* ===== Area di tocco e transizioni ===== */
.chip-oggi::after{content:"";position:absolute;inset:-8px -4px}
.app-item,.riga.cliccabile,.week-day,.cal-cell{touch-action:manipulation}
#main.entra.da-destra>.view{animation:viewInR .34s var(--ease)}
#main.entra.da-sinistra>.view{animation:viewInL .34s var(--ease)}
@keyframes viewInR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes viewInL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm" class="login-card glass">
    <div>
      <div class="login-logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
      <div class="card-kicker kicker-grad">Agenda personale</div>
      <h1>Appuntamenti</h1>
    </div>
    <div id="configBanner" class="banner" hidden>Configurazione Firebase mancante: vedi le istruzioni nella specifica (sezione 9).</div>
    <label class="field"><span>Email</span><input class="input" name="email" type="email" required autocomplete="username"></label>
    <label class="field"><span>Password</span><input class="input" name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" style="min-height:50px;font-size:16px;margin-top:4px">Accedi</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" hidden>
  <main id="main"></main>

const MESI = { gennaio: 0, febbraio: 1, marzo: 2, aprile: 3, maggio: 4, giugno: 5, luglio: 6, agosto: 7, settembre: 8, ottobre: 9, novembre: 10, dicembre: 11 };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Normalizza un numero: '' se vuoto, null se non valido, altrimenti cifre con prefisso +39 se presente.
function normTel(s) {
  const t = String(s ?? '').trim();
  if (t === '') return '';
  if (/[^\d\s+\-.()]/.test(t)) return null;
  const plus = t.startsWith('+');
  let d = t.replace(/\D/g, '');
  let prefisso = false;
  if (d.startsWith('0039')) { d = d.slice(4); prefisso = true; }
  else if (plus && d.startsWith('39')) { d = d.slice(2); prefisso = true; }
  if (d.length < 6 || d.length > 15) return null;
  if (prefisso) return '+39' + d;
  return plus ? '+' + d : d;
}

function isEmail(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s ?? '').trim());
}

function validDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s ?? ''));
  if (!m) return false;
  const y = +m[1], mo = +m[2] - 1, d = +m[3];
  const dt = new Date(y, mo, d);
  return dt.getFullYear() === y && dt.getMonth() === mo && dt.getDate() === d;
}

function validTime(s) {
  return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s ?? ''));
}

function isoOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function addDays(d, k) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + k);
}

function todayISO() {
  return isoOf(new Date());
}

function fmtData(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function fmtCorta(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function capitalizza(s) {
  return String(s ?? '').split(' ').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function storicoOf(a) {
  return Array.isArray(a?.storico) ? [...a.storico] : Object.values(a?.storico || {});
}

// Appuntamenti (non annullati) alla stessa data e ora, escluso exceptId.
function conflitti(apps, data, ora, exceptId) {
  return Object.entries(apps || {}).filter(([id, a]) =>
    id !== exceptId && a.data === data && a.ora === ora && a.stato !== 'annullato');
}

function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function parseData(s, oggi = new Date()) {
  const n = norm(s);
  const base = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate());
  let d = null;
  if (/\boggi\b/.test(n)) d = base;
  else if (/\bdopodomani\b/.test(n)) d = addDays(base, 2);
  else if (/\bdomani\b/.test(n)) d = addDays(base, 1);
  else {
    const wd = Object.keys(GIORNI).find(k => new RegExp('\\b' + k + '\\b').test(n));
    if (wd !== undefined) d = addDays(base, ((GIORNI[wd] - base.getDay() + 7) % 7) || 7);
  }
  if (!d) {
    const mm = new RegExp('\\b(\\d{1,2})\\s+(' + Object.keys(MESI).join('|') + ')\\b').exec(n);
    if (mm) {
      const gg = +mm[1], me = MESI[mm[2]];
      let c = new Date(base.getFullYear(), me, gg);
      if (c.getMonth() !== me) return null;
      if (c < base) c = new Date(base.getFullYear() + 1, me, gg);
      d = c;
    } else {
      const il = /\bil\s+(\d{1,2})\b/.exec(n);
      if (il) {
        const gg = +il[1], mo = base.getMonth();
        let c = new Date(base.getFullYear(), mo, gg);
        if (c.getMonth() !== mo) return null;
        if (c < base) {
          c = new Date(base.getFullYear(), mo + 1, gg);
          if (c.getDate() !== gg) return null;
        }
        d = c;
      }
    }
  }
  return d ? isoOf(d) : null;
}

// Ora HH:MM dal testo grezzo (norm() non va usato: trasformerebbe i due punti).
function parseOra(s) {
  const m = /\b(?:alle?|ore)\s+(\d{1,2})(?:[:.](\d{2})|\s+e\s+(mezza|\d{1,2}))?(?=\s|$)/.exec(String(s ?? '').toLowerCase());
  if (!m) return null;
  const h = +m[1];
  const min = m[2] !== undefined ? +m[2] : (m[3] === 'mezza' ? 30 : (m[3] !== undefined ? +m[3] : 0));
  if (h > 23 || min > 59) return null;
  return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
}

function parseMotivo(s) {
  const m = /\bper\s+(.+)$/i.exec(String(s ?? ''));
  return m ? m[1].trim() : '';
}

const MARCATORI_NOME = '(?:il|alle?|domani|oggi|dopodomani|per|lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica)';

function estraiNome(s) {
  // Il marcatore può trovarsi anche a inizio frase: in quel caso il nome è vuoto.
  return String(s ?? '').trim().split(new RegExp('(?:^|\\s+)' + MARCATORI_NOME + '(?=\\s|$)', 'i'))[0].trim();
}

// Importo in euro da testo libero ("1.250,50", "300 €", 99.5). 0 se vuoto, null se non valido.
function parseImporto(v) {
  if (typeof v === 'number') return Number.isFinite(v) && v >= 0 && v < 1e8 ? Math.round(v * 100) / 100 : null;
  let t = String(v ?? '').replace(/euro|eur|€|\s/gi, '');
  if (!t) return 0;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
  const n = Number(t);
  return n < 1e8 ? Math.round(n * 100) / 100 : null;
}

// Contatto il cui nome contiene tutte le parole pronunciate; null se assente o ambiguo.
function trovaContatto(contatti, nome) {
  const q = norm(nome);
  if (!q) return null;
  const parole = q.split(' ');
  let migliori = [], punti = 0;
  for (const [id, c] of Object.entries(contatti || {})) {
    const cn = norm(c.nome || '');
    if (cn === q) return { id, ...c };
    const parti = cn.split(' ');
    const hit = parole.filter(p => parti.some(x => x.startsWith(p))).length;
    if (hit === parole.length) {
      if (hit > punti) { migliori = [{ id, ...c }]; punti = hit; }
      else if (hit === punti) migliori.push({ id, ...c });
    }
  }
  return migliori.length === 1 ? migliori[0] : null;
}
// ----- Comandi vocali -----
// Riconosce il comando dal testo pronunciato. Restituisce { tipo, ... } con tipo:
// 'nuovo' | 'sposta' | 'chiama' | 'cerca' | 'agenda' | 'sconosciuto'.
// Il testo viene esaminato grezzo (minuscolo) per conservare nomi e orari.
function classificaComando(raw) {
  const testo = String(raw ?? '').trim();
  let m;
  if ((m = /^(?:(?:nuovo|fissa|crea|prendi)\s+(?:un\s+)?appuntamento\s+(?:con\s+)?|(?:nuovo\s+)?promemoria\s+)(.+)$/i.exec(testo))) {
    const rest = m[1];
    return {
      tipo: 'nuovo', nome: estraiNome(rest), data: parseData(rest),
      ora: parseOra(rest), motivo: parseMotivo(rest)
    };
  }
  if ((m = /^(?:sposta|rimanda)\s+(.+?)\s+(a|al|alla|alle|il)\s+(.+)$/i.exec(testo))) {
    const rest = `${m[2]} ${m[3]}`;
    return { tipo: 'sposta', nome: m[1].trim(), data: parseData(rest), ora: parseOra(rest) };
  }
  if ((m = /^(?:chiama|telefona)\s+(?:a\s+)?(.+)$/i.exec(testo))) {
    return { tipo: 'chiama', nome: m[1].trim() };
  }
  if ((m = /^cerca\s+(.+)$/i.exec(testo))) {
    return { tipo: 'cerca', nome: m[1].trim() };
  }
  if (/^(?:mostra\s+)?agenda$/i.test(testo)) {
    return { tipo: 'agenda' };
  }
  return { tipo: 'sconosciuto' };
}

// ----- Email (costruzione messaggio per Gmail API) -----
function pulisciHeader(s) {
  return String(s ?? '').replace(/[\r\n]/g, '');
}

function b64Std(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function b64Url(str) {
  return b64Std(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// Oggetto codificato solo se contiene caratteri non ASCII.
function encHeader(s) {
  return /^[\x00-\x7F]*$/.test(s) ? s : '=?UTF-8?B?' + b64Std(s) + '?=';
}

// Messaggio RFC 2822 in base64url, pronto per messages.send di Gmail.
function buildRaw({ to, oggetto, corpo }) {
  const msg = `To: ${pulisciHeader(to)}\r\n` +
    `Subject: ${encHeader(pulisciHeader(oggetto))}\r\n` +
    'Content-Type: text/plain; charset=UTF-8\r\n' +
    'MIME-Version: 1.0\r\n\r\n' +
    String(corpo ?? '');
  return b64Url(msg);
}

// Pila di livelli: pagine a tutto schermo (dettaglio, moduli) e fogli dal basso (rimanda, email).
// Il tasto Indietro di Android chiude il livello in cima grazie a una voce di cronologia "guardia".
const livelli = [];

function apriLivello(html, { tipo = 'page', anim = '', onMount, refresh } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'layer';
  wrap.innerHTML = tipo === 'sheet'
    ? `<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`
    : `<div class="page ${anim}" role="dialog" aria-modal="true">${html}</div>`;
  if (tipo === 'sheet') wrap.querySelector('.backdrop').addEventListener('click', closeModal);
  document.body.appendChild(wrap);
  const box = wrap.lastElementChild;
  livelli.push({ el: wrap, refresh });
  if (onMount) onMount(box);
  const primo = box.querySelector('[autofocus]');
  if (primo) primo.focus();
  return box;
}

function openPage(html, onMount, opt = {}) { return apriLivello(html, { ...opt, onMount }); }
function openModal(html, onMount) { return apriLivello(html, { tipo: 'sheet', onMount }); }

// Chiusura con animazione: il livello esce subito dalla pila, l'elemento sparisce a fine transizione.
function closeModal() {
  const l = livelli.pop();
  if (!l) return;
  const el = l.el;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
  el.classList.add('chiude');
  el.style.pointerEvents = 'none';
  setTimeout(() => el.remove(), 260);
}

// Ridisegna la schermata in cima (es. dettaglio) dopo una modifica.
function aggiornaLivello() {
  const l = livelli[livelli.length - 1];
  if (l?.refresh) l.refresh(l.el.lastElementChild);
}

function barra(titolo, destra = '') {
  return `<div class="page-bar">
    <button class="btn btn-ghost btn-icon" data-act="chiudi" aria-label="Indietro">${icon('back', 20)}</button>
    <div class="card-kicker" style="flex:1;text-align:center">${titolo}</div>
    <div style="min-width:36px;display:flex;justify-content:flex-end;gap:4px">${destra}</div>
  </div>`;
}

// ===================== DATI =====================
function userRef(path) {
  return db.ref('users/' + S.user.uid + (path ? '/' + path : ''));
}
function attachListeners() {
  detachListeners();
  let caricati = 0;
  ['contatti', 'appuntamenti', 'impostazioni'].forEach(nome => {
    const ref = userRef(nome);
    let primo = true;
    const handler = snap => {
      S[nome] = snap.val() || {};
      render();
      if (primo) { primo = false; if (++caricati === 3) datiPronti(); }
      else controllaPromemoria();
    };
    ref.on('value', handler, err => toast('Errore di lettura dati: ' + err.message));
    S.unsub.push(() => ref.off('value', handler));
  });
}

function detachListeners() {
  S.unsub.forEach(fn => fn());
  S.unsub = [];
}

// Esegue una scrittura: messaggio di successo oppure messaggio d'errore; restituisce il risultato.
function esegui(promessa, msgOk) {
  return promessa
    .then(r => { if (msgOk) toast(msgOk); vibra('ok'); return r; })
    .catch(err => { toast('Errore di salvataggio: ' + err.message); vibra('err'); return 'errore'; });
}

// Validazione del contatto. note viene incluso solo se presente nel modulo: non deve cancellare quella esistente.
function validaContatto(v) {
  const nome = String(v.nome ?? '').trim();
  const tel = normTel(v.telefono);
  const email = String(v.email ?? '').trim();
  if (!nome) return { ok: false, msg: 'Inserisci il nome del contatto' };
  if (nome.length > 120) return { ok: false, msg: 'Il nome è troppo lungo (massimo 120 caratteri)' };
  if (tel === null) return { ok: false, msg: 'Numero di telefono non valido' };
  if (email && !isEmail(email)) return { ok: false, msg: 'Email non valida' };
  if (!tel && !email) return { ok: false, msg: 'Inserisci almeno un telefono o un’email' };
  const dati = { nome, telefono: tel, email };
  if ('note' in v) dati.note = String(v.note ?? '').trim();
  if ('tipo' in v) dati.tipo = tipoDi(v);
  if ('mandanti' in v) dati.mandanti = dati.tipo === 'rappresentante' ? pulisciMandanti(v.mandanti) : [];
  return { ok: true, dati };
}

function validaAppuntamento(v) {
  if (!validDate(v.data)) return { ok: false, msg: 'Data non valida' };
  if (!validTime(v.ora)) return { ok: false, msg: 'Ora non valida' };
  const durata = Number(v.durata);
  if (!Number.isInteger(durata) || durata < 5 || durata > 480) return { ok: false, msg: 'La durata deve essere tra 5 e 480 minuti' };
  const stato = ['programmato', 'confermato', 'completato', 'annullato'].includes(v.stato) ? v.stato : 'programmato';
  const prom = Number(v.promemoria);
  const importo = parseImporto(v.importo);
  if (importo === null) return { ok: false, msg: 'Importo non valido (es. 250 oppure 1.250,50)' };
  const pagamento = PAGAMENTI[v.pagamento] ? v.pagamento : 'da-saldare';
  const movimento = v.movimento === 'uscita' ? 'uscita' : 'entrata';
  const acconto = pagamento === 'acconto' ? parseImporto(v.acconto) : 0;
  if (acconto === null) return { ok: false, msg: 'Acconto non valido' };
  if (importo && acconto > importo) return { ok: false, msg: 'L’acconto non può superare l’importo' };
  return {
    ok: true,
    dati: {
      data: v.data, ora: v.ora, durata, stato, importo, movimento, pagamento, acconto,
      azienda: String(v.azienda ?? '').trim(),
      luogo: String(v.luogo ?? '').trim(),
      motivo: String(v.motivo ?? '').trim(),
      note: String(v.note ?? '').trim(),
      promemoria: Number.isInteger(prom) && prom >= 0 && prom <= 10080 ? prom : promemoriaPredefinito()
    }
  };
}

async function salvaContatto(v, cid) {
  const r = validaContatto(v);
  if (!r.ok) { toast(r.msg); return 'errore'; }
  const id = cid || userRef('contatti').push().key;
  const prec = S.contatti[id] || {};
  const now = Date.now();
  return esegui(userRef('contatti/' + id).set({ ...prec, ...r.dati, creato: prec.creato ?? now, aggiornato: now }), 'Contatto salvato')
    .then(res => res === 'errore' ? 'errore' : id);
}

// Appuntamenti (non annullati) che si sovrappongono all'intervallo indicato, escluso exceptId.
function sovrapposti(data, ora, durata, exceptId) {
  if (!validDate(data) || !validTime(ora)) return [];
  const ini = minuti(ora), fine = ini + (Number(durata) || 30);
  return appuntamentiCompleti().filter(a => a.id !== exceptId && a.data === data && a.stato !== 'annullato' &&
    minuti(a.ora) < fine && ini < minuti(a.ora) + (Number(a.durata) || 30)).sort(byDt);
}

// Salva contatto e appuntamento in un solo update multi-percorso.
// I conflitti sono già stati mostrati nel modulo: qui non si chiede più conferma.
// Restituisce 'ok' o 'errore'.
async function salvaAppuntamento(v, aid) {
  // La nota del modulo appuntamento non deve sovrascrivere la nota del contatto.
  const { note: _notaAppuntamento, ...datiContatto } = v;
  const rc = validaContatto(datiContatto);
  if (!rc.ok) { toast(rc.msg); return 'errore'; }
  const ra = validaAppuntamento(v);
  if (!ra.ok) { toast(ra.msg); return 'errore'; }
  const app = aid ? S.appuntamenti[aid] : null;
  if (aid && !app) { toast('Appuntamento non trovato'); return 'errore'; }

  const { data, ora } = ra.dati;
  const uid = S.user.uid;
  const cid = v.contattoId || userRef('contatti').push().key;
  const appId = aid || userRef('appuntamenti').push().key;
  const contattoPrec = S.contatti[cid] || {};
  const nowMs = Date.now(), nowIso = new Date().toISOString();

  const storico = app ? storicoOf(app) : [{ tipo: 'creato', quando: nowIso }];
  if (app && (app.data !== data || app.ora !== ora)) {
    storico.push({ tipo: 'spostato', da: { data: app.data, ora: app.ora }, a: { data, ora }, quando: nowIso });
  }
  if (app && (app.pagamento || 'da-saldare') !== ra.dati.pagamento) {
    storico.push({ tipo: 'pagamento', da: app.pagamento || 'da-saldare', a: ra.dati.pagamento, quando: nowIso });
  }

  const updates = {};
  updates[`users/${uid}/contatti/${cid}`] = {
    ...contattoPrec, ...rc.dati, creato: contattoPrec.creato ?? nowMs, aggiornato: nowMs
  };
  // Le rate e la modalità si cambiano da "Modifica pagamento": qui restano com'erano.
  const pagRate = app && rateDi(app).length ? { importo: app.importo, rate: rateDi(app), ...statoDaRate(rateDi(app)) } : {};
  updates[`users/${uid}/appuntamenti/${appId}`] = {
    contattoId: cid, ...ra.dati, ...pagRate, ...Object.fromEntries(CAMPI_PAGAMENTO_EXTRA.filter(k => app?.[k]).map(k => [k, app[k]])), rinvii: app?.rinvii || 0, storico,
    creato: app?.creato ?? nowMs, aggiornato: nowMs,
    ...(app?.confermaEmail ? { confermaEmail: app.confermaEmail } : {})
  };
  return esegui(db.ref().update(updates), 'Appuntamento salvato').then(res => res === 'errore' ? 'errore' : 'ok');
}

// Rinvio: data/ora nuove, contatore, storico. Stato 'confermato' torna 'programmato'; completato e annullato restano.
async function rimandaApp(aid, v) {
  const a = S.appuntamenti[aid];
  if (!a) { toast('Appuntamento non trovato'); return 'errore'; }
  if (!validDate(v.data)) { toast('Data non valida'); return 'errore'; }
  if (!validTime(v.ora)) { toast('Ora non valida'); return 'errore'; }
  if (v.data === a.data && v.ora === a.ora) { toast('Scegli una data o un’ora diverse'); return 'errore'; }
  const storico = storicoOf(a);
  storico.push({
    tipo: 'rimandato', da: { data: a.data, ora: a.ora }, a: { data: v.data, ora: v.ora },
    motivo: String(v.motivo ?? '').trim(), quando: new Date().toISOString()
  });
  const stato = a.stato === 'confermato' ? 'programmato' : a.stato;
  return esegui(userRef('appuntamenti/' + aid).update({
    data: v.data, ora: v.ora, stato, rinvii: (a.rinvii || 0) + 1, storico, aggiornato: Date.now()
  }), 'Appuntamento rimandato').then(res => res === 'errore' ? 'errore' : 'ok');
}

async function cambiaStato(aid, nuovo) {
  const a = S.appuntamenti[aid];
  if (!a || a.stato === nuovo) return 'errore';
  const storico = storicoOf(a);
  storico.push({ tipo: 'stato', da: a.stato, a: nuovo, quando: new Date().toISOString() });
  return esegui(userRef('appuntamenti/' + aid).update({ stato: nuovo, storico, aggiornato: Date.now() }), 'Stato aggiornato');
}

async function cambiaPagamento(aid, nuovo) {
  const a = S.appuntamenti[aid];
  if (!a || !PAGAMENTI[nuovo] || (a.pagamento || 'da-saldare') === nuovo) return 'errore';
  const storico = storicoOf(a);
  storico.push({ tipo: 'pagamento', da: a.pagamento || 'da-saldare', a: nuovo, quando: new Date().toISOString() });
  return esegui(userRef('appuntamenti/' + aid).update({ pagamento: nuovo, storico, aggiornato: Date.now() }), etichettaPag(a, nuovo));
}

// Lettura con l'IA degli assegni consegnati (foto o PDF, anche più assegni nello stesso file).
function promptAssegni() {
  return `Nell'allegato ci sono uno o più assegni bancari italiani (foto o PDF). Per ognuno leggi i dati scritti sull'assegno.
Rispondi SOLO con un oggetto JSON: {"assegni": [{"importo": numero in euro (es. 4000.5), "data": "YYYY-MM-DD" (data scritta sull'assegno), "banca": nome della banca, "numero": numero dell'assegno senza il codice dopo il trattino, "beneficiario": a chi è intestato}]}.
Un campo che non si legge va lasciato vuoto (stringa vuota o null). Non inventare dati. Se non ci sono assegni rispondi {"assegni": []}.`;
}
// Foto ridotta a 1600 px in JPEG; PDF così com'è (massimo 10 MB).
function leggiAllegato(file) {
  return new Promise((ok, ko) => {
    if (file.type === 'application/pdf') {
      if (file.size > 10 * 1024 * 1024) { ko(new Error('PDF troppo grande (massimo 10 MB)')); return; }
      const fr = new FileReader();
      fr.onload = () => ok({ mimeType: 'application/pdf', data: String(fr.result).split(',')[1] });
      fr.onerror = () => ko(new Error('File non leggibile'));
      fr.readAsDataURL(file);
      return;
    }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      ok({ mimeType: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('Immagine non leggibile')); };
    img.src = url;
  });
}
async function scansionaAssegni(file) {
  const d = await chiediGemini(promptAssegni(), true, [await leggiAllegato(file)]);
  return (Array.isArray(d.assegni) ? d.assegni : []).map(x => ({
    importo: parseImporto(String(x.importo ?? '')) || 0,
    data: validDate(x.data) ? x.data : '',
    assegno: pulisciAssegno(x),
    beneficiario: String(x.beneficiario ?? '').trim().slice(0, 120)
  })).filter(x => x.importo || x.assegno);
}

// Rate: [{ data, importo, modalita, pagata }]. Stato e acconto del pagamento si ricavano dalle rate pagate,
// così totali, badge e "Da incassare/Da pagare" restano quelli di sempre.
function statoDaRate(rate) {
  const pagato = Math.round(rate.filter(x => x.pagata).reduce((t, x) => t + Number(x.importo || 0), 0) * 100) / 100;
  const tutte = rate.length && rate.every(x => x.pagata);
  return { pagamento: tutte ? 'pagato' : pagato > 0 ? 'acconto' : 'da-saldare', acconto: tutte ? 0 : pagato };
}

// Importo, entrata/uscita, modalità e rate, senza aprire tutto il modulo.
async function salvaPagamento(aid, v, rate) {
  const a = S.appuntamenti[aid];
  if (!a) { toast('Appuntamento non trovato'); return 'errore'; }
  const importo = parseImporto(v.importo);
  if (importo === null) { toast('Importo non valido (es. 250 oppure 1.250,50)'); return 'errore'; }
  const modalita = MODALITA[v.modalita] ? v.modalita : '';
  const fattura = String(v.fattura ?? '').trim().slice(0, 30);
  const dataFattura = validDate(v.dataFattura) ? v.dataFattura : '';
  let pagamento = PAGAMENTI[v.pagamento] ? v.pagamento : 'da-saldare';
  let acconto = 0;
  if (rate) {
    if (!importo) { toast('Inserisci l’importo da dividere in rate'); return 'errore'; }
    for (const [i, x] of rate.entries()) {
      if (!validDate(x.data)) { toast(`Data della rata ${i + 1} non valida`); return 'errore'; }
      if (!(x.importo > 0)) { toast(`Importo della rata ${i + 1} non valido`); return 'errore'; }
    }
    const somma = Math.round(rate.reduce((t, x) => t + x.importo, 0) * 100) / 100;
    if (Math.abs(somma - importo) > 0.009) { toast(`Le rate fanno ${euro(somma)}, ma l’importo è ${euro(importo)}`); return 'errore'; }
    ({ pagamento, acconto } = statoDaRate(rate));
  } else {
    acconto = pagamento === 'acconto' ? parseImporto(v.acconto) : 0;
    if (acconto === null) { toast('Acconto non valido'); return 'errore'; }
    if (importo && acconto > importo) { toast('L’acconto non può superare l’importo'); return 'errore'; }
  }
  const storico = storicoOf(a);
  if ((a.pagamento || 'da-saldare') !== pagamento) {
    storico.push({ tipo: 'pagamento', da: a.pagamento || 'da-saldare', a: pagamento, quando: new Date().toISOString() });
  }
  return esegui(userRef('appuntamenti/' + aid).update({
    importo, movimento: v.movimento === 'uscita' ? 'uscita' : 'entrata', pagamento, acconto, modalita, fattura, dataFattura,
    assegno: !rate && modalita === 'assegno' ? pulisciAssegno(v.assegno) : null,
    rate: rate ? rate.map(x => ({ data: x.data, importo: x.importo, modalita: x.modalita || '', pagata: !!x.pagata, ...(x.assegno ? { assegno: pulisciAssegno(x.assegno) } : {}) })) : null,
    storico, aggiornato: Date.now()
  }), 'Pagamento aggiornato');
}

// Segna o toglie il pagamento di una rata dal dettaglio.
async function segnaRata(aid, i) {
  const a = S.appuntamenti[aid];
  const rate = rateDi(a);
  if (!rate[i]) return 'errore';
  rate[i] = { ...rate[i], pagata: !rate[i].pagata };
  const nuovo = statoDaRate(rate);
  const storico = storicoOf(a);
  storico.push({ tipo: 'pagamento', da: a.pagamento || 'da-saldare', a: nuovo.pagamento, rata: i + 1, quando: new Date().toISOString() });
  return esegui(userRef('appuntamenti/' + aid).update({ rate, ...nuovo, storico, aggiornato: Date.now() }),
    `Rata ${i + 1} ${rate[i].pagata ? (movimentoDi(a) === 'uscita' ? 'pagata' : 'incassata') : 'da saldare'}`);
}

// ===================== PREFERENZE LOCALI E ASSISTENTE IA =====================
// Le preferenze restano solo in questo browser. Se lo storage è bloccato, l'app continua a funzionare.
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage non disponibile */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage non disponibile */ } }

// Feedback aptico: tocco breve, doppio impulso per le conferme, impulso più lungo per gli errori.
// Su iPhone il browser non supporta la vibrazione: la funzione semplicemente non fa nulla.
const vibrazioneSupportata = () => typeof navigator.vibrate === 'function';
function vibra(tipo = 'tocco') {
  if (!vibrazioneSupportata() || lsGet('vibrazione') === 'off') return;
  try { navigator.vibrate(tipo === 'ok' ? [12, 60, 18] : tipo === 'err' ? [35, 50, 35] : 10); } catch (e) { /* ignorato */ }
}

// Il tema scuro è la base; "auto" segue il telefono.
function applicaTema(t) {
  const scuro = t === 'scuro' || (t === 'auto' && !matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.dataset.theme = scuro ? 'dark' : 'light';
  $('meta[name="theme-color"]').content = scuro ? '#06070d' : '#f3f4fb';
}
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => applicaTema(lsGet('tema') || 'scuro'));

const MODELLO_IA_PREDEFINITO = 'gemini-2.5-flash';

// Chiamata all'API Gemini. Con comeJson restituisce un oggetto, altrimenti il testo.
// allegati: [{ mimeType, data }] in base64 (foto o PDF), mandati insieme al testo.
async function chiediGemini(prompt, comeJson = true, allegati = []) {
  const chiave = lsGet('gemini_key');
  if (!chiave) throw new Error('chiave mancante');
  const modello = lsGet('gemini_model') || MODELLO_IA_PREDEFINITO;
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modello) + ':generateContent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': chiave },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }, ...allegati.map(x => ({ inlineData: x }))] }],
      generationConfig: comeJson ? { temperature: 0.2, responseMimeType: 'application/json' } : { temperature: 0.4 }
    })
  });
  if (!r.ok) throw new Error('Gemini ' + r.status);
  const j = await r.json();
  const testo = (j?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  if (!testo) throw new Error('risposta vuota');
  if (!comeJson) return testo;
  const m = /\{[\s\S]*\}/.exec(testo);
  if (!m) throw new Error('formato non valido');
  try { return JSON.parse(m[0]); } catch (e) { throw new Error('formato JSON non valido'); }
}

// Messaggio comprensibile per l'utente, senza dettagli tecnici.
function messaggioIA(err) {
  const m = String(err?.message || '');
  if (m.includes('chiave mancante')) return 'Inserisci la chiave Gemini nelle Impostazioni';
  if (/Gemini (400|401|403)/.test(m)) return 'Chiave Gemini non valida: controllala nelle Impostazioni';
  if (m.includes('Gemini 429')) return 'Troppe richieste: riprova tra un minuto';
  if (m.includes('formato') || m.includes('risposta vuota')) return 'L’assistente non ha capito: prova a riscrivere il messaggio';
  return 'Assistente IA non disponibile. Controlla la connessione.';
}

function promptSmart(testo) {
  const oggi = todayISO();
  return `Sei l'assistente di un'agenda di lavoro con appuntamenti, scadenze e promemoria. Oggi è ${fmtData(oggi)} (data ISO ${oggi}).
Dal messaggio seguente, scritto o dettato a voce, estrai i dati. Rispondi SOLO con un oggetto JSON con queste chiavi:
- "titolo": breve descrizione di cosa fare, es. "Saldo fattura" o "Sopralluogo sanitari". Non ripetere data, ora, nome e luogo
- "data": formato YYYY-MM-DD. Per "domani", "giovedì", "lunedì prossimo" calcola la prossima occorrenza dopo oggi. Vuota se assente
- "ora": formato HH:MM a 24 ore, vuota se assente
- "nome_cliente": nome e cognome della persona o del cliente, vuoto se assente
- "tipo_contatto": "cliente", "fornitore", "tecnico" o "rappresentante" se il messaggio lo dice o si capisce chiaramente, altrimenti vuoto
- "luogo": città, indirizzo o posto, es. "Rutigliano Ufficio", vuoto se assente
- "importo": numero in euro (es. 250.5), null se assente
- "movimento": "entrata" se è un importo da incassare (un cliente deve pagare), "uscita" se è da pagare (fattura di un fornitore, tassa, affitto, scadenza passiva); vuoto se non c'è importo
- "stato_pagamento": "da-saldare", "acconto" oppure "pagato"; vuoto se non indicato
- "acconto": numero in euro già versato, null se assente
- "telefono", "email", "azienda", "note": stringhe, vuote se assenti
- "durata": numero intero di minuti, 30 se non indicata
Non inventare dati mancanti.

Messaggio:
"""
${testo}
"""`;
}

// Accetta sia le chiavi nuove (titolo, nome_cliente, importo...) sia quelle precedenti (motivo, nome).
function pulisciDatiIA(d) {
  const durata = Number(d.durata);
  const importo = parseImporto(d.importo ?? '') || 0;
  const acconto = parseImporto(d.acconto ?? '') || 0;
  const sp = norm(d.stato_pagamento ?? d.pagamento ?? '');
  const pagamento = /accont/.test(sp) ? 'acconto' : /pagat|saldat/.test(sp) ? 'pagato' : (sp || importo ? 'da-saldare' : '');
  return {
    nome: String(d.nome_cliente ?? d.nome ?? '').trim(),
    telefono: String(d.telefono ?? '').trim(),
    email: String(d.email ?? '').trim(),
    tipo: TIPI_CONTATTO[norm(d.tipo_contatto ?? '')] ? norm(d.tipo_contatto) : undefined,
    azienda: String(d.azienda ?? '').trim(),
    data: validDate(d.data) ? d.data : undefined,
    ora: validTime(d.ora) ? d.ora : undefined,
    durata: Number.isInteger(durata) && durata >= 5 && durata <= 480 ? durata : 30,
    luogo: String(d.luogo ?? '').trim(),
    motivo: String(d.titolo ?? d.motivo ?? '').trim(),
    note: String(d.note ?? '').trim(),
    importo: importo || undefined,
    acconto: acconto || undefined,
    pagamento: pagamento || (acconto ? 'acconto' : undefined),
    movimento: /uscit|pagar|passiv/.test(norm(d.movimento ?? '')) ? 'uscita' : (importo ? 'entrata' : undefined)
  };
}

// Data e ora locali nel formato compatto usato da Google Calendar e iCalendar.
function stampDt(data, minutiTot) {
  const d = addDays(isoToDate(data), Math.floor(minutiTot / 1440));
  const m = minutiTot % 1440;
  return isoOf(d).replace(/-/g, '') + 'T' + hhmm(m).replace(':', '') + '00';
}

function titoloApp(a, c) {
  return [a.motivo, c.nome].filter(Boolean).join(' · ') || 'Appuntamento';
}

function linkGoogleCalendar(a, c) {
  const ini = minuti(a.ora);
  const p = new URLSearchParams({
    action: 'TEMPLATE',
    text: titoloApp(a, c),
    dates: `${stampDt(a.data, ini)}/${stampDt(a.data, ini + (Number(a.durata) || 30))}`,
    details: [a.azienda && 'Azienda: ' + a.azienda, c.telefono && 'Tel: ' + c.telefono, c.email && 'Email: ' + c.email, a.note].filter(Boolean).join('\n'),
    location: a.luogo || '',
    ctz: 'Europe/Rome'
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

// File .ics con tutti gli appuntamenti non annullati: si importa in Google Calendar o in qualsiasi calendario.
function esportaIcs() {
  const escIcs = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const ora = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const righe = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Appuntamenti//IT', 'CALSCALE:GREGORIAN'];
  appuntamentiCompleti().filter(a => a.stato !== 'annullato').forEach(a => {
    const ini = minuti(a.ora);
    righe.push('BEGIN:VEVENT', `UID:${a.id}@appuntamenti`, `DTSTAMP:${ora}`,
      `DTSTART;TZID=Europe/Rome:${stampDt(a.data, ini)}`, `DTEND;TZID=Europe/Rome:${stampDt(a.data, ini + (Number(a.durata) || 30))}`,
      `SUMMARY:${escIcs(titoloApp(a, a.contatto))}`);
    if (a.luogo) righe.push(`LOCATION:${escIcs(a.luogo)}`);
    const det = [a.azienda, a.contatto.telefono, a.note].filter(Boolean).join('\n');
    if (det) righe.push(`DESCRIPTION:${escIcs(det)}`);
    righe.push('END:VEVENT');
  });
  righe.push('END:VCALENDAR');
  const url = URL.createObjectURL(new Blob([righe.join('\r\n')], { type: 'text/calendar' }));
  const link = Object.assign(document.createElement('a'), { href: url, download: `appuntamenti-${todayISO()}.ics` });
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('File del calendario scaricato');
}

const SCELTE_PROMEMORIA = [[0, 'Nessuno'], [10, '10 minuti prima'], [30, '30 minuti prima'], [60, '1 ora prima'], [120, '2 ore prima'], [1440, 'Il giorno prima']];
const etichettaPromemoria = m => (SCELTE_PROMEMORIA.find(([v]) => v === m) || [m, `${m} minuti prima`])[1];

function promemoriaPredefinito() {
  const v = Number(lsGet('prom_default') ?? 60);
  return Number.isInteger(v) && v >= 0 ? v : 60;
}
const promemoriaDi = a => (Number.isInteger(a.promemoria) ? a.promemoria : promemoriaPredefinito());
const istante = (data, ora) => isoToDate(data).getTime() + minuti(ora) * 60000;

function prossimiPromemoria(giorni = 7) {
  const ora = Date.now(), limite = ora + giorni * 86400000;
  return appuntamentiCompleti()
    .filter(a => !CHIUSI.includes(a.stato) && promemoriaDi(a) > 0)
    .map(a => ({ ...a, quando: istante(a.data, a.ora) - promemoriaDi(a) * 60000 }))
    .filter(a => istante(a.data, a.ora) > ora && a.quando < limite)
    .sort((x, y) => x.quando - y.quando);
}

const notificheSupportate = () => 'Notification' in window;

async function mostraNotifica(a) {
  const c = a.contatto || {};
  const titolo = `${a.ora} · ${titoloApp(a, c)}`;
  const corpo = [etichettaGiorno(a.data), a.luogo].filter(Boolean).join(' · ');
  if (notificheSupportate() && Notification.permission === 'granted') {
    try {
      const reg = await navigator.serviceWorker?.getRegistration();
      if (reg) { await reg.showNotification(titolo, { body: corpo, tag: a.id, icon: 'icon.svg', data: { id: a.id } }); return; }
      new Notification(titolo, { body: corpo, tag: a.id });
      return;
    } catch (e) { /* si ripiega sul messaggio in pagina */ }
  }
  if (document.visibilityState === 'visible') toast('Promemoria: ' + titolo);
}

function controllaPromemoria() {
  if (!S.user) return;
  const ora = Date.now();
  appuntamentiCompleti().forEach(a => {
    if (CHIUSI.includes(a.stato)) return;
    const prom = promemoriaDi(a);
    if (!prom) return;
    const inizio = istante(a.data, a.ora);
    const chiave = 'notif:' + a.id, firma = `${a.data} ${a.ora} ${prom}`;
    if (ora >= inizio - prom * 60000 && ora < inizio && lsGet(chiave) !== firma) {
      lsSet(chiave, firma);
      mostraNotifica(a);
    }
  });
}

async function attivaNotifiche() {
  if (!notificheSupportate()) { toast(suIphoneDaBrowser() ? 'Su iPhone aggiungi prima l’app alla schermata Home' : 'Notifiche non disponibili su questo browser'); return; }
  const esito = await Notification.requestPermission();
  const push = esito === 'granted' && await iscriviPush();
  toast(esito !== 'granted' ? 'Notifiche bloccate: abilitale dalle impostazioni del browser' : push ? 'Notifiche attivate, anche ad app chiusa' : 'Notifiche attivate (solo ad app aperta)');
  aggiornaLivello();

// ----- Notifiche push: arrivano anche ad app chiusa -----
// L'app salva l'iscrizione del dispositivo in users/<uid>/push; ogni 5 minuti
// scripts/push-promemoria.mjs (GitHub Actions) invia i promemoria arrivati all'ora giusta.
const pushSupportato = () => notificheSupportate() && 'serviceWorker' in navigator && 'PushManager' in window;
const suIphoneDaBrowser = () => /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone;
const pushAttivo = () => Boolean(lsGet('push_id')) && notificheSupportate() && Notification.permission === 'granted';

function chiaveVapid() {
  const b = atob((VAPID_PUBLIC_KEY + '='.repeat((4 - VAPID_PUBLIC_KEY.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, ch => ch.charCodeAt(0));
}

// Iscrive questo dispositivo (o rinnova l'iscrizione) e la salva; restituisce true se le push sono attive.
async function iscriviPush() {
  if (!pushSupportato() || Notification.permission !== 'granted' || !S.user) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chiaveVapid() });
    const j = sub.toJSON();
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(j.endpoint)));
    const id = btoa(String.fromCharCode(...hash.slice(0, 12))).replace(/\+/g, '-').replace(/\//g, '_');
    const vecchio = lsGet('push_id');
    if (vecchio && vecchio !== id) userRef('push/' + vecchio).remove().catch(() => {});
    await userRef('push/' + id).set({ endpoint: j.endpoint, keys: j.keys, dispositivo: navigator.userAgent.slice(0, 160), aggiornato: Date.now() });
    lsSet('push_id', id);
    return true;
  } catch (e) {
    return false;
  }
}

async function provaPush() {
  if (!(await iscriviPush())) { toast('Notifiche push non disponibili su questo dispositivo'); return; }
  await esegui(userRef('pushProva').set(Date.now()), 'Prova richiesta: chiudi pure l’app, la notifica arriva entro qualche minuto');
}

// Stesso giorno k mesi dopo; se il mese è più corto si usa l'ultimo giorno (31/01 → 28/02).
function piuMesi(iso, k) {
  const [y, m, d] = iso.split('-').map(Number);
  const ultimo = new Date(Date.UTC(y, m - 1 + k + 1, 0)).getUTCDate();
  return new Date(Date.UTC(y, m - 1 + k, Math.min(d, ultimo))).toISOString().slice(0, 10);
}
// Rate uguali in centesimi; l'ultima assorbe l'arrotondamento.
function dividiRate(totale, n, prima, ogni) {
  const cent = Math.round(totale * 100), base = Math.floor(cent / n);
  return Array.from({ length: n }, (_, i) => ({ data: piuMesi(prima, i * ogni), importo: (i === n - 1 ? cent - base * (n - 1) : base) / 100 }));
}
const euro = n => Number(n || 0).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
const movimentoDi = a => (a.movimento === 'uscita' ? 'uscita' : 'entrata');
