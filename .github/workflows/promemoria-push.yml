# Notifiche push dei promemoria e riepilogo del mattino.
# Il cron di GitHub parte solo ogni qualche ora, quindi ogni giro resta acceso per quasi 6 ore
# e controlla gli appuntamenti ogni 2 minuti; alla fine avvia da solo il giro successivo.
# Il cron e l'avvio a mano restano come riserva: un giro nuovo sostituisce quello in corso.
# Serve il secret del repository FIREBASE_DB_SECRET (Settings → Secrets and variables → Actions).
name: Promemoria push

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: promemoria-push
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - name: Controllo ogni 2 minuti per circa 5 ore e 40 minuti
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          fine=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$fine" ]; do
            node scripts/push-promemoria.mjs || echo "Giro non riuscito, riprovo tra 2 minuti"
            sleep 120
          done
      - name: Avvia il giro successivo
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promemoria-push.yml --ref main --repo "$GITHUB_REPOSITORY"
