<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appuntamenti</title>
<style>
:root{--brand:#1f6f8b;--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--muted:#66727f;--line:#dde3ea;--radius:12px;--ok:#2e7d32;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:20px;font-weight:600}
.hdr-actions{display:flex;gap:8px}
.icon{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.icon.on{background:var(--bad)}
main{max-width:760px;margin:0 auto;padding:12px 14px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;padding:10px 18px;font-size:15px;color:var(--muted);cursor:pointer;border-radius:8px}
.tab.active{color:var(--brand);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:8px 0;display:flex;gap:12px}
.card .ora{min-width:62px;font-weight:600}
.card .ora small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.card .corpo{flex:1;min-width:0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.badge.programmato{background:#e3eef5}
.badge.confermato{background:#e4f3e5;color:var(--ok)}
.badge.completato{background:#eceff1;color:var(--muted)}
.badge.annullato{background:#f7e3e2;color:var(--bad);text-decoration:line-through}
.badge.warn{background:#fdf0dc;color:var(--warn)}
.badge.bad{background:#f7e3e2;color:var(--bad)}
.azioni{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn,button.btn{display:inline-block;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.ghost{background:none}
.danger{color:var(--bad);border-color:#efc7c4}
.full{width:100%}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.overlay{align-items:center}.modal{border-radius:16px}}
.modal h2{margin:0 0 10px;font-size:19px}
.modal label{display:block;font-size:14px;color:var(--muted);margin:10px 0}
.modal input,.modal select,.modal textarea,#login input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
.modal textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.err{color:var(--bad);min-height:1.2em;font-size:14px}
.banner{background:#fdf0dc;color:var(--warn);padding:10px;border-radius:8px;font-size:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.giorno{margin:18px 2px 4px;font-size:14px;font-weight:600;color:var(--brand);text-transform:capitalize}
.storico{list-style:none;padding:0;margin:6px 0;font-size:14px}
.storico li{padding:6px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px}
.login-card h1{margin:0 0 14px;font-size:22px;color:var(--brand)}
.login-card label{display:block;font-size:14px;color:var(--muted);margin:10px 0}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>Appuntamenti</h1>
    <div id="configBanner" class="banner" hidden>Configurazione Firebase mancante: vedi le istruzioni nella specifica (sezione 9).</div>
    <label>Email<input name="email" type="email" required autocomplete="username"></label>

    <h1>Appuntamenti</h1>

<div id="toast" class="toast" hidden></div>

<script>
// ===================== CONFIGURAZIONE =====================
const FIREBASE_CONFIG = { apiKey: "AIzaSyBxNlUYmBk551OnWMUj06WL-pd8awovVV8", authDomain: "appuntamenti-511913.firebaseapp.com", databaseURL: "https://appuntamenti-511913-default-rtdb.europe-west1.firebasedatabase.app", projectId: "appuntamenti-511913", storageBucket: "appuntamenti-511913.firebasestorage.app", messagingSenderId: "215870183788", appId: "1:215870183788:web:359cfc5feddbe5f567fb49" };
const GOOGLE_CLIENT_ID = "215870183788-sahmel22cqnd110ff1lrsf8tch3s1lco.apps.googleusercontent.com";
const GMAIL_SCOPES = "https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.readonly";

// Stato applicativo
const S = {
  user: null, contatti: {}, appuntamenti: {}, impostazioni: {},
  filtro: 'da-fare', vista: 'agenda', q: '',
  gmailToken: null, gmailExp: 0, gmailDisponibile: false,
  unsub: []
};

/*=== LOGICA ===*/
const GIORNI = { domenica: 0, lunedi: 1, martedi: 2, mercoledi: 3, giovedi: 4, venerdi: 5, sabato: 6 };
const MESI = { gennaio: 0, febbraio: 1, marzo: 2, aprile: 3, maggio: 4, giugno: 5, luglio: 6, agosto: 7, settembre: 8, ottobre: 9, novembre: 10, dicembre: 11 };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Normalizza un numero: '' se vuoto, null se non valido, altrimenti cifre con prefisso +39 se presente.
function normTel(s) {
  const t = String(s ?? '').trim();
  if (t === '') return '';
  if (/[^\d\s+\-.()]/.test(t)) return null;
  const plus = t.startsWith('+');
  let d = t.replace(/\D/g, '');
  let prefisso = false;
  if (d.startsWith('0039')) { d = d.slice(4); prefisso = true; }
  else if (plus && d.startsWith('39')) { d = d.slice(2); prefisso = true; }
  if (d.length < 6 || d.length > 15) return null;
  if (prefisso) return '+39' + d;
  return plus ? '+' + d : d;
}

function isEmail(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s ?? '').trim());
}

function validDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s ?? ''));
  if (!m) return false;
  const y = +m[1], mo = +m[2] - 1, d = +m[3];
  const dt = new Date(y, mo, d);
  return dt.getFullYear() === y && dt.getMonth() === mo && dt.getDate() === d;
}

function validTime(s) {
  return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s ?? ''));
}

function isoOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function addDays(d, k) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + k);
}

function todayISO() {
  return isoOf(new Date());
}

function fmtData(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function fmtCorta(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function capitalizza(s) {
  return String(s ?? '').split(' ').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function storicoOf(a) {
  return Array.isArray(a?.storico) ? [...a.storico] : Object.values(a?.storico || {});
}

// Appuntamenti (non annullati) alla stessa data e ora, escluso exceptId.
function conflitti(apps, data, ora, exceptId) {
  return Object.entries(apps || {}).filter(([id, a]) =>
    id !== exceptId && a.data === data && a.ora === ora && a.stato !== 'annullato');
}

function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function parseData(s, oggi = new Date()) {
  const n = norm(s);
  const base = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate());
  let d = null;
  if (/\boggi\b/.test(n)) d = base;
  else if (/\bdopodomani\b/.test(n)) d = addDays(base, 2);
  else if (/\bdomani\b/.test(n)) d = addDays(base, 1);
  else {
    const wd = Object.keys(GIORNI).find(k => new RegExp('\\b' + k + '\\b').test(n));
    if (wd !== undefined) d = addDays(base, ((GIORNI[wd] - base.getDay() + 7) % 7) || 7);
  }
  if (!d) {
    const mm = new RegExp('\\b(\\d{1,2})\\s+(' + Object.keys(MESI).join('|') + ')\\b').exec(n);
    if (mm) {
      const gg = +mm[1], me = MESI[mm[2]];
      let c = new Date(base.getFullYear(), me, gg);
      if (c.getMonth() !== me) return null;
      if (c < base) c = new Date(base.getFullYear() + 1, me, gg);
      d = c;
    } else {
      const il = /\bil\s+(\d{1,2})\b/.exec(n);
      if (il) {
        const gg = +il[1], mo = base.getMonth();
        let c = new Date(base.getFullYear(), mo, gg);
        if (c.getMonth() !== mo) return null;
        if (c < base) {
          c = new Date(base.getFullYear(), mo + 1, gg);
          if (c.getDate() !== gg) return null;
        }
        d = c;
      }
    }
  }
  return d ? isoOf(d) : null;
}

// Ora HH:MM dal testo grezzo (norm() non va usato: trasformerebbe i due punti).
function parseOra(s) {
  const m = /\b(?:alle?|ore)\s+(\d{1,2})(?:[:.](\d{2})|\s+e\s+(mezza|\d{1,2}))?(?=\s|$)/.exec(String(s ?? '').toLowerCase());
  if (!m) return null;
  const h = +m[1];
  const min = m[2] !== undefined ? +m[2] : (m[3] === 'mezza' ? 30 : (m[3] !== undefined ? +m[3] : 0));
  if (h > 23 || min > 59) return null;
  return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
}

function parseMotivo(s) {
  const m = /\bper\s+(.+)$/i.exec(String(s ?? ''));
  return m ? m[1].trim() : '';
}

const MARCATORI_NOME = '(?:il|alle?|domani|oggi|dopodomani|per|lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica)';

function estraiNome(s) {
  // Il marcatore può trovarsi anche a inizio frase: in quel caso il nome è vuoto.
  return String(s ?? '').trim().split(new RegExp('(?:^|\\s+)' + MARCATORI_NOME + '(?=\\s|$)', 'i'))[0].trim();
}

// Elenco di indirizzi email digitato dall'utente (virgola, punto e virgola o spazio).
function parseListaEmail(s) {
  return String(s ?? '').split(/[,;\s]+/).map(x => x.trim()).filter(Boolean);
}

// Contatto il cui nome contiene tutte le parole pronunciate; null se assente o ambiguo.
function trovaContatto(contatti, nome) {
  const q = norm(nome);
  if (!q) return null;
  const parole = q.split(' ');
  let migliori = [], punti = 0;
  for (const [id, c] of Object.entries(contatti || {})) {
    const cn = norm(c.nome || '');
    if (cn === q) return { id, ...c };
    const parti = cn.split(' ');
    const hit = parole.filter(p => parti.some(x => x.startsWith(p))).length;
    if (hit === parole.length) {
      if (hit > punti) { migliori = [{ id, ...c }]; punti = hit; }
      else if (hit === punti) migliori.push({ id, ...c });
    }
  }
  return migliori.length === 1 ? migliori[0] : null;
}
// ----- Comandi vocali -----
// Riconosce il comando dal testo pronunciato. Restituisce { tipo, ... } con tipo:
// 'nuovo' | 'sposta' | 'chiama' | 'cerca' | 'agenda' | 'sconosciuto'.
// Il testo viene esaminato grezzo (minuscolo) per conservare nomi e orari.
function classificaComando(raw) {
  const testo = String(raw ?? '').trim();
  let m;
  if ((m = /^(?:nuovo|fissa|crea|prendi)\s+(?:un\s+)?appuntamento\s+(?:con\s+)?(.+)$/i.exec(testo))) {
    const rest = m[1];
    return {
      tipo: 'nuovo', nome: estraiNome(rest), data: parseData(rest),
      ora: parseOra(rest), motivo: parseMotivo(rest)
    };
  }
  if ((m = /^(?:sposta|rimanda)\s+(.+?)\s+(a|al|alla|alle|il)\s+(.+)$/i.exec(testo))) {
    const rest = `${m[2]} ${m[3]}`;
    return { tipo: 'sposta', nome: m[1].trim(), data: parseData(rest), ora: parseOra(rest) };
  }
  if ((m = /^(?:chiama|telefona)\s+(?:a\s+)?(.+)$/i.exec(testo))) {
    return { tipo: 'chiama', nome: m[1].trim() };
  }
  if ((m = /^cerca\s+(.+)$/i.exec(testo))) {
    return { tipo: 'cerca', nome: m[1].trim() };
  }
  if (/^(?:mostra\s+)?agenda$/i.test(testo)) {
    return { tipo: 'agenda' };
  }
  return { tipo: 'sconosciuto' };
}

// ----- Email (costruzione messaggio per Gmail API) -----
function pulisciHeader(s) {
  return String(s ?? '').replace(/[\r\n]/g, '');
}

function b64Std(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function b64Url(str) {
  return b64Std(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// Oggetto codificato solo se contiene caratteri non ASCII.
function encHeader(s) {
  return /^[\x00-\x7F]*$/.test(s) ? s : '=?UTF-8?B?' + b64Std(s) + '?=';
}

// Messaggio RFC 2822 in base64url, pronto per messages.send di Gmail.
function buildRaw({ to, oggetto, corpo }) {
  const msg = `To: ${pulisciHeader(to)}\r\n` +
    `Subject: ${encHeader(pulisciHeader(oggetto))}\r\n` +
    'Content-Type: text/plain; charset=UTF-8\r\n' +
    'MIME-Version: 1.0\r\n\r\n' +
    String(corpo ?? '');
  return b64Url(msg);
}
/*=== FINE LOGICA ===*/

// ===================== UTILITÀ DI BASE =====================
const $ = (sel, root = document) => root.querySelector(sel);

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 3000);
}

function openModal(html, onMount) {
  closeModal();
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap) closeModal(); });
  document.body.appendChild(wrap);
  if (onMount) onMount(wrap.querySelector('.modal'));
  return wrap;
}

function closeModal() {
  const o = $('#overlay');
  if (o) o.remove();
}

// ===================== DATI =====================
function userRef(path) {
  return db.ref('users/' + S.user.uid + (path ? '/' + path : ''));
}
function attachListeners() {
  detachListeners();
  ['contatti', 'appuntamenti', 'impostazioni'].forEach(nome => {
    const ref = userRef(nome);
    const handler = snap => {
      S[nome] = snap.val() || {};
      render();
    };
    ref.on('value', handler, err => toast('Errore di lettura dati: ' + err.message));
    S.unsub.push(() => ref.off('value', handler));
  });
}

function detachListeners() {
  S.unsub.forEach(fn => fn());
  S.unsub = [];
}

// Esegue una scrittura: messaggio di successo oppure messaggio d'errore; restituisce il risultato.
function esegui(promessa, msgOk) {
  return promessa
    .then(r => { if (msgOk) toast(msgOk); return r; })
    .catch(err => { toast('Errore di salvataggio: ' + err.message); return 'errore'; });
}

// Validazione del contatto. note viene incluso solo se presente nel modulo: non deve cancellare quella esistente.
function validaContatto(v) {
  const nome = String(v.nome ?? '').trim();
  const tel = normTel(v.telefono);
  const email = String(v.email ?? '').trim();
  if (!nome) return { ok: false, msg: 'Inserisci il nome del contatto' };
  if (nome.length > 120) return { ok: false, msg: 'Il nome è troppo lungo (massimo 120 caratteri)' };
  if (tel === null) return { ok: false, msg: 'Numero di telefono non valido' };
  if (email && !isEmail(email)) return { ok: false, msg: 'Email non valida' };
  if (!tel && !email) return { ok: false, msg: 'Inserisci almeno un telefono o un’email' };
  const dati = { nome, telefono: tel, email };
  if ('note' in v) dati.note = String(v.note ?? '').trim();
  return { ok: true, dati };
}

function validaAppuntamento(v) {
  if (!validDate(v.data)) return { ok: false, msg: 'Data non valida' };
  if (!validTime(v.ora)) return { ok: false, msg: 'Ora non valida' };
  const durata = Number(v.durata);
  if (!Number.isInteger(durata) || durata < 5 || durata > 480) return { ok: false, msg: 'La durata deve essere tra 5 e 480 minuti' };
  const stato = ['programmato', 'confermato', 'completato', 'annullato'].includes(v.stato) ? v.stato : 'programmato';
  return {
    ok: true,
    dati: {
      data: v.data, ora: v.ora, durata, stato,
      azienda: String(v.azienda ?? '').trim(),
      luogo: String(v.luogo ?? '').trim(),
      motivo: String(v.motivo ?? '').trim(),
      note: String(v.note ?? '').trim()
    }
  };
}

async function salvaContatto(v, cid) {
  const r = validaContatto(v);
  if (!r.ok) { toast(r.msg); return 'errore'; }
  const id = cid || userRef('contatti').push().key;
  const prec = S.contatti[id] || {};
  const now = Date.now();
  return esegui(userRef('contatti/' + id).set({ ...prec, ...r.dati, creato: prec.creato ?? now, aggiornato: now }), 'Contatto salvato')
    .then(res => res === 'errore' ? 'errore' : id);
}

// Salva contatto e appuntamento in un solo update multi-percorso.
// Restituisce 'ok', 'annullato' (utente ha rifiutato il conflitto) o 'errore'.
async function salvaAppuntamento(v, aid) {
  // La nota del modulo appuntamento non deve sovrascrivere la nota del contatto.
  const { note: _notaAppuntamento, ...datiContatto } = v;
  const rc = validaContatto(datiContatto);
  if (!rc.ok) { toast(rc.msg); return 'errore'; }
  const ra = validaAppuntamento(v);
  if (!ra.ok) { toast(ra.msg); return 'errore'; }
  const app = aid ? S.appuntamenti[aid] : null;
  if (aid && !app) { toast('Appuntamento non trovato'); return 'errore'; }

  const { data, ora } = ra.dati;
  if (conflitti(S.appuntamenti, data, ora, aid || null).length &&
      !window.confirm(`Attenzione: alle ${ora} del ${fmtData(data)} c'è già un appuntamento. Salvare comunque?`)) {
    return 'annullato';
  }

  const uid = S.user.uid;
  const cid = v.contattoId || userRef('contatti').push().key;
  const appId = aid || userRef('appuntamenti').push().key;
  const contattoPrec = S.contatti[cid] || {};
  const nowMs = Date.now(), nowIso = new Date().toISOString();

  const storico = app ? storicoOf(app) : [{ tipo: 'creato', quando: nowIso }];
  if (app && (app.data !== data || app.ora !== ora)) {
    storico.push({ tipo: 'spostato', da: { data: app.data, ora: app.ora }, a: { data, ora }, quando: nowIso });
  }

  const updates = {};
  updates[`users/${uid}/contatti/${cid}`] = {
    ...contattoPrec, ...rc.dati, creato: contattoPrec.creato ?? nowMs, aggiornato: nowMs
  };
  updates[`users/${uid}/appuntamenti/${appId}`] = {
    contattoId: cid, ...ra.dati, rinvii: app?.rinvii || 0, storico,
    creato: app?.creato ?? nowMs, aggiornato: nowMs,
    ...(app?.confermaEmail ? { confermaEmail: app.confermaEmail } : {})
  };
  return esegui(db.ref().update(updates), 'Appuntamento salvato').then(res => res === 'errore' ? 'errore' : 'ok');
}

// Rinvio: data/ora nuove, contatore, storico. Stato 'confermato' torna 'programmato'; completato e annullato restano.
async function rimandaApp(aid, v) {
  const a = S.appuntamenti[aid];
  if (!a) { toast('Appuntamento non trovato'); return 'errore'; }
  if (!validDate(v.data)) { toast('Data non valida'); return 'errore'; }
  if (!validTime(v.ora)) { toast('Ora non valida'); return 'errore'; }
  if (v.data === a.data && v.ora === a.ora) { toast('Scegli una data o un’ora diverse'); return 'errore'; }
  if (conflitti(S.appuntamenti, v.data, v.ora, aid).length &&
      !window.confirm(`Attenzione: alle ${v.ora} del ${fmtData(v.data)} c'è già un appuntamento. Rimandare comunque?`)) {
    return 'annullato';
  }
  const storico = storicoOf(a);
  storico.push({
    tipo: 'rimandato', da: { data: a.data, ora: a.ora }, a: { data: v.data, ora: v.ora },
    motivo: String(v.motivo ?? '').trim(), quando: new Date().toISOString()
  });
  const stato = a.stato === 'confermato' ? 'programmato' : a.stato;
  return esegui(userRef('appuntamenti/' + aid).update({
    data: v.data, ora: v.ora, stato, rinvii: (a.rinvii || 0) + 1, storico, aggiornato: Date.now()
  }), 'Appuntamento rimandato').then(res => res === 'errore' ? 'errore' : 'ok');
}

async function cambiaStato(aid, nuovo) {
  const a = S.appuntamenti[aid];
  if (!a || a.stato === nuovo) return 'errore';
  const storico = storicoOf(a);
  storico.push({ tipo: 'stato', da: a.stato, a: nuovo, quando: new Date().toISOString() });
  return esegui(userRef('appuntamenti/' + aid).update({ stato: nuovo, storico, aggiornato: Date.now() }), 'Stato aggiornato');
}

function eliminaApp(aid) {
  return esegui(userRef('appuntamenti/' + aid).remove(), 'Appuntamento eliminato');
}

// Un contatto con appuntamenti non si elimina: restituisce 'bloccato'.
async function eliminaContatto(cid) {
  if (Object.values(S.appuntamenti).some(a => a.contattoId === cid)) {
    toast('Il contatto ha appuntamenti: eliminali o riassegnali prima');
    return 'bloccato';
  }
  return esegui(userRef('contatti/' + cid).remove(), 'Contatto eliminato');
}

async function salvaIndirizziConferma(lista) {
  const puliti = lista.map(s => String(s).trim()).filter(Boolean);
  if (puliti.some(e => !isEmail(e))) { toast('Uno degli indirizzi non è valido'); return 'errore'; }
  return esegui(userRef('impostazioni/indirizziConferma').set(puliti), 'Indirizzi di conferma salvati');
}

const ETICHETTE_STATO = { programmato: 'Programmato', confermato: 'Confermato', completato: 'Completato', annullato: 'Annullato' };
const CHIUSI = ['completato', 'annullato'];
const byDt = (x, y) => (x.data + x.ora).localeCompare(y.data + y.ora);

function contattiOrdinati() {
  return Object.entries(S.contatti).map(([id, c]) => ({ id, ...c }))
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'it'));
}

function appuntamentiCompleti() {
  return Object.entries(S.appuntamenti).map(([id, a]) => ({ id, ...a, contatto: S.contatti[a.contattoId] || {} }));
}

function render() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.v === S.vista));
  if (!S.user) return;
  if (S.vista === 'contatti') renderContatti();
  else renderAgenda();
}

function renderAgenda() {
  const oggi = todayISO();
  let lista = appuntamentiCompleti();
  if (S.filtro === 'da-fare') lista = lista.filter(a => !CHIUSI.includes(a.stato)).sort(byDt);
  else if (S.filtro === 'passati') lista = lista.filter(a => a.data < oggi).sort((x, y) => byDt(y, x));
  else lista.sort(byDt);

  const chip = (f, t) => `<button class="chip ${S.filtro === f ? 'active' : ''}" data-act="filtro" data-f="${f}">${t}</button>`;
  let html = `<div class="chips">${chip('da-fare', 'Da fare')}${chip('passati', 'Passati')}${chip('tutti', 'Tutti')}</div>`;
  if (!lista.length) html += '<p class="muted">Nessun appuntamento in questa vista.</p>';
  let giornoPrec = null;
  lista.forEach(a => {
    if (a.data !== giornoPrec) { html += `<div class="giorno">${esc(fmtData(a.data))}</div>`; giornoPrec = a.data; }
    html += cardAppuntamento(a, oggi);
  });
  $('#main').innerHTML = html;
}

function cardAppuntamento(a, oggi) {
  const c = a.contatto;
  const inRitardo = a.data < oggi && !CHIUSI.includes(a.stato);
  const tel = c.telefono ? `<a class="btn" href="tel:${esc(c.telefono)}">Chiama</a>` : '';
  const mail = c.email ? `<button class="btn" data-act="email" data-app-id="${esc(a.id)}" data-contatto-id="${esc(a.contattoId)}">Email</button>` : '';
  const dettagli = [a.azienda, a.motivo, a.luogo].filter(Boolean).map(esc).join(' · ');
  return `<article class="card">
    <div class="ora">${esc(a.ora)}<small>${esc(a.durata)} min</small></div>
    <div class="corpo">
      <h3>${esc(c.nome || '(contatto eliminato)')}</h3>

      <div class="badges">
        <span class="badge ${esc(a.stato)}">${esc(ETICHETTE_STATO[a.stato] || a.stato)}</span>

    </div>
  </article>`;
}

function etichettaVoce(v) {
  const quando = v.quando ? new Date(v.quando).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : '';
  let t;
  switch (v.tipo) {
    case 'creato': t = 'Creato'; break;
    case 'spostato': t = `Spostato da ${fmtCorta(v.da.data)} ${v.da.ora} a ${fmtCorta(v.a.data)} ${v.a.ora}`; break;
    case 'rimandato': t = `Rimandato da ${fmtCorta(v.da.data)} ${v.da.ora} a ${fmtCorta(v.a.data)} ${v.a.ora}${v.motivo ? ' — ' + v.motivo : ''}`; break;
    case 'stato': t = `Stato: ${ETICHETTE_STATO[v.da] || v.da} → ${ETICHETTE_STATO[v.a] || v.a}`; break;
    case 'email': t = `Email inviata: ${v.oggetto}`; break;
    case 'conferma': t = `Conferma ricevuta da ${v.da}`; break;
    default: t = v.tipo;
  }
  return quando ? `${quando} — ${t}` : t;
}

// ===================== GMAIL =====================
let tokenClient = null;

// Chiamata da onload dello script Google Identity Services.
function initGoogle() {
  if (!GOOGLE_CLIENT_ID || !window.google?.accounts?.oauth2) { S.gmailDisponibile = false; return; }
  S.gmailDisponibile = true;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GMAIL_SCOPES,
    callback: r => {
      if (r.error) { toast('Accesso Gmail non riuscito'); return; }
      S.gmailToken = r.access_token;
      S.gmailExp = Date.now() + (Number(r.expires_in) - 60) * 1000;
      toast('Gmail collegato');
    }
  });
}

function gmailConnect() {
  if (!tokenClient) { toast('Gmail non configurato: manca GOOGLE_CLIENT_ID'); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}

function gmailOk() {
  return !!S.gmailToken && Date.now() < S.gmailExp;
}

async function gmailFetch(path, opts = {}) {
  if (!gmailOk()) throw new Error('ricollega Gmail');
  const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + S.gmailToken, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error('Gmail ' + r.status);
  return r.json();
}

function gmailPulsante() {
  return GOOGLE_CLIENT_ID
    ? '<button class="btn primary" data-act="gmail">Collega Gmail</button>'
    : '<p class="muted">Gmail non configurato.</p>';
}

function headersDi(m) {
  return Object.fromEntries((m.payload?.headers || []).map(x => [x.name.toLowerCase(), x.value]));
}

function dataEmail(h) {
  const t = Date.parse(h.date || '');
  return new Date(Number.isNaN(t) ? Date.now() : t).toISOString();
}

const DETTAGLI_EMAIL = 'format=metadata&metadataHeaders=Subject&metadataHeaders=Date&metadataHeaders=From';

// Composizione: invio via Gmail se collegato, altrimenti client di posta (mailto:).
function openEmail(appId = null, contattoId = null) {
  const a = appId ? S.appuntamenti[appId] : null;

    : `<p class="muted">${GOOGLE_CLIENT_ID ? 'Gmail non collegato: si apre il client di posta.' : 'Gmail non configurato: si apre il client di posta.'}</p>`;

}

async function inviaEmail(f, appId, cid) {
  const to = f.to.value.trim();
  const oggetto = f.oggetto.value.trim();
  const corpo = f.corpo.value;
  if (!isEmail(to)) { toast('Indirizzo email non valido'); return; }
  if (!oggetto) { toast('Inserisci l’oggetto'); return; }
  if (!gmailOk()) { toast('Collega Gmail prima di inviare'); return; }
  try {
    await gmailFetch('messages/send', { method: 'POST', body: JSON.stringify({ raw: buildRaw({ to, oggetto, corpo }) }) });
  } catch (err) {
    toast('Invio non riuscito: ' + err.message);
    return;
  }
  if (appId && S.appuntamenti[appId]) {
    const storico = storicoOf(S.appuntamenti[appId]);
    storico.push({ tipo: 'email', oggetto, quando: new Date().toISOString() });
    await esegui(userRef('appuntamenti/' + appId).update({ storico, aggiornato: Date.now() }));
  }
  closeModal();
  toast('Email inviata');
}

async function caricaPosta(cid) {
  const box = $('#posta');
  const c = S.contatti[cid] || {};
  if (!c.email) { toast('Il contatto non ha un’email'); return; }
  if (!gmailOk()) { box.innerHTML = gmailPulsante(); return; }
  box.innerHTML = '<p class="muted">Caricamento…</p>';
  try {
    const q = encodeURIComponent(`from:${c.email} OR to:${c.email}`);
    const lista = await gmailFetch('messages?maxResults=10&q=' + q);
    const ids = (lista.messages || []).map(m => m.id);
    if (!ids.length) { box.innerHTML = '<p class="muted">Nessuna email trovata.</p>'; return; }
    const dettagli = await Promise.all(ids.map(id => gmailFetch(`messages/${id}?${DETTAGLI_EMAIL}`)));
    box.innerHTML = dettagli.map(m => {
      const h = headersDi(m);
      return `<article class="card"><div class="corpo">
        <h3>${esc(h.subject || '(senza oggetto)')}</h3>
        <p>${esc(h.from || '')} · ${esc(h.date || '')}</p>
        <p>${esc(m.snippet || '')}</p></div></article>`;
    }).join('');
  } catch (err) {
    box.innerHTML = `<p class="err">Impossibile caricare le email: ${esc(err.message)}</p>`;
  }
}

// Indirizzi autorizzati a confermare; predefinito: showroom Mirisa.
function indirizziConferma() {
  const v = S.impostazioni?.indirizziConferma;
  const lista = Array.isArray(v) ? v : (v ? Object.values(v) : []);
  return lista.length ? lista : ['mirisa.ceramiche@gmail.com'];
}

// Cerca nella posta degli indirizzi autorizzati, dopo la creazione, le email riferite al contatto o all'azienda.
// Non cambia lo stato: mostra le conferme e l'utente sceglie.
async function caricaConferme(aid) {
  const box = $('#conferme');
  const a = S.appuntamenti[aid];
  if (!box || !a) return;
  if (!gmailOk()) { box.innerHTML = gmailPulsante(); return; }
  const c = S.contatti[a.contattoId] || {};
  const chiavi = [c.nome, c.email, a.azienda].filter(Boolean).map(norm).filter(Boolean);
  const dopo = Math.floor((a.creato || 0) / 1000);
  box.innerHTML = '<p class="muted">Ricerca conferme…</p>';
  try {
    const trovati = [];
    for (const mitt of indirizziConferma()) {
      const lista = await gmailFetch('messages?maxResults=20&q=' + encodeURIComponent(`from:${mitt} after:${dopo}`));
      for (const m of (lista.messages || [])) {
        trovati.push(await gmailFetch(`messages/${m.id}?${DETTAGLI_EMAIL}`));
      }
    }
    const compatibili = trovati.filter(d => {
      const h = headersDi(d);
      const testo = norm(`${h.subject || ''} ${d.snippet || ''} ${h.from || ''}`);
      return chiavi.some(k => testo.includes(k));
    });
    box.innerHTML = compatibili.length
      ? compatibili.map(d => {
          const h = headersDi(d);
          return `<article class="card"><div class="corpo">
            <h3>${esc(h.subject || '(senza oggetto)')}</h3>
            <p>Da ${esc(h.from || '')} · ${esc(h.date || '')}</p>
            <div class="azioni">
              <button class="btn primary" data-act="segnaConfermato" data-id="${esc(aid)}"
                data-msg="${esc(d.id)}" data-da="${esc(h.from || '')}" data-quando="${esc(dataEmail(h))}">Segna confermato</button>
            </div></div></article>`;
        }).join('')
      : '<p class="muted">Nessuna conferma riconosciuta dagli indirizzi autorizzati.</p>';
  } catch (err) {
    box.innerHTML = `<p class="err">Impossibile cercare le conferme: ${esc(err.message)}</p>`;
  }
}

// Stato 'confermato' solo su scelta esplicita dell'utente; salva la conferma.
async function segnaConfermato(aid, conf) {
  const a = S.appuntamenti[aid];
  if (!a) return 'errore';
  if (CHIUSI.includes(a.stato)) { toast('Appuntamento già chiuso'); return 'errore'; }
  const nowIso = new Date().toISOString();
  const storico = storicoOf(a);
  if (a.stato !== 'confermato') storico.push({ tipo: 'stato', da: a.stato, a: 'confermato', quando: nowIso });
  storico.push({ tipo: 'conferma', da: conf.da, quando: conf.quando });
  return esegui(userRef('appuntamenti/' + aid).update({
    stato: 'confermato',
    confermaEmail: { messaggioId: conf.messaggioId, da: conf.da, quando: conf.quando },
    storico, aggiornato: Date.now()
  }), 'Appuntamento confermato');
}

// ===================== AZIONI =====================
const ACTIONS = {
  nav: d => { S.vista = d.v; render(); window.scrollTo(0, 0); },
  logout: () => auth.signOut(),
  nuovoApp: () => { if (typeof openAppForm === 'function') openAppForm({}); },
  voce: () => { if (typeof voiceStart === 'function') voiceStart(); }
};

Object.assign(ACTIONS, {
  modificaApp: d => { if (typeof openAppForm === 'function') openAppForm({ id: d.id }); },
  rimanda: d => { if (typeof openRimanda === 'function') openRimanda(d.id); },
  stato: d => cambiaStato(d.id, d.s).then(r => { if (r !== 'errore') closeModal(); }),
  eliminaApp: d => { if (window.confirm('Eliminare questo appuntamento?')) eliminaApp(d.id).then(res => { if (res !== 'errore') closeModal(); }); },
  modificaContatto: d => { if (typeof openContattoForm === 'function') openContattoForm({ id: d.id }); },
  eliminaContatto: d => { if (window.confirm('Eliminare questo contatto?')) eliminaContatto(d.id); },
  chiudi: () => closeModal(),
  impostazioni: () => openImpostazioni(),
  nuovoContatto: () => openContattoForm({}),
  apriAppContatto: d => openAppForm({ contattoId: d.id }),
  filtro: d => { S.filtro = d.f; render(); },
  apri: d => openDettaglio(d.id),
  email: d => openEmail(d.appId || null, d.contattoId || null),
  posta: d => caricaPosta(d.contattoId),
  gmail: () => gmailConnect(),
  segnaConfermato: d => segnaConfermato(d.id, { messaggioId: d.msg, da: d.da, quando: d.quando })
    .then(r => { if (r !== 'errore') { closeModal(); openDettaglio(d.id); } })
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el.dataset, el);
});

function openImpostazioni() {
  openModal(`
    <h2>Impostazioni</h2>
    <form id="fi">
      <label>Indirizzi di conferma (separati da virgola)
        <textarea name="indirizzi" rows="3">${esc(indirizziConferma().join(', '))}</textarea>
      </label>
      <p class="muted">Le email ricevute da questi indirizzi, riferite a un contatto o a un’azienda, compaiono nella scheda dell’appuntamento come conferme.</p>
      <div class="actions">
        <button type="button" class="btn ghost" data-act="chiudi">Annulla</button>
        <button class="btn primary">Salva</button>
      </div>
    </form>`, m => {
    m.querySelector('#fi').addEventListener('submit', async e => {
      e.preventDefault();

    });

}

// ===================== VOCE =====================
// Prossimo appuntamento aperto del contatto (futuro più vicino, altrimenti il più recente).
function appuntamentoProssimo(cid) {
  const oggi = todayISO();
  const lista = Object.entries(S.appuntamenti)
    .filter(([, a]) => a.contattoId === cid && !CHIUSI.includes(a.stato))
    .sort(([, x], [, y]) => byDt(x, y));
  const futuro = lista.find(([, a]) => a.data >= oggi);
  return (futuro || lista[0] || [null])[0];
}

// Esegue il comando riconosciuto. Il modulo si apre precompilato: il salvataggio resta una conferma dell'utente.
function voiceExec(raw) {
  const c = classificaComando(raw);
  switch (c.tipo) {
    case 'nuovo': {
      const contatto = trovaContatto(S.contatti, c.nome);
      const pre = { data: c.data || undefined, ora: c.ora || undefined, motivo: c.motivo };
      if (contatto) openAppForm({ ...pre, contattoId: contatto.id });
      else openAppForm({ ...pre, nome: capitalizza(c.nome) });
      break;
    }
    case 'sposta': {
      const contatto = trovaContatto(S.contatti, c.nome);
      if (!contatto) { toast(`Nessun contatto trovato per "${c.nome}"`); break; }
      const aid = appuntamentoProssimo(contatto.id);
      if (!aid) { toast(`Nessun appuntamento aperto per ${contatto.nome}`); break; }
      openRimanda(aid, { data: c.data || undefined, ora: c.ora || undefined, motivo: '' });
      break;
    }
    case 'chiama': {
      const contatto = trovaContatto(S.contatti, c.nome);
      if (!contatto) { toast(`Nessun contatto trovato per "${c.nome}"`); break; }
      if (!contatto.telefono) { toast(`${contatto.nome} non ha un numero di telefono`); break; }
      window.location.href = 'tel:' + contatto.telefono;
      break;
    }
    case 'cerca': {
      S.vista = 'contatti';
      S.q = c.nome;
      render();
      const campo = $('#q');
      if (campo) campo.value = c.nome;
      break;
    }
    case 'agenda': {
      S.vista = 'agenda';
      S.filtro = 'da-fare';
      render();
      break;
    }
    default:
      toast("Comando non riconosciuto. Prova: 'nuovo appuntamento con Mario Rossi domani alle 10'");
  }
}

function voiceStart() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Riconoscimento vocale non disponibile su questo browser'); return; }
  const mic = $('#mic');
  const rec = new SR();
  rec.lang = 'it-IT';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    toast('Ho capito: ' + t);
    voiceExec(t);
  };
  rec.onerror = e => toast('Errore vocale: ' + e.error);
  rec.onend = () => mic.classList.remove('on');
  mic.classList.add('on');
  rec.start();
}

// ===================== AUTENTICAZIONE =====================
const configMancante = FIREBASE_CONFIG.apiKey === 'INSERIRE';
let auth = null, db = null;

if (configMancante) {
  $('#configBanner').hidden = false;
  $('#login').hidden = false;
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.database();

  auth.onAuthStateChanged(u => {
    S.user = u;
    if (u) {
      $('#login').hidden = true;
      $('#app').hidden = false;
      attachListeners();
      render();
    } else {
      detachListeners();
      $('#app').hidden = true;
      $('#login').hidden = false;
    }
  });

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    $('#loginErr').textContent = '';
    try {
      await auth.signInWithEmailAndPassword(f.email.value.trim(), f.password.value);
    } catch (err) {
      $('#loginErr').textContent = 'Accesso non riuscito. Controlla email e password.';
    }
  });
}
